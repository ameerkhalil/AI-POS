function boot(){
  $("building").style.display="none";$("setup").classList.add("hide");
  /* Asking for a PIN the owner set four minutes ago, seconds after a launch
     sequence, is a flat ending. Sign the person who built it straight in; the
     lock is there for the next person to touch the terminal. */
  if(AUTO_IN){
    AUTO_IN=false;
    const mgr=CFG.employees.find(e=>byId(CFG.groups,e.groupId)?.perms.includes("config"))
      ||CFG.employees[0];
    if(mgr){ME=mgr;$("lock").classList.remove("on");return startShell()}
  }
  signIn();
}
let AUTO_IN=false;
function signIn(){
  /* Reaching here without a configuration is a bug elsewhere, but a blank
     screen with four dots on it helps nobody diagnose it. */
  if(!CFG||!CFG.site||!Array.isArray(CFG.employees)||!CFG.employees.length){
    $("lock").classList.add("on");
    $("lockName").textContent="Setup incomplete";
    $("lockSub").textContent="";
    $("lockPad").innerHTML="";
    $("lockDots").innerHTML="";
    $("lockMsg").className="lockmsg bad";
    $("lockMsg").innerHTML=`This store has no usable configuration, so there's nobody to sign in.
      <br><br><button class="tbtn2" onclick="localStorage.removeItem('pos_store');location.reload()"
        style="margin-top:10px">Start over</button>`;
    return;
  }
  $("app").classList.remove("on");$("lock").classList.add("on");
  let pin="";
  const dots=()=>$("lockDots").querySelectorAll("i").forEach((d,i)=>d.classList.toggle("f",i<pin.length));
  $("lockName").textContent=CFG.site.name;
  $("lockSub").textContent=`Register ${CFG.site.register} · Store ${CFG.site.store}`;
  $("lockMsg").innerHTML=`Enter your 4-digit code. <span style="color:var(--txt-3)">Try 1234, 2222 or 1111.</span>`;
  $("lockMsg").className="lockmsg";
  $("lockPad").innerHTML=[1,2,3,4,5,6,7,8,9,"",0,"←"].map(k=>
    k===""?`<span></span>`:`<button data-k="${k}">${k}</button>`).join("");
  dots();
  $("lockPad").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==="←")pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;
    dots();
    if(pin.length===4){
      const emp=CFG.employees.find(e=>e.pin===pin);
      if(emp){ME=emp;pin="";startShell()}
      else{$("lockDots").classList.add("bad");$("lockMsg").textContent="That code isn't recognised.";
        $("lockMsg").className="lockmsg bad";
        setTimeout(()=>{pin="";dots();$("lockDots").classList.remove("bad")},430)}
    }});
}
function startShell(){
  $("lock").classList.remove("on");$("app").classList.add("on");
  const mark=$("hdrMark");
  if(mark)mark.innerHTML=CFG.site.logo
    ?`<img src="${esc(CFG.site.logo)}" alt="">`:`<span class="dot"></span>`;
  $("hdrName").textContent=CFG.site.name;
  $("hdrMeta").textContent=`Reg ${CFG.site.register} · Store ${CFG.site.store}`;
  drawRail();themeFromConfig();clock();setInterval(clock,1000);
  $("btnLock").onclick=()=>{ME=null;signIn()};
  $("btnAcct").onclick=accountMenu;
  wireSale();
  if(typeof OPEN_AFTER!=="undefined"&&OPEN_AFTER){
    const t=OPEN_AFTER;OPEN_AFTER=null;
    go("config");TAB=t;drawConfig();
  } else go("sale");
  toast(`Signed in as <b>${esc(ME.n)}</b> · ${esc(byId(CFG.groups,ME.groupId).n)}`);
}
function clock(){
  const d=new Date();
  $("hdrClock").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  $("hdrUser").innerHTML=`<b>${esc(ME?.n||"")}</b>`;
  const due=CFG.reminders.filter(t=>!t.done&&hhmm(d)>=t.at).length;
  const b=document.querySelector('.rbtn[data-v="office"] .badge');
  if(b){b.textContent=due;b.style.display=due?"grid":"none"}
}
function drawRail(){
  $("rail").innerHTML=NAV.map(([k,label,ic,perm])=>
    `<button class="rbtn ${k===VIEW?"on":""}" data-v="${k}" ${perm&&!can(perm)?'disabled style="opacity:.3"':""}>
      <svg viewBox="0 0 24 24">${ICONS[ic]}</svg><span>${label}</span>
      ${k==="office"?`<span class="badge" style="display:none">0</span>`:""}</button>`).join("")
    +`<div class="railfoot"><button class="rbtn" id="railLock"><svg viewBox="0 0 24 24">${ICONS.lock}</svg><span>Lock</span></button></div>`;
  $("rail").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
    const perm=NAV.find(n=>n[0]===b.dataset.v)[3];
    if(perm&&!can(perm))return auth(perm,`Opening ${b.dataset.v}`,()=>go(b.dataset.v));
    go(b.dataset.v)});
  $("railLock").onclick=()=>{ME=null;signIn()};
}
function go(v){
  VIEW=v;drawRail();
  ["vSale","vOffice","vReports","vConfig"].forEach(id=>$(id).classList.remove("on"));
  $({sale:"vSale",office:"vOffice",reports:"vReports",config:"vConfig"}[v]).classList.add("on");
  if(v==="office")drawOffice();
  if(v==="reports")drawReports();
  if(v==="config")drawConfig();
}
function veil(html){
  const el=document.createElement("div");el.className="veil";el.innerHTML=html;
  document.body.appendChild(el);
  el.onclick=e=>{if(e.target===el)el.remove()};
  return el;
}
function toast(html,bad){
  $("statusbar").innerHTML=`<span style="${bad?"color:var(--void)":""}">${html}</span>`
    +`<span style="margin-left:auto;color:var(--txt-3);font-size:12px">${TRAIN?"Training mode · nothing posts":""}</span>`;
}

/* ========================= sale view ========================= */
function wireSale(){
  $("grid").addEventListener("pointerdown",keyBloom);
  $("search").oninput=e=>{FILTER=e.target.value.trim();drawGrid()};
  $("search").onkeydown=e=>{if(e.key==="Enter"){const p=CFG.plus.find(x=>x.upc===FILTER);
    if(p){ring(p);$("search").value="";FILTER="";drawGrid()}}};
  $("tenders").onclick=e=>{const b=e.target.closest(".tender");if(b&&CART.length)tender(byId(CFG.mops,b.dataset.m))};
  renderTenders();renderSubops();renderFkeys();drawMenus();drawGrid();refreshSale();wedge();
  if(THEME.searchLeads!==false&&$("search"))setTimeout(()=>$("search").focus(),120);
  toast("Tap a key, scan a barcode, or search to start a sale.");
}

  if(typeof modOn==="function"&&modOn("giftcards")&&!CFG.mops.some(m=>m.kind==="gift"))
    CFG.mops.push({id:"MOP"+uid(),n:"Gift card",kind:"gift",drawer:false,change:false});

const FKEYS=[["F1","Price check",()=>priceCheck()],["F2","Void line",()=>{if(SEL!=null)voidLine(SEL)}],
  ["F3","Discount",()=>auth("discount","Sale discount",discPrompt)],["F4","No sale",()=>noSale()],
  ["F5","Suspend",()=>hold()],["F6","Recall",()=>recall()],
  ["F7","Return",()=>auth("refund","Return mode",toggleReturn)],["F8","Pay out",()=>auth("payout","Pay out",payOut)]];
function renderFkeys(){

document.addEventListener("keydown",e=>{
  if(VIEW!=="sale"||document.querySelector(".veil"))return;
  const m=/^F([1-8])$/.exec(e.key);
  if(m){e.preventDefault();FKEYS[+m[1]-1][2]()}

function keyBloom(e){
  const b=e.target.closest(".key");if(!b)return;
  const r=b.getBoundingClientRect();
  b.style.setProperty("--px",((e.clientX-r.left)/r.width*100)+"%");
  b.style.setProperty("--py",((e.clientY-r.top)/r.height*100)+"%");
  b.classList.remove("hit");void b.offsetWidth;b.classList.add("hit");
}
function drawMenus(){
  $("menutabs").innerHTML=CFG.menus.map((m,i)=>
    `<button class="mtab ${i===MENU&&!FILTER?"on":""}" data-i="${i}">${esc(m.n)}</button>`).join("");
  $("menutabs").onclick=e=>{const b=e.target.closest(".mtab");
    if(b){MENU=+b.dataset.i;FILTER="";$("search").value="";drawMenus();drawGrid()}};
}
function timeBlocked(p){
  const r=byId(CFG.restricts,p.restrictId);
  if(!r||!r.start||!r.end)return null;
  const d=new Date(),t=d.getHours()*60+d.getMinutes();
  const[sh,sm]=r.start.split(":").map(Number),[eh,em]=r.end.split(":").map(Number);
  const s=sh*60+sm,e=eh*60+em;
  return (s<e?(t>=s&&t<e):(t>=s||t<e))?r:null;
}
function promoFor(p){return (CFG.promos||[]).find(x=>x.on&&x.pluIds.includes(p.id))}
function drawGrid(){
  let keys;
  if(FILTER){const q=FILTER.toLowerCase();
    keys=CFG.plus.filter(p=>p.n.toLowerCase().includes(q)||(p.upc||"").includes(q)).map(p=>({pluId:p.id}))}
  else keys=(CFG.menus[MENU]||{}).keys||[];
  drawMenus();
  if(!keys.length){$("grid").innerHTML=`<div class="empty" style="grid-column:1/-1">
    <svg viewBox="0 0 24 24">${ICONS.search}</svg><br>
    ${FILTER?`Nothing matches “${esc(FILTER)}”.<br>Ring it on the keypad, or add it under Config.`:"This menu has no keys yet.<br>Add some under Config → Menus."}</div>`;return}
  window.__k=i=>{const k=keys[i];k.pump?prepay(k):ring(byId(CFG.plus,k.pluId))};
  const style=(typeof THEME!=="undefined"&&THEME.keyStyle)||"tile";
  $("grid").className="grid ks-"+style;
  $("grid").innerHTML=keys.map((k,i)=>{
    const dly=`animation-delay:${Math.min(i*13,230)}ms`;
    if(k.pump)return`<button class="key pump" style="${dly}" onclick="__k(${i})">
      <span class="kn">${esc(k.label)}</span><span class="kp">Prepay</span></button>`;
    const p=byId(CFG.plus,k.pluId);if(!p)return"";
    const d=byId(CFG.depts,p.deptId),r=byId(CFG.restricts,p.restrictId),pr=promoFor(p),bl=timeBlocked(p);
    const col=k.color||d?.color||"#3E464A",f=[];
    if(r?.minAge)f.push(r.minAge+"+");
    if(p.weighed)f.push("per lb");
    if(p.ebt)f.push("EBT");
    if(p.deposit)f.push("+"+money(p.deposit)+" dep");
    const price=money(p.price)+(p.weighed?" /lb":"");
    const label=k.label||p.n;
    /* A key can occupy two columns or two rows, so the things sold all day are
       the easiest to hit. */
    const span=`${(k.w||1)>1?"grid-column:span 2;":""}${(k.h||1)>1?"grid-row:span 2;":""}`;
    const flags=`${f.length?`<span class="flag">${esc(f.join(" · "))}</span>`:""}${
      p.modIds?.length?`<span class="flag mod">options</span>`:""}${
      pr?`<span class="flag pr">${pr.qty} for ${money(pr.price)}</span>`:""}${
      bl?`<span class="flag pr">blocked now</span>`:""}`;
    const cls=`key ${bl?"blocked":""}`;

    /* Four genuinely different renderings of the same product. */
    if(style==="list")return`<button class="${cls}" onclick="__k(${i})" style="${dly}">
      <span class="swatch" style="background:${col}"></span>
      <span class="kn">${esc(label)}</span>
      <span class="kmeta">${flags}</span>
      <span class="kp num">${price}</span></button>`;
    if(style==="pad")return`<button class="${cls}" onclick="__k(${i})" style="${dly};${span}${keyBg(col)}">
      <span class="kn">${esc(label)}</span>
      <span class="kp num">${price}</span>${flags}</button>`;
    if(style==="card")return`<button class="${cls}" onclick="__k(${i})" style="${dly};${span}">
      <span class="kswatch" style="background:${col}"></span>
      <span class="kbody"><span class="kn">${esc(label)}</span>${flags}</span>
      <span class="kfoot"><span class="kp num">${price}</span><span class="kgo">Add</span></span></button>`;
    return`<button class="${cls}" onclick="__k(${i})" style="${dly};${span}${keyBg(col)}">
      <span class="swatch" style="background:${col};filter:brightness(1.7)"></span>
      <span class="kn">${esc(label)}</span>
      <span><span class="kp num">${price}</span>${flags}</span></button>`;
  }).join("");
}

/* ring pipeline: time block -> weight -> modifiers -> age -> line */
function ring(p){
  if(!p)return;
  const bl=timeBlocked(p);
  if(bl)return alertCard("Sale not allowed",`${p.n} can't be sold right now. ${bl.n}.`);
  if(p.weighed)return ask({t:"Weigh item",p:`Pounds of ${p.n} at $${money(p.price)}/lb.`,num:"1.00",
    done:v=>mods(p,{price:p.price*(+v),note:`${(+v).toFixed(2)} lb @ ${money(p.price)}/lb`})});
  mods(p,{});
}
function mods(p,ex){
  const gs=(p.modIds||[]).map(id=>byId(CFG.modGroups,id)).filter(Boolean);
  if(!gs.length)return ageGate(p,ex);
  const pick={};gs.forEach(g=>pick[g.id]=[]);
  const el=veil(`<div class="card tall" style="max-width:520px"><h3>${esc(p.n)}</h3>
    <p>Base ${money(p.price)}. Options adjust the line price.</p>
    <div class="edwrap" id="mgBody"></div>
    <div class="chg"><span>Line total</span><b id="mgTot">${money(p.price)}</b></div>
    <div class="row"><button class="no" id="mgn">Cancel</button><button class="ok" id="mgy">Add to sale</button></div></div>`);
  const total=()=>p.price+gs.reduce((s,g)=>s+pick[g.id].reduce((t,i)=>t+(g.opts[i].p||0),0),0);
  const paint=()=>{
    $("mgBody").innerHTML=gs.map((g,gi)=>`<div class="modgrp">
      <div class="mgh"><b>${esc(g.n)}</b><i class="${g.required?"req":""}">${g.required?"required":"optional"}${g.multi?" · pick any":""}</i></div>
      <div class="modopts">${g.opts.map((o,oi)=>`<button class="modopt ${pick[g.id].includes(oi)?"on":""}" data-g="${gi}" data-o="${oi}">
        ${esc(o.n)}${o.p?`<em>+${money(o.p)}</em>`:`<em>included</em>`}</button>`).join("")}</div></div>`).join("");
    $("mgTot").textContent=money(total());
    $("mgBody").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
      const g=gs[+b.dataset.g],oi=+b.dataset.o,arr=pick[g.id],at=arr.indexOf(oi);
      if(g.multi){at<0?arr.push(oi):arr.splice(at,1)}else pick[g.id]=at<0?[oi]:[];
      paint()});
  };
  paint();
  el.querySelector("#mgn").onclick=()=>el.remove();
  el.querySelector("#mgy").onclick=()=>{
    const missing=gs.find(g=>g.required&&!pick[g.id].length);
    if(missing)return toastCard(el,`Choose a ${missing.n.toLowerCase()} first.`);
    const chosen=gs.flatMap(g=>pick[g.id].map(i=>g.opts[i].n));
    el.remove();
    ageGate(p,{...ex,price:total()+(ex.price?ex.price-p.price:0),mods:chosen});
  };
}
function toastCard(el,msg){
  let t=el.querySelector(".mgwarn");
  if(!t){t=document.createElement("p");t.className="mgwarn";t.style.cssText="color:var(--warn);margin-top:9px";
    el.querySelector(".card").insertBefore(t,el.querySelector(".row"))}
  t.textContent=msg;
}
function ageGate(p,ex){
  const r=byId(CFG.restricts,p.restrictId);
  if(r?.minAge)return ask({t:"Check ID",p:`${p.n} is ${r.minAge}+. ${r.idScan?"Scan or confirm":"Confirm"} the date of birth on a valid, unexpired ID.`,
    yes:"Verified",no:"Refuse sale",done:()=>add(p,{...ex,note:[ex.note,`ID verified · ${r.minAge}+`].filter(Boolean).join(" · ")})});
  add(p,ex);
}
function add(p,ex={}){
  const line={lid:uid(),pluId:p.id,n:p.n,price:ex.price??p.price,q:1,deptId:p.deptId,
    taxId:byId(CFG.depts,p.deptId)?.taxId,ebt:p.ebt,note:ex.note||null,mods:ex.mods||null,disc:0};
  const m=CART.find(c=>c.pluId===p.id&&!c.note&&!c.mods&&!c.disc&&!ex.note&&!ex.mods);
  if(m){m.q++;FRESH=m.lid}else{CART.push(line);FRESH=line.lid}
  if(p.deposit)CART.push({lid:uid(),n:"Bottle deposit",price:p.deposit,q:1,taxId:"TX0",auto:true,disc:0});
  SEL=null;refreshSale();$("lines").scrollTop=$("lines").scrollHeight;
}
function prepay(k){
  ask({t:"Prepay fuel",p:`How much on ${k.label}?`,num:"30.00",pre:["10","20","30","40","50"],
    done:v=>{CART.push({lid:uid(),n:k.label+" prepay",price:+v,q:1,taxId:"TX0",deptId:"DF",
      note:`Authorize pump to $${money(+v)}`,disc:0});SEL=null;refreshSale()}});
}

/* ========================= totals ========================= */
function calc(){
  let promoOff=0;
  const qty={};CART.forEach(c=>{if(c.pluId)qty[c.pluId]=(qty[c.pluId]||0)+c.q});
  (CFG.promos||[]).filter(p=>p.on&&p.kind==="mixmatch").forEach(pr=>{
    let n=0,unit=[];
    pr.pluIds.forEach(id=>{const plu=byId(CFG.plus,id);
      if(qty[id]){n+=qty[id];for(let i=0;i<qty[id];i++)unit.push(plu.price)}});
    const sets=Math.floor(n/pr.qty);
    if(sets>0){unit.sort((a,b)=>b-a);
      promoOff+=Math.max(0,unit.slice(0,sets*pr.qty).reduce((s,v)=>s+v,0)-sets*pr.price)}
  });
  let sub=0;CART.forEach(c=>sub+=c.price*c.q*(1-(c.disc||0)/100));
  const afterPromo=Math.max(0,sub-promoOff);
  let disc=0;
  if(DISC)disc=DISC.type==="pct"?afterPromo*DISC.v/100:Math.min(DISC.v,afterPromo);
  const net=afterPromo-disc,ratio=sub?net/sub:1,taxes={};
  CART.forEach(c=>{const tr=byId(CFG.taxRates,c.taxId);if(!tr||!tr.rate)return;
    taxes[tr.id]=(taxes[tr.id]||0)+c.price*c.q*(1-(c.disc||0)/100)*ratio*tr.rate/100});
  const taxTotal=Object.values(taxes).reduce((s,v)=>s+v,0),sign=RETURN?-1:1;
  return{sub:sub*sign,promoOff:promoOff*sign,disc:disc*sign,taxes,taxTotal:taxTotal*sign,tot:(net+taxTotal)*sign};
}
const roundNickel=n=>Math.round(n*20)/20;
let TOTANIM=null,TOTVAL=0;
function setTotal(v){
  const el=$("tTot");
  if(TOTANIM)cancelAnimationFrame(TOTANIM);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||Math.abs(v-TOTVAL)<0.005){
    TOTVAL=v;el.textContent=money(v);return}
  const from=TOTVAL,t0=performance.now();
  el.classList.add("tick");
  const step=now=>{const k=Math.min(1,(now-t0)/260),e=1-Math.pow(1-k,3);
    el.textContent=money(from+(v-from)*e);
    if(k<1)TOTANIM=requestAnimationFrame(step);
    else{TOTVAL=v;el.textContent=money(v);el.classList.remove("tick")}};
  TOTANIM=requestAnimationFrame(step);
}
/* Two shells now render the same sale. Everything that changes the cart calls
   this instead of assuming the panel-and-grid layout is on screen. */
function refreshSale(){
  if(typeof THEME!=="undefined"&&THEME.shell==="classic"&&typeof drawClassic==="function")
    return drawClassic();
  drawCart();
}
function drawCart(){
  if(typeof THEME!=="undefined"&&THEME.shell==="classic"&&typeof drawClassic==="function")
    return drawClassic();

    $("lv").onclick=()=>voidLine(SEL);
  }
  const t=calc();
  $("tSub").textContent=money(t.sub);
  $("promoRow").style.display=Math.abs(t.promoOff)>0.001?"flex":"none";
  $("tPromo").textContent="−"+money(Math.abs(t.promoOff));

  if(DISC){$("discLabel").textContent=`Discount (${DISC.type==="pct"?DISC.v+"%":"$"+money(DISC.v)})`;

  $("taxRows").innerHTML=CFG.taxRates.filter(r=>r.rate>0).map(r=>

  document.querySelectorAll(".tender").forEach(b=>{
    const m=byId(CFG.mops,b.dataset.m);

/* ========================= tender ========================= */
/* Modules that reach into the sale hook here. Each one checks whether it is
   switched on first, so a shop that wants none of this sees none of it. */
async function tender(mop){
  const t=calc();let due=Math.abs(t.tot);
  if(!RETURN){
    if(typeof modOn==="function"&&modOn("giftcards")&&mop.kind==="gift"){
      const paid=await redeemGiftCard(due);
      if(paid===null)return;
      due=paid.remaining;
      if(due<=0.005)return finish([{mop:mop.n,amt:paid.used,card:paid.code}],0);
      PART_PAID=[{mop:mop.n,amt:paid.used,card:paid.code}];
    }
    if(typeof modOn==="function"&&modOn("customers")){
      const c=custCfg();
      if(c.ask==="ask"||(c.ask==="card"&&!mop.change))SALE_CUST=await askCustomer();
    }
    if(typeof modOn==="function"&&modOn("tips")&&!mop.change){
      SALE_TIP=await askTip(due);due+=SALE_TIP;
    }
  }
  if(RETURN)return auth("refund","Refund",()=>reasonPrompt("refund","Reason for return",r=>doRefund(mop,due,r)));
  if(mop.ebtOnly){
    const el=CART.filter(c=>c.ebt).reduce((s,c)=>s+c.price*c.q,0);
    if(el<=0)return alertCard("Nothing EBT-eligible","No item in this sale is flagged SNAP-eligible. Mark items under Config → Pricebook.");
    due=Math.min(due,el);
  }
  if(mop.rounds&&CFG.rounding.nickel)due=roundNickel(due);
  if(!mop.change){
    /* Card, EBT and anything else settled on a reader. The sale is only written
       once the reader approves, and the money is only captured after that. */
    const cid=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    cardPayment(mop,due,cid).then(r=>{
      if(!r)return;
      finish([{mop:mop.n,amt:due,intent:r.intent||null,
        brand:r.brand||null,last4:r.last4||null}],0,null,cid);
    });
    return;
  }
  const rd=CFG.rounding.nickel?roundNickel(due):due;
  const quick=[rd,Math.ceil(rd),Math.ceil(rd/5)*5,Math.ceil(rd/10)*10,Math.ceil(rd/20)*20]
    .filter((v,i,a)=>v>0&&a.indexOf(v)===i).slice(0,5);
  const el=veil(`<div class="card"><h3>${esc(mop.n)}</h3>
    <p>Amount due ${money(rd)}.${CFG.rounding.nickel&&Math.abs(rd-due)>0.001?` Rounded to the nickel from ${money(due)}.`:""}</p>
    <input id="cv" class="big num" value="${money(rd)}" inputmode="decimal">
    <div class="opts">${quick.map(v=>`<button data-c="${v}">${Math.abs(v-rd)<0.001?"Exact":"$"+money(v)}</button>`).join("")}</div>
    <div class="chg"><span>Change due</span><b id="chg">0.00</b></div>
    <div class="row"><button class="no" id="cn">Cancel</button><button class="ok" id="cy">Complete sale</button></div>
    <div class="row"><button class="no" id="cs" style="font-size:13px">Split with card</button></div></div>`);
  const inp=el.querySelector("#cv"),out=el.querySelector("#chg");
  const upd=()=>out.textContent=money(Math.max(0,(parseFloat(inp.value)||0)-rd));
  inp.oninput=upd;upd();inp.focus();inp.select();
  el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{inp.value=money(+b.dataset.c);upd()});
  el.querySelector("#cn").onclick=()=>el.remove();
  el.querySelector("#cy").onclick=()=>{const g=parseFloat(inp.value)||0;if(g<rd-0.001)return;
    el.remove();finish([{mop:mop.n,amt:rd,given:g,change:g-rd}],rd-due)};
  el.querySelector("#cs").onclick=()=>{const g=parseFloat(inp.value)||0;if(!(g>0)||g>=rd)return;
    el.remove();finish([{mop:mop.n,amt:g},{mop:"Credit",amt:rd-g}],rd-due)};
}
/* Card refunds go against the original PaymentIntent — the customer doesn't
   re-present the card, because Stripe returns it to whatever they paid with.
   Without an original there is nothing to refund to, so it's cash or nothing. */
async function doRefund(mop,due,reason){
  const orig=RETREF&&RETREF.pays?RETREF.pays.find(p=>p.intent):null;

  if(mop.change||mop.kind==="cash"){
    if(RETREF){
      const paidCash=RETREF.pays.filter(p=>!p.intent).reduce((s,p)=>s+Math.abs(p.amt),0);
      if(paidCash<due-0.001&&orig)
        return confirmCard(`They paid ${money(Math.abs(orig.amt))} by card. Refunding cash instead is
          how card refunds get laundered — most stores don't allow it. Refund to the card instead?`,
          ()=>doRefund(CFG.mops.find(m=>!m.change)||mop,due,reason),
          ()=>finishRefund([{mop:mop.n,amt:-due}],reason));
    }
    if(typeof kickDrawer==="function")kickDrawer();
    return finishRefund([{mop:mop.n,amt:-due}],reason);
  }

  if(!orig){
    return alertCard("No card to refund",
      `This return isn't linked to a card sale, so there's nothing to put the money back on. `
      +`Refund it as cash, or start the return again and find the original receipt.`);
  }
  const cap=Math.abs(orig.amt);
  if(due>cap+0.001)
    return alertCard("More than they paid",
      `That card was charged ${money(cap)}. You can't refund ${money(due)} against it.`);

  const el=veil(`<div class="card"><h3>Refund to card</h3>
    <p>Going back to the ${esc(orig.brand||"card")} ending ${esc(orig.last4||"????")} from sale
      #${RETREF.n}. The customer doesn't need to present it — it returns to whatever they paid with,
      usually within a few business days.</p>
    <div class="chg"><span>Refund</span><b>${money(due)}</b></div>
    <div class="paystate" id="rfState"><span class="spin"></span><span id="rfStep">Sending to Stripe</span></div>
    <div class="row"><button class="no" id="rfc">Cancel</button></div></div>`);
  try{
    const r=await api("/api/pay/refund?store="+STORE_ID,{method:"POST",
      body:{store:STORE_ID,intent:orig.intent,amount:due}});
    el.querySelector("#rfStep").textContent="Refunded";
    el.querySelector("#rfStep").className="ok";
    setTimeout(()=>{el.remove();
      finishRefund([{mop:mop.n,amt:-due,intent:orig.intent,refund:r.refund,
        brand:orig.brand,last4:orig.last4}],reason)},900);
  }catch(e){
    el.querySelector("#rfStep").textContent=e.message||"Stripe refused the refund";
    el.querySelector("#rfStep").className="bad";
    el.querySelector("#rfc").textContent="Close";
  }
  el.querySelector("#rfc").onclick=()=>el.remove();
}
function confirmCard(msg,onCard,onCash){
  const el=veil(`<div class="card"><h3>Refund to the card instead?</h3><p>${esc(msg)}</p>
    <div class="row"><button class="no" id="ccash">Cash anyway</button>
      <button class="ok" id="ccard">Refund the card</button></div></div>`);
  el.querySelector("#ccash").onclick=()=>{el.remove();onCash()};
  el.querySelector("#ccard").onclick=()=>{el.remove();onCard()};
}
function finishRefund(pays,reason){
  const t=calc();
  finish(pays,0,reason);
  RETREF=null;
}

function redeemGiftCard(due){
  const c=gcCfg();
  return new Promise(res=>{
    const el=veil(`<div class="card"><h3>Gift card</h3>
      <p>Enter or scan the card number. ${money(due)} to pay.</p>
      <input id="gcv" class="big num" placeholder="card number">
      <div id="gcr" style="margin-top:12px"></div>
      <div class="row"><button class="no" id="gcn">Cancel</button>
        <button class="ok" id="gcy">Use it</button></div></div>`);
    const inp=el.querySelector("#gcv"),out=el.querySelector("#gcr");
    let card=null;
    inp.oninput=()=>{
      card=c.cards.find(x=>x.code===inp.value.trim());
      out.innerHTML=card
        ?`<div class="chg"><span>Balance</span><b>${money(card.bal)}</b></div>`
        :inp.value.trim().length>5?`<p style="color:var(--void);font-size:13px">No card with that number.</p>`:"";
    };
    inp.focus();
    el.querySelector("#gcn").onclick=()=>{el.remove();res(null)};
    el.querySelector("#gcy").onclick=()=>{
      if(!card||card.bal<=0.005)return;
      const used=Math.min(card.bal,due);
      card.bal=+(card.bal-used).toFixed(2);
      setModule("giftcards",true,c);queueSave();
      el.remove();res({used,remaining:+(due-used).toFixed(2),code:card.code});
    };
  });
}

function finish(pays,roundAdj,reason,cid){
  if(PART_PAID){pays=PART_PAID.concat(pays);PART_PAID=null}
  const t=calc();
  const sale={n:SHIFT.num++,at:new Date(),by:ME.n,lines:JSON.parse(JSON.stringify(CART)),...t,pays,
    ret:RETURN,manualDisc:DISC,roundAdj:roundAdj||0,reason:reason?.n,train:TRAIN,
    against:RETREF?RETREF.n:null,
    tip:SALE_TIP||0,customer:SALE_CUST||null,
    cid:cid||(Date.now().toString(36)+Math.random().toString(36).slice(2,8))};
  if(!TRAIN){SHIFT.sales.push(sale);postSale(sale)}
  CART=[];SEL=null;DISC=null;SALE_TIP=0;SALE_CUST=null;
  const wasRet=RETURN;RETURN=false;RETREF=null;refreshSale();
  const paid=pays.map(p=>`${p.mop} ${money(Math.abs(p.amt))}`).join(" + ");
  const ch=pays.find(p=>p.change>0.001);
  /* Record first, then take the money. If anything fails between the two, the
     authorisation expires on its own — far better than a charge with no sale. */

  window.__rcpt=n=>receipt(SHIFT.sales.find(s=>s.n===n)||sale);
  toast(`${wasRet?"Refunded":"Paid"} <b>${money(Math.abs(t.tot))}</b> · ${esc(paid)}${ch?` · change <b>${money(ch.change)}</b>`:""}
    &nbsp;<button class="act" onclick="__rcpt(${sale.n})">Receipt</button>`);
  receipt(sale);
}

/* ============================ PRICING & INTAKE ============================
   Cost in, retail out. The margin rule and the price-ending rule are store
   settings, so an invoice can be priced without anyone typing a price.
   Anything the model isn't sure about is held in a review queue rather than
   written into the pricebook — a wrong price on the shelf costs more than a
   minute of checking.
   ========================================================================== */

/* retail = cost / (1 - margin). Margin here is gross margin on the sell price,
   which is what retailers actually mean, not markup on cost. */
function fromMargin(cost,marginPct){
  const m=Math.min(94,Math.max(0,+marginPct||0))/100;
  return m>=1?cost:cost/(1-m);
}
function marginOf(cost,price){return price>0?(price-cost)/price*100:0}

/* Charm pricing. "x9" snaps to the nearest cents value ending in 9 — 2.99,
   3.49, 1.29 — which is the pattern most c-stores actually run. */
function charm(p,rule,dir){
  if(!rule||rule==="none")return Math.round(p*100)/100;
  const cents=Math.round(p*100);
  let cands=[];
  if(rule==="x9")for(let c=9;c<=100000;c+=10)cands.push(c);
  else if(rule==="99")for(let c=99;c<=100000;c+=100)cands.push(c);
  else if(rule==="95")for(let c=95;c<=100000;c+=100)cands.push(c);
  else if(rule==="49-99")for(let c=49;c<=100000;c+=50)cands.push(c);
  let pick;
  if(dir==="up")pick=cands.find(c=>c>=cents);
  else if(dir==="down"){const below=cands.filter(c=>c<=cents);pick=below[below.length-1]}
  else pick=cands.reduce((a,b)=>Math.abs(b-cents)<=Math.abs(a-cents)?b:a,cands[0]);
  return (pick||cents)/100;
}
/* A shop that prices by value gets no suggested retail — a coffee costing 40
   cents does not sell for 80, and pretending otherwise is worse than a blank. */
function priceFor(cost){
  if(CFG.pricing.mode==="value")return 0;
  return charm(fromMargin(cost,CFG.pricing.margin),CFG.pricing.ending,CFG.pricing.dir);
}

/* ---------------------------- invoice intake ---------------------------- */
let PENDING=[],REPRICE=true;

/* A UPC-A or EAN-13 carries its own check digit. This catches a transposed or
   misread digit outright, which is the difference between a barcode that scans
   and one that silently never matches anything for the next two years. */
function validUPC(raw){
  const s=String(raw||"").replace(/\D/g,"");
  if(s.length!==12&&s.length!==13&&s.length!==8)return null;
  const d=s.split("").map(Number),chk=d.pop();
  let sum=0;
  if(s.length===13){ d.forEach((n,i)=>sum+=n*(i%2?3:1)); }
  else { d.reverse().forEach((n,i)=>sum+=n*(i%2?1:3)); }
  return ((10-(sum%10))%10)===chk ? s : null;
}

/* Matching an invoice line to something already in the pricebook is what turns a
   stack of paper into "these twelve went up". Barcode first, then a normalised
   name, because most invoices don't print barcodes at all. */
const normName=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const tokens=s=>String(s||"").toLowerCase().match(/[a-z0-9]+/g)||[];
/* Dice coefficient over word tokens. Good enough to rank candidates, and
   deliberately never good enough to act on by itself. */
function similar(a,b){
  const A=new Set(tokens(a)),B=new Set(tokens(b));
  if(!A.size||!B.size)return 0;
  let hit=0;A.forEach(t=>{if(B.has(t))hit++});
  return 2*hit/(A.size+B.size);
}
/* A barcode match is a fact. A name match is a guess, so it comes back marked
   as one and goes to review for a human to confirm or reject. */
function matchExisting(upc,name){
  if(upc){const m=CFG.plus.find(p=>p.upc===upc);if(m)return{plu:m,kind:"upc",score:1}}
  const k=normName(name);
  if(k.length<5)return null;
  const exact=CFG.plus.find(p=>normName(p.n)===k);
  if(exact)return{plu:exact,kind:"name-exact",score:1};
  let best=null;
  CFG.plus.forEach(p=>{
    const s=similar(name,p.n);
    if(s>=0.55&&(!best||s>best.score))best={plu:p,kind:"name-fuzzy",score:s};
  });
  return best;
}
function candidates(name,limit=5){
  return CFG.plus.map(p=>({p,s:similar(name,p.n)}))
    .filter(x=>x.s>=0.25).sort((a,b)=>b.s-a.s).slice(0,limit);
}

/* Barcode lookup. The model only reports one when it is certain of the exact
   pack and size, and the check digit has to validate before we accept it.
   Anything that clears both is still stamped as looked-up rather than read,
   because "certain" and "correct" are not the same word. */
async function fillMissingUPCs(rows,onProgress){
  const need=rows.map((r,i)=>({r,i})).filter(x=>!x.r.upc);
  if(!need.length)return 0;
  let filled=0;
  for(let b=0;b<need.length;b+=12){
    const batch=need.slice(b,b+12);
    onProgress&&onProgress(b,need.length);
    try{
      const res=await callAI(`Identify the retail UPC barcode for each product below, sold in the United States.

${batch.map((x,j)=>`${j}. ${x.r.n}${x.r.desc&&x.r.desc!==x.r.n?`  (invoice text: ${x.r.desc})`:""}`).join("\n")}

Return ONLY valid JSON, no prose or fences:
{"found":[{"i":number,"upc":string,"certain":boolean}]}

Rules:
- "i" is the number next to the product above.
- "upc": the full 12-digit UPC-A, digits only, including the check digit.
- Set "certain" true ONLY if you are sure this is the barcode for this exact product,
  in this exact size and pack count. A 12oz can and a 20oz bottle of the same drink have
  different barcodes, and a 12-pack has a different barcode again.
- If you are not sure of the exact variant, OMIT that product entirely. Do not guess,
  do not approximate, and do not return a barcode for a similar product.
- Returning nothing is the correct answer when you don't know. An empty array is fine.`,
        {tools:[{type:"web_search_20250305",name:"web_search"}],max_tokens:1500,kind:"upc-lookup"});
      (res.found||[]).forEach(f=>{
        if(!f||f.certain!==true)return;
        const ok=validUPC(f.upc);
        if(!ok)return;                                   // check digit failed — drop it
        if(CFG.plus.some(p=>p.upc===ok))return;          // already on another product
        const tgt=batch[f.i];
        if(!tgt||tgt.r.upc)return;
        tgt.r.upc=ok;tgt.r.upcSrc="lookup";filled++;
      });
    }catch(e){}
  }
  return filled;
}

function fileToB64(f){
  return new Promise((res,rej)=>{const r=new FileReader();
    r.onload=()=>res(r.result.split(",")[1]);r.onerror=()=>rej(new Error("Couldn't read that file"));
    r.readAsDataURL(f)});
}

/* What this invoice means, before anyone reads a single row. */
/* A row's shelf price is either the margin rule applied to the new cost, or the
   price already on the shelf. Nothing else. */
function applyRowPrice(p){
  if(p.priceEdited)return;
  p.price=(p.matchId&&!p.reprice&&p.prevPrice>0)?p.prevPrice:priceFor(p.cost);
}
function changeSummary(){
  const up=PENDING.filter(p=>p.status==="up"),down=PENDING.filter(p=>p.status==="down");
  const fresh=PENDING.filter(p=>p.status==="new");
  const vendor=PENDING.find(p=>p.vendor)?.vendor;
  if(!PENDING.length)return "";
  const worst=up.slice().sort((a,b)=>b.changePct-a.changePct)[0];
  return `<div class="summary">
    <div class="sumhead">${vendor?esc(vendor):"This delivery"} — ${PENDING.length} line${PENDING.length===1?"":"s"}</div>
    <div class="sumrow">
      <span class="sc up">${up.length}</span> cost more than last time
      <span class="sc down">${down.length}</span> cost less
      <span class="sc new">${fresh.length}</span> you've never carried
    </div>
    ${worst?`<div class="sumnote">Biggest rise: <b>${esc(worst.n)}</b>
      ${money(worst.prevCost)} → ${money(worst.cost)}, up ${(worst.changePct*100).toFixed(0)}%.

/* When a cost rises and the shelf price is held, the margin is what gives. Say
   so in the row, in points, rather than making anyone work it out. */
function marginCell(r){
  const now=marginOf(r.cost,r.price);
  if(!(r.prevCost>0)||!r.prevPrice)return `<span style="color:var(--txt-2)">${now.toFixed(0)}%</span>`;
  const before=marginOf(r.prevCost,r.prevPrice),d=now-before;
  const col=Math.abs(d)<0.5?"var(--txt-2)":d<0?"var(--void)":"var(--vfd)";
  return `<span style="color:${col}">${now.toFixed(0)}%</span>`
    +(Math.abs(d)>=0.5?`<div class="asprint" style="color:${col}">${d>0?"+":""}${d.toFixed(1)} pts</div>`
      :`<div class="asprint">held</div>`);
}

/* Dense invoices fail as a single image: downscaling turns the cost column to
   mush and one response can't hold 50 lines. So we slice the page into
   overlapping horizontal bands, read each at full resolution in its own call,
   then merge. Every line is checked against its own arithmetic — if
   qty x unit cost doesn't equal the printed extended cost, the OCR misread
   something and the line is held rather than trusted. */
function loadImage(file){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();
    i.onload=()=>{URL.revokeObjectURL(u);res(i)};
    i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("bad image"))};i.src=u});
}
function sliceImage(img,bands){
  const out=[],ov=.10,sh=img.height/bands;
  const scale=Math.min(2.5,Math.max(1,1700/img.width));
  for(let i=0;i<bands;i++){
    const y0=Math.max(0,i*sh-(i?sh*ov:0)),y1=Math.min(img.height,(i+1)*sh+(i<bands-1?sh*ov:0));
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*scale);c.height=Math.round((y1-y0)*scale);
    const cx=c.getContext("2d");
    cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality="high";
    cx.fillStyle="#fff";cx.fillRect(0,0,c.width,c.height);
    cx.drawImage(img,0,y0,img.width,y1-y0,0,0,c.width,c.height);
    out.push(c.toDataURL("image/jpeg",.93).split(",")[1]);
  }
  return out;
}
const LINE_SCHEMA=`{"items":[{
 "desc":string, "qtyShipped":number|null, "unitCost":number|null, "extCost":number|null,
 "packSize":number, "n":string, "upc":string|null, "dept":string,
 "tax":"standard"|"food"|"nontax", "conf":number, "why":string|null}]}`;

function lineRules(depts){return `Rules:
- One entry per product line. Include EVERY product line you can see. Do not stop early,
  do not summarise, do not skip lines that look similar to ones above.
- Skip only: freight, fuel surcharge, tax lines, invoice subtotals and totals.
- Transcribe these three EXACTLY as printed, without arithmetic of your own:
  "qtyShipped" = the quantity billed, "unitCost" = the cost of one billed unit,
  "extCost" = the line's extended or total cost. Use null for any that is not printed.
- "packSize" = how many sellable units are inside ONE billed unit. A case of 24 cans is 24.
  An item billed as a single unit is 1. "50PK" is 50. If you cannot tell, use 1 and lower conf.
- "desc" = the vendor's description verbatim, abbreviations and all.
- "n" = the name of ONE SELLABLE UNIT — the thing that crosses the counter and gets a price.
  This is the single most important field to get right, because it becomes the button the
  cashier presses and the price is per unit, not per case.
  · Include the unit size: "Coca-Cola Classic 16.9 oz", "Doritos Nacho Cheese 9.25 oz",
    "Gatorade Cool Blue 28 oz", "Marlboro Red Box".
  · NEVER put the case or pack count in the name. An invoice line reading
    "COCA-COLA CLASSIC 24PK 16.9OZ BOTTLE" is 24 bottles of one product, so the name is
    "Coca-Cola Classic 16.9 oz" and packSize is 24. Not "(24-pack case)".
  · The exception is when the pack IS the sellable unit — a 12-pack of Coke sold as a
    12-pack is "Coca-Cola Classic 12 oz 12-Pack" with packSize 1 for a single 12-pack,
    or packSize 2 if the case holds two of them.
  · Use the size units the vendor printed: oz, L, mL, ct, pk, g.
- "upc" = only if a barcode is actually printed on this line. Otherwise null. Never invent one.
- "dept" = the best fit from: ${depts}. If none fit, give a short name of your own.
- "tax" = "food" for grocery staples eligible for a reduced grocery rate, "nontax" if untaxed,
  otherwise "standard".
- "conf" = 0 to 1 for this line. Be strict. Below 0.7 whenever any number is unclear or you inferred it.
- "why" = when conf is below 0.7, a short phrase naming what is uncertain. Otherwise null.`}

async function readInvoice(file){
  const st=$("invStat");
  const depts=CFG.depts.filter(d=>!d.fuel).map(d=>d.n).join(", ");
  const isPdf=file.type==="application/pdf"||/\.pdf$/i.test(file.name);
  const show=(msg,tone)=>st.innerHTML=`<div class="note" style="border-color:var(--${tone||"vfd-dim"});margin-top:13px">${msg}</div>`;
  let raw=[];

  try{
    if(isPdf){
      const b64=await fileToB64(file);
      const doc={type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}};
      show("Counting the line items…");
      let total=40;
      try{
        const c=await callAI(null,{max_tokens:200,messages:[{role:"user",content:[doc,
          {type:"text",text:`How many product line items are on this invoice, excluding freight, tax and totals?
Return ONLY {"lines":number} as JSON.`}]}]});
        if(c.lines>0)total=Math.min(300,c.lines);
      }catch(e){}
      const per=12,passes=Math.ceil(total/per);
      for(let i=0;i<passes;i++){
        show(`Reading lines ${i*per+1}–${Math.min(total,(i+1)*per)} of about ${total}…`);
        try{
          const r=await callAI(null,{max_tokens:4000,messages:[{role:"user",content:[doc,{type:"text",
            text:`Transcribe product lines from this invoice for ${A.name||CFG.site.name}.

Return ONLY valid JSON, no prose or fences:
${LINE_SCHEMA}

Transcribe ONLY product lines ${i*per+1} through ${(i+1)*per}, counting product lines from the top
of the invoice and ignoring headers. If there are fewer than that, return what exists and stop.

${lineRules(depts)}`}]}]});
          if(Array.isArray(r.items))raw=raw.concat(r.items);
        }catch(e){}
      }
    } else {
      const img=await loadImage(file);
      const bands=Math.min(8,Math.max(1,Math.round(img.height/850)));
      const strips=sliceImage(img,bands);
      for(let i=0;i<strips.length;i++){
        show(`Reading section ${i+1} of ${strips.length} at full resolution…`);
        try{
          const r=await callAI(null,{max_tokens:4000,messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:"image/jpeg",data:strips[i]}},
            {type:"text",text:`This is one horizontal section of a vendor invoice for ${A.name||CFG.site.name}.
Sections overlap slightly, so a line may be cut off at the top or bottom — skip any line you cannot read in full.

Return ONLY valid JSON, no prose or fences:
${LINE_SCHEMA}

${lineRules(depts)}`}]}]});
          if(Array.isArray(r.items))raw=raw.concat(r.items);
        }catch(e){}
      }
    }
  }catch(e){
    return show("Couldn't open that file. A JPEG, PNG or PDF works.","void");
  }

  if(!raw.length)return show(`Nothing readable came back. A flat, straight-on photo of the itemised
    section works best — angled shots and glare on the cost column are what usually break it.`,"void");

  /* Overlapping bands mean the same line can arrive twice. */
  const seen=new Map();
  raw.forEach(it=>{
    if(!it||!it.desc&&!it.n)return;
    const key=(it.upc||"")+"|"+String(it.desc||it.n).toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,22);
    const prev=seen.get(key);
    if(!prev||(it.conf||0)>(prev.conf||0))seen.set(key,it);
  });

  /* Belt and braces on the naming rule. A name still carrying case language while
     the price is per unit is the mismatch that quietly wrecks every margin
     number downstream, so it gets stripped and, if still ambiguous, held. */
  const CASE_TAIL=/\s*[\(\[][^)\]]*\b(case|pack|pk|ct|count|carton|box of|cs)\b[^)\]]*[\)\]]\s*$/i;
  const CASE_TOK=/\b(\d+\s*\/?\s*\d*\s*(pk|pack|ct|count)|case|carton|cs)\b/gi;
  const SIZE_HINT=/\d+(\.\d+)?\s*(oz|z|ml|l|liter|litre|g|kg|lb|ct|pk|in|mg)\b/i;
  const cleanName=(n,pack)=>{
    let out=String(n||"").trim();
    if(pack>1){
      out=out.replace(CASE_TAIL,"");
      out=out.replace(CASE_TOK,"").replace(/\s{2,}/g," ").replace(/[\s,\-]+$/,"").trim();
    }
    return out;
  };

  let held=0,added=0;
  seen.forEach(it=>{
    const pack=Math.max(1,+it.packSize||1);
    const qty=+it.qtyShipped||null,unit=+it.unitCost||null,ext=+it.extCost||null;

    /* The extended amount is what the store actually pays, so it is the number
       that decides cost. A gap between qty x unit and the extended amount is
       almost always a vendor discount or allowance, not a misread — those are
       normal on a distributor invoice and they belong in the cost. Only an
       extended amount ABOVE qty x unit, or an implausibly deep one, is suspect. */
    let why=it.why||null,conf=typeof it.conf==="number"?it.conf:.5,disc=0;
    const units=Math.max(1,(qty||1)*pack);
    let lineTotal=ext!=null&&ext>0 ? ext : (qty&&unit ? qty*unit : unit);

    if(qty&&unit&&ext>0){
      const gross=qty*unit;
      if(gross>0){
        disc=(gross-ext)/gross;
        if(disc<-0.02){                       // paying more than list — worth a look
          conf=Math.min(conf,.45);
          why=`extended amount is higher than ${qty} × ${money(unit)} — check for added fees`;
        } else if(disc>0.6){                  // 60%+ off is rarely real
          conf=Math.min(conf,.45);
          why=`discount of ${(disc*100).toFixed(0)}% looks too deep — check the figures`;
        } else if(disc>0.001){
          disc=disc;                          // ordinary allowance, keep it and move on
        } else disc=0;
      }
    }
    if(!lineTotal||lineTotal<=0){conf=0;why=why||"no cost could be read"}
    if(CFG.pricing.mode==="value"){conf=Math.min(conf,.6);why=why||"set the shelf price yourself"}

    const cost=(lineTotal||0)/units;
    if(cost>0&&cost<0.01){conf=Math.min(conf,.5);why=why||"unit cost looks too low — check the pack size"}
    if(cost>400){conf=Math.min(conf,.5);why=why||"unit cost looks too high — check the pack size"}

    const dept=CFG.depts.find(d=>!d.fuel&&d.n.toLowerCase()===String(it.dept||"").toLowerCase())
      ||CFG.depts.find(d=>!d.fuel);
    const taxId=it.tax==="food"?(byId(CFG.taxRates,"TX2")?"TX2":"TX1")
      :it.tax==="nontax"?"TX0":(dept?.taxId||"TX1");
    const hit=matchExisting(it.upc,it.n||it.desc);
    let status="new",changePct=0,prevCost=null,maybe=false;
    if(hit){
      const certain=hit.kind==="upc"||hit.kind==="name-exact";
      prevCost=hit.plu.cost??null;
      if(certain){
        if(prevCost>0&&cost>0){
          changePct=(cost-prevCost)/prevCost;
          status=changePct>0.005?"up":changePct<-0.005?"down":"same";
        } else status="known";
      } else {
        /* Same product under a slightly different vendor name — probably. That
           "probably" is exactly why it goes to a human instead of merging itself. */
        maybe=true;status="maybe";
        why=`might be the same as "${hit.plu.n}" already in the pricebook`;
      }
    }
    const review=conf<.7||!(cost>0)||!it.n||maybe;
    if(review)held++;else added++;
    PENDING.push({n:it.n||it.desc||"Unnamed item",desc:it.desc||"",upc:it.upc||"",
      cost:Math.round(cost*10000)/10000,price:priceFor(cost),deptId:dept?.id,taxId,
      review,conf,pack,qty,unit,ext,disc,units,
      reprice:true,
      matchId:(hit&&(hit.kind==="upc"||hit.kind==="name-exact"))?hit.plu.id:null,
      status,changePct,prevCost,maybe,
      suggestId:hit?hit.plu.id:null,suggestScore:hit?hit.score:0,
      prevPrice:hit?hit.plu.price:null,vendor:it.vendor||"",
      upcSrc:it.upc?"invoice":null,
      why:why||(!it.upc?"no barcode printed":"low confidence")});
  });

  const missing=PENDING.filter(p=>!p.upc).length;
  let found=0;
  if(missing){
    show(`Read ${seen.size} lines. Looking up ${missing} missing barcode${missing===1?"":"s"}…`);
    found=await fillMissingUPCs(PENDING,(done,total)=>
      show(`Looking up barcodes — ${done} of ${total} checked…`));
  }
  show(`Read <b>${seen.size}</b> line${seen.size===1?"":"s"} from ${esc(file.name)}.
    <b>${added}</b> cleared, <b>${held}</b> held for review.
    ${found?`Found <b>${found}</b> barcode${found===1?"":"s"} by lookup — those show a dotted underline
      until someone scans the physical product to confirm them.`:""}
    ${held?`Held lines show what's wrong with them in the Why column.`:""}
    <br><span style="color:var(--txt-3)">If the count looks short, the sections may have missed rows —
    re-drop the same file and duplicates will be merged rather than doubled.</span>`);
  drawInvoice();
}

function dedupePending(){
  const seen=new Map();
  PENDING=PENDING.filter(p=>{
    const k=(p.upc||"")+"|"+p.n.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,22);
    if(seen.has(k))return false;seen.set(k,1);return true;
  });
}
function commitPending(){
  dedupePending();
  const ready=PENDING.filter(p=>!p.review);
  if(!ready.length)return alertCard("Nothing to import","Every item is still held for review. Fix the flagged fields and mark them Ready.");
  let added=0,updated=0,repriced=0;
  const now=new Date().toISOString().slice(0,10);
  ready.forEach(p=>{
    const ex=p.matchId?byId(CFG.plus,p.matchId):null;
    if(ex){
      ex.prevCost=ex.cost??null;
      ex.cost=p.cost;
      if((p.reprice||p.priceEdited)&&Math.abs(ex.price-p.price)>0.001){ex.price=p.price;repriced++}
      if(p.upc&&!ex.upc){ex.upc=p.upc;ex.upcSrc=p.upcSrc||"invoice"}
      ex.vendor=p.vendor||ex.vendor;
      ex.lastInvoice=now;
      updated++;return;
    }
    const plu={id:"P"+uid(),upc:p.upc||"",n:p.n,price:p.price,cost:p.cost,deptId:p.deptId,
      weighed:false,ebt:false,deposit:null,restrictId:null,modIds:[],
      vendor:p.vendor||"",lastInvoice:now,prevCost:null,upcSrc:p.upcSrc||null};
    CFG.plus.push(plu);
    const m=CFG.menus.find(x=>x.id==="M"+p.deptId);
    if(m)m.keys.push({pluId:plu.id});
    added++;
  });
  PENDING=PENDING.filter(p=>p.review);
  reload();drawInvoice();
  toast(`Imported <b>${added}</b> new item${added===1?"":"s"}, updated <b>${updated}</b>${
    repriced?`, repriced <b>${repriced}</b>`:""}.`);
}

/* ---------------------------- tax by location ---------------------------- */
/* Sales tax lookup.

   Three ways to get a rate, tried in order of how much you should trust them:

     1. Read the actual rate pages. The server fetches several published sources
        and hands back plain text; the model only extracts what's written there.
        This works on any API key and shows you every source's number so you can
        see them disagree, which they routinely do.
     2. The model's own web search, if the key has that tool.
     3. The model's memory, clearly labelled as such.

   Nothing here is treated as authoritative. The rates stay unconfirmed until a
   person checks them against the state's own address lookup. */

async function fetchPages(urls){
  try{
    const d=await api("/api/fetch",{method:"POST",body:{urls}});
    return (d.pages||[]).filter(p=>p.ok&&p.text&&p.text.length>200);
  }catch(e){return []}
}
const slug=s=>String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

/* Turn whatever the owner typed into the pieces the rate sites need in their URLs. */
async function placeParts(place){
  try{
    const r=await callAI(`Parse this US location into its parts: "${place}"

Return ONLY valid JSON, no prose or fences:
{"city":string,"state":string,"stateAbbr":string,"zip":string,"county":string}

If a ZIP code is given, infer the city, county and state from it. If a city is given without a ZIP,
give the primary ZIP for that city. "stateAbbr" is the two-letter code.`,
      {max_tokens:300,kind:"place-parse"});
    if(r&&r.state)return r;
  }catch(e){}
  return null;
}

async function lookupTax(place,bizType,deptNames){
  const parts=await placeParts(place);
  const zip=(parts&&parts.zip)||(/^\s*(\d{5})/.exec(place)||[])[1]||"";
  const st=slug(parts&&parts.state),city=slug(parts&&parts.city);
  const q=parts?`${parts.city}, ${parts.state} ${zip}`.trim():place;

  /* --- 1. read the published rate pages --- */
  const urls=[];
  if(zip){
    urls.push(`https://www.avalara.com/taxrates/en/state-rates/zip/${zip}.html`);
    if(st)urls.push(`https://www.sales-taxes.com/${(parts.stateAbbr||"").toLowerCase()}/${zip}`);
  }
  if(st&&city){
    urls.push(`https://www.salestaxhandbook.com/${st}/rates/${city}`);
    urls.push(`https://www.tax-rates.org/${st}/${city}_sales_tax`);
  }
  const pages=urls.length?await fetchPages(urls):[];

  let base=null,mode=null;
  if(pages.length){
    try{
      base=await callAI(`Below are published sales tax pages for ${q}. Read ONLY what they say.

${pages.map((p,i)=>`--- SOURCE ${i+1}: ${p.url}\n${p.text}`).join("\n\n")}

Return ONLY valid JSON, no prose or fences:
{"place":string,"state":string,"general":number,
 "breakdown":[{"n":string,"rate":number}],
 "sources":[{"n":string,"url":string,"rate":number}],
 "categories":[{"key":string,"n":string,"rate":number,"what":string}],
 "verifyUrl":string,"conflict":string|null}

- "general": the combined rate on ordinary general merchandise. If the sources disagree, use the
  one from the most recently dated page and say so in "conflict".
- "breakdown": the components, which MUST add up to "general". Only jurisdictions that apply at
  this location — never a district tax belonging to a neighbouring town.
- "sources": one entry per source above with the rate IT gave, even where they conflict. This is
  the point of the exercise, so do not harmonise them.
- "categories": any category these pages show at a DIFFERENT rate than general merchandise —
  groceries, prepared food, clothing, prescription drugs and so on. Use short keys like
  "grocery", "prepared", "candy_soda", "drugs". Omit any category equal to the general rate.
- "verifyUrl": the state revenue department's own address-level rate lookup tool.
- "conflict": name the range if the sources disagreed, else null.`,
        {max_tokens:2200,kind:"tax-from-pages"});
      if(typeof base.general==="number")mode="pages";else base=null;
    }catch(e){base=null}
  }

  /* --- 2. the model's own search, where the key allows it --- */
  const askBase=`Find the sales tax rate for a retail store located at ${q}, United States.
Prefer the state revenue department's address-level rate finder over third-party aggregators.

Return ONLY valid JSON, no prose or fences:
{"place":string,"state":string,"general":number,"breakdown":[{"n":string,"rate":number}],
 "sources":[{"n":string,"url":string,"rate":number}],"verifyUrl":string,"conflict":string|null}

- "breakdown" must sum exactly to "general", and include only jurisdictions applying at this address.
- "conflict": name the range if sources disagreed, else null.`;
  if(!base){
    try{
      base=await callAI(askBase,{tools:[{type:"web_search_20250305",name:"web_search"}],
        max_tokens:2000,kind:"tax-search"});
      if(typeof base.general==="number")mode="search";else base=null;
    }catch(e){}
  }
  /* --- 3. memory, labelled --- */
  let err=null;
  if(!base){
    try{
      base=await callAI(askBase+`

No live source is available. Answer from your own knowledge, leave "sources" empty, and in
"conflict" say this came from memory and give the month your knowledge is current to.`,
        {max_tokens:1400,kind:"tax-recall"});
      if(typeof base.general==="number")mode="memory";else base=null;
    }catch(e){err=e}
  }
  if(!base)throw new Error(err&&err.message?err.message:"no rate could be established");

  const gen=+(+base.general).toFixed(4);
  const partsList=Array.isArray(base.breakdown)?base.breakdown.filter(b=>b&&typeof b.rate==="number"):[];
  const sum=+partsList.reduce((s,b)=>s+b.rate,0).toFixed(4);
  const sumNote=partsList.length&&Math.abs(sum-gen)>0.011
    ? `The components listed add to ${sum}% but the total came back as ${gen}% — one of them is wrong.`:null;

  /* Categories: from the pages if we got them, otherwise ask directly. */
  let cats=Array.isArray(base.categories)?base.categories:[],deptTax={},recent=null;
  try{
    const diff=await callAI(`In ${base.state||q}, general merchandise at retail is taxed at ${gen}%.
${cats.length?`Published pages for this location also show: ${cats.map(c=>`${c.n} ${c.rate}%`).join(", ")}.`:""}

A ${bizType||"retail store"} at ${q} has these departments: ${(deptNames||[]).join(", ")||"general merchandise"}.

Return ONLY valid JSON, no prose or fences:
{"categories":[{"key":string,"n":string,"rate":number,"what":string,"why":string,
  "carveOut":boolean,"examples":string[],"notIn":string[]}],
 "deptTax":{"<department name>":"<category key>"},"recent":string|null}

Include a category when EITHER of these is true:
 (a) its combined rate differs from ${gen}%, or
 (b) it is commonly mistaken for a lower-taxed category but is actually taxed at the full ${gen}% —
     set "carveOut" true for these. Candy and soft drinks are the classic case: they sit on a
     grocery shelf and look like food, but most states with a reduced grocery rate exclude them,
     so a cashier ringing them as groceries under-collects on every sale. Prepared and heated food
     is often excluded too, and sometimes carries an extra municipal food-and-beverage tax.

For every category:
- "examples": 5 to 8 specific products a convenience store actually sells that fall in it. Real
  items, not descriptions — "Snickers bar", "20oz Coca-Cola", "gallon of milk".
- "notIn": 2 to 4 products people wrongly assume belong in it, each with a short "actually X"
  clause naming where it does belong.
- "why": the rule or statute behind it, in one line.
- Always include a zero-rate "exempt" category for lottery and other untaxed lines.
- "deptTax": map EVERY department above to a category key, or to "general".
- "recent": any change in the last 18 months affecting these, else null.`,
      {max_tokens:2200,kind:"tax-categories"});
    if(Array.isArray(diff.categories)&&diff.categories.length)cats=diff.categories;
    deptTax=diff.deptTax||{};recent=diff.recent||null;
  }catch(e){}

  /* A category whose rate matches general is still worth listing when it is a
     carve-out — "candy is not groceries" is the whole reason the category exists. */
  cats=(cats||[]).filter(c=>c&&c.key&&typeof c.rate==="number"
    &&(Math.abs(+c.rate-gen)>0.004||c.carveOut===true));

  const out=[{key:"general",n:"General merchandise",rate:gen,
    what:"Everything not covered by another category",parts:partsList,src:base.conflict||null}];
  cats.forEach(c=>out.push({key:c.key,n:c.n||c.key,rate:+(+c.rate).toFixed(4),
    what:c.what||null,why:c.why||null,carveOut:!!c.carveOut,
    examples:Array.isArray(c.examples)?c.examples.slice(0,8):[],
    notIn:Array.isArray(c.notIn)?c.notIn.slice(0,4):[]}));
  if(!out.some(c=>Math.abs(c.rate)<0.0001))
    out.push({key:"exempt",n:"Non-taxable",rate:0,what:"Lottery, gift cards, fuel and other untaxed lines"});

  return{place:base.place||q,state:base.state||"",categories:out,deptTax,mode,
    breakdown:partsList,sources:Array.isArray(base.sources)?base.sources:[],
    pagesRead:pages.map(p=>p.url),
    verifyUrl:base.verifyUrl||"",conflict:base.conflict||null,sumNote,recent,confirmed:false,
    note:[base.conflict,sumNote,recent].filter(Boolean).join(" ")||null};
}

/* ============================ APPEARANCE ============================
   Every surface in the terminal is driven by CSS variables, so the whole look
   is data. The store can change any of it. What they cannot do is put the
   terminal into a state a cashier can't read: contrast is checked before a
   colour is accepted, every number is clamped to a sane band, and defaults
   are one tap away.
   ========================================================================== */

const THEME_DEFAULT={mode:"dark",accent:"#5CE0A8",keyMin:154,density:1,radius:4,
  fontScale:1,tapeSide:"left",keyStyle:"tint",showF:true,showSwatch:true};
let THEME={...THEME_DEFAULT};

const MODES={
  dark:{bg:"#1B2023",panel:"#242A2D",panel2:"#2B3235",rail:"#171C1E",up:"#394145",hi:"#454E52",
    line:"#394145",line2:"#4A5357",txt:"#E6E9EA",txt2:"#98A2A6",txt3:"#6E787C",keytxt:"#FFFFFF",tint:1},
  light:{bg:"#EDEEEA",panel:"#F7F7F4",panel2:"#FFFFFF",rail:"#E2E4DF",up:"#E8E9E4",hi:"#DDDFD9",
    line:"#D2D5CF",line2:"#BFC3BC",txt:"#14181A",txt2:"#5C6467",txt3:"#8B9295",keytxt:"#14181A",tint:.2},
  contrast:{bg:"#000000",panel:"#0B0D0E",panel2:"#131617",rail:"#000000",up:"#1C2123",hi:"#2A3033",
    line:"#4E585C",line2:"#6C777B",txt:"#FFFFFF",txt2:"#CCD3D5",txt3:"#9AA3A6",keytxt:"#FFFFFF",tint:1}
};

const hex2rgb=h=>{h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");
  return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const lum=h=>{const[r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*r+.7152*g+.0722*b};
const contrast=(a,b)=>{const l1=lum(a),l2=lum(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)};
const mix=(hex,over,a)=>{const[r1,g1,b1]=hex2rgb(hex),[r2,g2,b2]=hex2rgb(over);
  const f=(x,y)=>Math.round(x*a+y*(1-a));
  return`rgb(${f(r1,r2)},${f(g1,g2)},${f(b1,b2)})`};
const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,+v||lo));

/* The theme is per store, not per browser. A café that picked amber and big keys
   gets amber and big keys on every terminal it signs into. */
/* A register is a whole design, not a set of overrides — so applying one sets
   the type, the palette and the arrangement together. */
function applyRegister(k){
  const L=LAYOUTS.find(x=>x.k===k)||LAYOUTS[0];
  CFG.layout=L.k;
  CFG.theme={mode:L.mode,accent:L.accent,keyMin:L.keyMin,density:L.density,radius:L.radius};
  themeFromConfig();
}
function themeFromConfig(){
  if(!CFG)return;
  if(CFG.theme){
    if(CFG.theme.mode)THEME.mode=CFG.theme.mode;
    if(CFG.theme.accent)THEME.accent=CFG.theme.accent;
  }
  const L=(typeof LAYOUTS!=="undefined"&&LAYOUTS.find(x=>x.k===CFG.layout))||null;
  if(L){
    if(CFG.theme?.keyMin==null)THEME.keyMin=L.keyMin;
    if(CFG.theme?.density==null)THEME.density=L.density;
    THEME.showF=L.fkeys;
    THEME.searchLeads=L.search;
    THEME.tape=L.tape;
    THEME.depts=L.depts;
    THEME.keyStyle=L.keyStyle;
    THEME.nav=L.nav;
    THEME.tapeStyle=L.tapeStyle;
    THEME.font=L.font;THEME.mono=L.mono;THEME.shell=L.shell||"panels";
    THEME.bg=L.bg;THEME.panel=L.panel;THEME.line=L.line;THEME.key=L.key;
    if(CFG.theme?.radius==null)THEME.radius=L.radius;
    if(CFG.theme?.fontScale==null)THEME.fontScale=L.fs;
  }
  applyTheme();
}
function saveTheme(){
  if(!CFG)return;
  CFG.theme={mode:THEME.mode,accent:THEME.accent,keyMin:THEME.keyMin,density:THEME.density};
  if(typeof queueSave==="function")queueSave();
}
function applyTheme(){
  const m=MODES[THEME.mode]||MODES.dark,r=document.documentElement.style;
  /* The register's own palette wins over the generic mode, so Kitchen is warm
     brown and Midnight is true black rather than both being "dark". */
  if(THEME.bg){r.setProperty("--bg",THEME.bg);r.setProperty("--panel",THEME.panel);
    r.setProperty("--panel-2",THEME.panel);r.setProperty("--line",THEME.line);
    r.setProperty("--up",THEME.key);r.setProperty("--hi",THEME.key)}
  if(THEME.font){r.setProperty("--ff",`"${THEME.font}",Archivo,system-ui,sans-serif`);
    r.setProperty("--fm",`"${THEME.mono||"Azeret Mono"}",monospace`)}
  Object.entries({bg:m.bg,panel:m.panel,"panel-2":m.panel2,rail:m.rail,up:m.up,hi:m.hi,
    line:m.line,"line-2":m.line2,txt:m.txt,"txt-2":m.txt2,"txt-3":m.txt3,
    vfd:THEME.accent,keytxt:m.keytxt}).forEach(([k,v])=>r.setProperty("--"+k,v));
  r.setProperty("--vfd-dim",mix(THEME.accent,m.bg,.55));
  r.setProperty("--keymin",THEME.keyMin+"px");
  r.setProperty("--r",THEME.radius+"px");
  r.setProperty("--r2",(THEME.radius+3)+"px");
  r.setProperty("--dens",THEME.density);
  r.setProperty("--fs",THEME.fontScale);

/* ============================ HEALTH CHECK ============================
   The store can restructure anything. This is what catches the consequences —
   orphaned keys, departments with no tax, a permission set that would lock
   everyone out. Each finding carries its own fix.
   ========================================================================== */
function health(){
  const f=[];
  CFG.plus.forEach(p=>{
    if(!byId(CFG.depts,p.deptId))f.push({sev:"err",t:`"${p.n}" isn't in any department`,
      d:"Without a department it has no tax rate and won't appear on a report.",
      fix:()=>{p.deptId=CFG.depts.find(d=>!d.fuel)?.id}});
    if(p.cost>0&&p.price<p.cost)f.push({sev:"warn",t:`"${p.n}" sells below cost`,
      d:`Costs ${money(p.cost)}, sells for ${money(p.price)}.`,
      fix:()=>{p.price=priceFor(p.cost)}});
  });
  CFG.depts.forEach(d=>{
    if(!byId(CFG.taxRates,d.taxId))f.push({sev:"err",t:`Department "${d.n}" has no valid tax rate`,
      d:"Sales in it would ring untaxed.",fix:()=>{d.taxId=CFG.taxRates[0].id}});
  });
  CFG.menus.forEach(m=>{
    const dead=m.keys.filter(k=>k.pluId&&!byId(CFG.plus,k.pluId));
    if(dead.length)f.push({sev:"warn",t:`Menu "${m.n}" has ${dead.length} key${dead.length===1?"":"s"} pointing at deleted items`,
      d:"They render blank on the board.",fix:()=>{m.keys=m.keys.filter(k=>!k.pluId||byId(CFG.plus,k.pluId))}});
    if(!m.keys.length&&!m.fuel)f.push({sev:"info",t:`Menu "${m.n}" is empty`,
      d:"It shows as a tab with nothing under it.",fix:null});
  });
  const orphan=CFG.plus.filter(p=>!CFG.menus.some(m=>m.keys.some(k=>k.pluId===p.id)));
  if(orphan.length)f.push({sev:"info",t:`${orphan.length} item${orphan.length===1?"":"s"} not on any menu`,
    d:"Still scannable and searchable, just not on the board.",
    fix:()=>orphan.forEach(p=>{const m=CFG.menus.find(x=>x.id==="M"+p.deptId);if(m)m.keys.push({pluId:p.id})})});
  const dupes={};CFG.plus.forEach(p=>{if(p.upc)(dupes[p.upc]=dupes[p.upc]||[]).push(p)});
  Object.entries(dupes).filter(([,v])=>v.length>1).forEach(([u,v])=>
    f.push({sev:"warn",t:`Barcode ${u} is on ${v.length} items`,
      d:`Scanning it rings "${v[0].n}" every time.`,fix:null}));
  if(!CFG.mops.some(m=>m.kind==="cash"))f.push({sev:"err",t:"No cash tender",
    d:"The drawer can't be balanced and cash sales can't be rung.",
    fix:()=>CFG.mops.push({id:"MOP"+uid(),n:"Cash",kind:"cash",drawer:true,change:true,rounds:true})});
  if(!CFG.employees.some(e=>byId(CFG.groups,e.groupId)?.perms.includes("config")))
    f.push({sev:"err",t:"Nobody can reach configuration",
      d:"Once you leave this screen, nobody can get back in to change anything.",
      fix:()=>{const g=CFG.groups.find(g=>g.perms.includes("config"))||CFG.groups[CFG.groups.length-1];
        if(!g.perms.includes("config"))g.perms.push("config");
        if(CFG.employees[0])CFG.employees[0].groupId=g.id}});
  if(CFG.taxRates.some(r=>r.rate>0)&&!CFG.tax?.confirmed)
    f.push({sev:"warn",t:"Tax rates haven't been confirmed",
      d:"They came from a lookup, and rate sources contradict each other. Check them against the state's address lookup under Site & tax, then mark them confirmed.",fix:null});
  if(!CFG.taxRates.some(r=>r.rate>0))f.push({sev:"warn",t:"Every tax rate is zero — nothing is being taxed",
    d:"Sales are ringing with no tax at all. Set the rate under Site & tax, or run the lookup again there.",fix:null});
  themeIssues().forEach(i=>f.push({sev:i.t==="warn"?"warn":"info",t:"Appearance",d:i.m,fix:null}));
  return f;
}

/* ---------------------------------------------------------------------------
   Pricebook import.

   This is the feature that decides whether a store can switch. Every POS
   migration dies at "now type in your four thousand items", so the job here is
   to accept whatever file the merchant can actually get out of their old system
   or their distributor — a NAXML export, a vendor CSV, a spreadsheet somebody
   maintained by hand — and turn it into a pricebook without anyone typing a
   price.

   The model is used for one narrow thing: working out which column is which.
   That is a judgement call on ten sample rows. Parsing the other four thousand
   is arithmetic, and arithmetic belongs in code where it can be checked.
   --------------------------------------------------------------------------- */

/* A CSV parser that survives quoted commas, escaped quotes and CRLF, because
   real distributor exports contain all three. */
function parseCSV(text, delim) {
  const d = delim || sniffDelim(text);
  const rows = [];
  let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === d) { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}
function sniffDelim(text) {
  const line = text.split("\n").find(l => l.trim()) || "";
  const counts = [[",", 0], [";", 0], ["\t", 0], ["|", 0]]
    .map(([d]) => [d, (line.match(new RegExp("\\" + d, "g")) || []).length]);
  return counts.sort((a, b) => b[1] - a[1])[0][1] ? counts[0][0] : ",";
}
const numOf = v => {
  const n = parseFloat(String(v == null ? "" : v).replace(/[^0-9.\-]/g, ""));
  return isFinite(n) ? n : null;
};

/* The model is good at reading headers and bad at noticing that a column of
   24-character hex strings is a database id rather than a product name. These
   look at the values instead of the label, and can overrule it. */
const ID_RE = /^[0-9a-f]{16,}$|^[0-9a-f]{8}-[0-9a-f]{4}-/i;
const looksLikeId = vals => {
  const v = vals.filter(Boolean);
  if (!v.length) return false;
  return v.filter(x => ID_RE.test(String(x).trim())).length / v.length > 0.6;
};
const looksLikeMoney = vals => {
  const v = vals.map(x => parseFloat(String(x).replace(/[^0-9.\-]/g, ""))).filter(n => isFinite(n));
  return v.length >= vals.filter(Boolean).length * 0.7 && v.length > 0;
};
/* A product name has letters, usually a space, and varies row to row. */
const nameScore = (vals, header) => {
  const v = vals.filter(Boolean).map(String);
  if (!v.length) return -99;
  if (looksLikeId(v)) return -99;
  let s = 0;
  if (/name|title|desc|product|item/i.test(header)) s += 6;
  if (/handle|slug|id|sku|code|url|path|ref/i.test(header)) s -= 5;
  const letters = v.filter(x => /[a-z]{3}/i.test(x)).length / v.length;
  s += letters * 4;
  if (v.filter(x => /\s/.test(x)).length / v.length > 0.5) s += 3;
  const avg = v.reduce((a, x) => a + x.length, 0) / v.length;
  if (avg >= 6 && avg <= 60) s += 2; else s -= 2;
  if (v.filter(x => x.startsWith("/") || x.startsWith("http")).length / v.length > 0.4) s -= 8;
  return s;
};
/* Categories arrive as "/hoodies, /latest-drops" or "Apparel > Tops". Take
   something a person would recognise on a department tab. */
function cleanDept(raw) {
  let s = String(raw || "").trim();
  if (!s) return "";
  s = s.split(",")[0];                       // first of a list
  s = s.split(">").pop();                    // last of a breadcrumb
  s = s.replace(/^\/+|\/+$/g, "").split("/").pop();
  s = s.replace(/[-_]+/g, " ").trim();
  if (!s) return "";
  return s.replace(/\b\w/g, c => c.toUpperCase());
}

async function readImport(file) {
  const st = $("impStat");
  const show = (m, tone) => st.innerHTML =
    `<div class="note" style="border-color:var(--${tone || "vfd-dim"});margin-top:13px">${m}</div>`;
  show(`Reading ${esc(file.name)}…`);
  let text = "";
  try { text = await file.text(); } catch (e) { return show("Couldn't read that file.", "void"); }

  let rows, headers, source = "csv";
  if (/^\s*<\?xml|<NAXML|<ItemMaintenance/i.test(text)) {
    source = "naxml";
    rows = parseNAXML(text);
    if (!rows.length) return show(`That looks like XML but no item records came out of it.
      A CSV export from the same system usually works.`, "void");
    headers = Object.keys(rows[0]);
    rows = rows.map(r => headers.map(h => r[h]));
  } else {
    const all = parseCSV(text);
    if (all.length < 2) return show("That file has no rows in it.", "void");
    headers = all[0].map(h => String(h).trim());
    rows = all.slice(1);
  }

  show(`Read <b>${rows.length}</b> row${rows.length === 1 ? "" : "s"}. Working out what the columns mean…`);
  const sample = rows.slice(0, 8);
  const colVals = headers.map((h, i) => rows.slice(0, 40).map(r => r[i]));
  const idCols = headers.map((h, i) => looksLikeId(colVals[i]));
  let map = null;
  try {
    const r = await callAI(`A retailer is importing their pricebook. Work out what each column holds.

Columns, with a note where the values are clearly database identifiers rather than anything a
customer would see:
${headers.map((h, i) => `${i}: "${h}"${idCols[i] ? "  ← values are ids, NOT a product name" : ""}`).join("\n")}

First rows:
${sample.map(r => r.map(c => String(c).slice(0, 28)).join(" | ")).join("\n")}

Return ONLY valid JSON, no prose or fences:
{"map":{"name":number|null,"upc":number|null,"price":number|null,"cost":number|null,
 "dept":number|null,"size":number|null,"packQty":number|null,"vendor":number|null,
 "group":number|null,"optName":number|null,"optValue":number|null},
 "note":string}

- Each value is the column index holding that field, or null if the file doesn't have it.
- "price" is what the customer pays. "cost" is what the store pays the supplier. If only one
  money column exists, decide from the header wording and the values which it is — retail is
  normally the larger of two.
- "upc" is a barcode: 8 to 14 digits. Do not map an internal item number or SKU to it.
- NEVER map a column of database ids, handles, slugs or URLs to "name". If the only text column is
  ids, return null for name and say so in the note.
- Exports from web shops repeat a product across several rows, one per size or colour. When you see
  that shape, map "group" to the column that is the same on every row of one product (a handle, a
  title, or a parent id), "optName" to the column naming the option ("Size", "Colour") and
  "optValue" to the column holding the value ("Large", "Black"). Those rows will be combined into
  one product with the options as choices, rather than twelve separate products.
- "note": one sentence on anything ambiguous you had to decide.`,
      { max_tokens: 700, kind: "import-map" });
    map = r.map || null;
    let note = r.note || null;
    /* Overrule a name column that is plainly a set of ids, and pick the best
       text column instead. This is the difference between a pricebook and a
       screen full of hex. */
    if (map && (map.name == null || idCols[map.name])) {
      const scored = headers.map((h, i) => ({ i, s: nameScore(colVals[i], h) }))
        .sort((a, b) => b.s - a.s);
      if (scored[0] && scored[0].s > 0) {
        note = `The column picked for the product name held database ids, so "${
          headers[scored[0].i]}" was used instead — check the preview.`;
        map.name = scored[0].i;
      }
    }
    IMPORT = { rows, headers, map, sample, source, note, file: file.name, idCols };
  } catch (e) {
    IMPORT = { rows, headers, map: guessMap(headers, colVals), sample, source,
               note: "Columns were matched by name — check them.", file: file.name, idCols };
  }
  drawMapping();
}

/* Fallback if the model call fails: match on header wording alone. */
function guessMap(headers, colVals) {
  const find = re => { const i = headers.findIndex(h => re.test(h)); return i < 0 ? null : i; };
  const best = colVals
    ? headers.map((h, i) => ({ i, s: nameScore(colVals[i], h) })).sort((a, b) => b.s - a.s)[0]
    : null;
  return {
    name: (best && best.s > 0) ? best.i : find(/desc|item|product|name|title/i),
    upc: find(/upc|barcode|ean|scan/i),
    price: find(/variant price|retail|price|sell/i), cost: find(/cost|whsl|wholesale/i),
    dept: find(/dept|categ|class|collection|type/i), size: find(/size|pack.?size|volume/i),
    packQty: find(/pack.?qty|case.?qty|units/i), vendor: find(/vendor|supplier|manuf|brand/i),
    group: find(/handle|parent|style/i),
    optName: find(/option.?1.?name|option name/i),
    optValue: find(/option.?1.?value|option value|^size$|colou?r/i)
  };
}

/* NAXML is the Conexxus c-store standard. Different vendors nest it differently,
   so rather than assume a shape we walk for the elements that always appear. */
function parseNAXML(xml) {
  const out = [];
  const blocks = xml.match(/<(ItemInfo|Item|ProductRecord|ItemMaintenance)\b[\s\S]*?<\/\1>/gi) || [];
  const tag = (b, names) => {
    for (const n of names) {
      const m = new RegExp(`<${n}[^>]*>([\\s\\S]*?)</${n}>`, "i").exec(b);
      if (m) return m[1].replace(/<[^>]+>/g, "").trim();
    }
    return "";
  };
  blocks.forEach(b => {
    const name = tag(b, ["Description", "ItemDescription", "POSDescription", "LongDescription"]);
    if (!name) return;
    out.push({
      Description: name,
      UPC: tag(b, ["UPC", "ItemCode", "PrimaryUPC", "ScanCode"]),
      Price: tag(b, ["RegularSellPrice", "UnitPrice", "Price", "SellingPrice"]),
      Cost: tag(b, ["ActualCost", "UnitCost", "Cost", "WholesaleCost"]),
      Department: tag(b, ["MerchandiseCode", "DepartmentID", "Department", "CategoryID"]),
      Size: tag(b, ["ItemSize", "Size", "PackageSize"]),
      Vendor: tag(b, ["VendorID", "Vendor", "SupplierID"])
    });
  });
  return out;
}
