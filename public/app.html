function buildRow(r, map) {
  const g = i => i == null ? "" : String(r[i] == null ? "" : r[i]).trim();
  const cost = numOf(g(map.cost)) || 0;
  let price = numOf(g(map.price)) || 0;
  if (!price && cost) price = priceFor(cost);
  const upcRaw = g(map.upc).replace(/\D/g, "");
  const size = g(map.size);
  const base = g(map.name);
  return {
    n: [base, size && !base.includes(size) ? size : ""].filter(Boolean).join(" ").trim(),
    upc: validUPC(upcRaw) || (upcRaw.length >= 8 ? upcRaw : ""),
    cost, price,
    deptName: cleanDept(g(map.dept)),
    vendor: g(map.vendor),
    groupKey: g(map.group),
    optName: g(map.optName),
    optValue: g(map.optValue)
  };
}

/* Web-shop exports carry one row per size, with the product name only on the
   first row of each group. Fill the gaps, then fold the sizes into one product
   with a set of choices — twelve rows of the same hoodie is one hoodie. */
function collapseVariants(rows, map) {
  const built = rows.map(r => buildRow(r, map));
  if (map.group != null) {
    let lastName = "", lastDept = "", lastKey = "";
    built.forEach(b => {
      if (b.groupKey) lastKey = b.groupKey; else b.groupKey = lastKey;
      if (b.n) lastName = b.n; else b.n = lastName;
      if (b.deptName) lastDept = b.deptName; else b.deptName = lastDept;
    });
  }
  const canGroup = map.group != null && map.optValue != null;
  if (!canGroup) return { items: built.filter(b => b.n), variants: 0 };

  const byKey = new Map();
  built.forEach(b => {
    if (!b.n) return;
    const k = b.groupKey || b.n;
    if (!byKey.has(k)) byKey.set(k, { ...b, opts: [], _rows: 0 });
    const g = byKey.get(k);
    g._rows++;
    if (b.optValue && !g.opts.some(o => o.n === b.optValue))
      g.opts.push({ n: b.optValue, p: +(b.price - (byKey.get(k).price || 0)).toFixed(2) });
    /* Cheapest variant becomes the base price; dearer ones carry the difference. */
    if (b.price > 0 && (!g.price || b.price < g.price)) g.price = b.price;
    if (b.cost > 0 && (!g.cost || b.cost < g.cost)) g.cost = b.cost;
    if (b.upc && !g.upc) g.upc = b.upc;
  });
  const items = [...byKey.values()].map(g => {
    g.opts = g.opts.map(o => ({ n: o.n, p: 0 }));
    g.optLabel = built.find(b => b.optName)?.optName || "Size";
    return g;
  });
  return { items, variants: items.filter(g => g.opts.length > 1).length };
}

async function runImport() {
  const { rows, map } = IMPORT;
  const fallbackDept = $("impDept") ? $("impDept").value : CFG.depts.find(d => !d.fuel)?.id;

  /* Departments in the file are text. Map them onto real departments, creating
     any that don't exist, so a 40-department file doesn't land in one bucket. */
  const deptNames = [...new Set((IMPORT.collapsed || collapseVariants(rows, map)).items
    .map(b => b.deptName).filter(Boolean))].slice(0, 40);
  const deptMap = {};
  deptNames.forEach(n => {
    const hit = CFG.depts.find(d => !d.fuel && d.n.toLowerCase() === n.toLowerCase());
    if (hit) deptMap[n] = hit.id;
  });
  const unknown = deptNames.filter(n => !deptMap[n]);
  if (unknown.length) {
    const general = CFG.taxRates[0].id;
    unknown.forEach(n => {
      const d = { id: "D" + uid(), n, taxId: general, food: false,
        color: PALETTE[CFG.depts.length % PALETTE.length] };
      CFG.depts.push(d);
      CFG.menus.push({ id: "M" + d.id, n: d.n, color: d.color, keys: [] });
      deptMap[n] = d.id;
    });
  }

  let added = 0, updated = 0, skipped = 0, withOpts = 0;
  const byUpc = new Map(CFG.plus.filter(p => p.upc).map(p => [p.upc, p]));
  const items = (IMPORT.collapsed || collapseVariants(rows, map)).items;
  items.forEach(b => {
    if (!b.n || !(b.price > 0)) { skipped++; return; }
    /* A set of sizes becomes a required choice, so nothing is rung without one. */
    let modId = null;
    if (b.opts && b.opts.length > 1) {
      CFG.modGroups = CFG.modGroups || [];
      const label = `${b.optLabel || "Size"} — ${b.n}`.slice(0, 60);
      const grp = { id: "MG" + uid(), n: b.optLabel || "Size", required: true, multi: false,
        opts: b.opts.slice(0, 20) };
      CFG.modGroups.push(grp);
      modId = grp.id; withOpts++;
    }
    const deptId = (b.deptName && deptMap[b.deptName]) || fallbackDept;
    const ex = b.upc ? byUpc.get(b.upc) : null;
    if (ex) {
      ex.price = b.price;
      if (b.cost) ex.cost = b.cost;
      if (b.vendor) ex.vendor = b.vendor;
      updated++;
      return;
    }
    const plu = { id: "P" + uid(), upc: b.upc, n: b.n, price: b.price, cost: b.cost || null,
      deptId, weighed: false, ebt: false, deposit: null, restrictId: null,
      modIds: modId ? [modId] : [],
      vendor: b.vendor || "", upcSrc: b.upc ? "import" : null };
    CFG.plus.push(plu);
    if (plu.upc) byUpc.set(plu.upc, plu);
    const m = CFG.menus.find(x => x.id === "M" + deptId);
    if (m && m.keys.length < 60) m.keys.push({ pluId: plu.id });
    added++;
  });

  IMPORT = null;
  MENU = 0; reload(); TAB = "pricebook"; drawConfig();
  toast(`Imported <b>${added}</b> item${added === 1 ? "" : "s"}` +
    `${withOpts ? `, <b>${withOpts}</b> with size options` : ""}` +
    `${updated ? `, updated <b>${updated}</b>` : ""}` +
    `${unknown.length ? `, created <b>${unknown.length}</b> department${unknown.length === 1 ? "" : "s"}` : ""}` +
    `${skipped ? `. <b>${skipped}</b> row${skipped === 1 ? "" : "s"} skipped for no name or price` : ""}.`);
}

/* ---------------------------------------------------------------------------
   Hardware and card payments, terminal side.

   The station agent runs on this machine and owns the printer and drawer. The
   card reader is driven by our server, not by this browser — so the terminal's
   job for both is to ask, then wait, and to say clearly what is happening while
   it waits. A cashier staring at a frozen screen will press the button again.
   --------------------------------------------------------------------------- */

const AGENT = "http://127.0.0.1:9110";
let STATION = null, PAYCFG = null;

async function agent(path, body) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), body === undefined ? 2500 : 15000);
  try {
    const r = await fetch(AGENT + path, {
      method: body === undefined ? "GET" : "POST",
      headers: { "content-type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: c.signal
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Station agent error");
    return d;
  } finally { clearTimeout(t); }
}
async function findStation() {
  /* The agent is per-terminal and often absent — on a phone, on a reviewer's
     laptop, on any machine where nobody started it. Absent is a normal state. */
  try { STATION = await agent("/status"); } catch (e) { STATION = null; }
  paintStation();
  return STATION;
}
function paintStation() {
  const el = document.getElementById("hwChip");
  if (!el) return;
  const ok = STATION && STATION.ready;
  el.className = "tchip hw " + (ok ? "on" : STATION ? "warn" : "off");
  el.textContent = ok ? "Printer ready" : STATION ? "No printer set" : "No station agent";
  el.title = ok ? `Printing to ${STATION.printer}`
    : STATION ? "The agent is running but no printer is paired — Config → Hardware"
    : "Receipts will print through the browser instead. Run the station agent for the drawer.";
}

/* --------------------------- printing a receipt --------------------------- */
/* Built as instructions rather than text, so the agent decides the column width
   and the same receipt prints correctly on 58mm or 80mm paper. */
function receiptDoc(s, opts) {
  const L = [];
  L.push({ t: "title", v: CFG.site.name });
  if (CFG.site.addr) L.push({ t: "center", v: CFG.site.addr });
  if (CFG.site.tagline) L.push({ t: "center", v: CFG.site.tagline });
  L.push({ t: "rule" });
  if (s.train) { L.push({ t: "center", v: "** TRAINING — NOT A SALE **" }, { t: "rule" }); }
  L.push({ t: "row", l: `Store ${CFG.site.store} Reg ${CFG.site.register}`, r: `#${s.n}` });
  L.push({ t: "row", l: new Date(s.at).toLocaleString(), r: s.ret ? "REFUND" : "SALE" });
  if (s.by) L.push({ t: "row", l: "Cashier", r: s.by });
  L.push({ t: "rule" });
  s.lines.forEach(c => {
    const eff = c.price * c.q * (1 - (c.disc || 0) / 100);
    L.push({ t: "row", l: (c.q > 1 ? c.q + " x " : "") + c.n, r: (s.ret ? "-" : "") + money(eff) });
    if (c.mods?.length) L.push("   " + c.mods.join(", "));
    if (c.note) L.push("   " + c.note);
  });
  L.push({ t: "rule" });
  L.push({ t: "row", l: "Subtotal", r: money(s.sub) });
  if (Math.abs(s.promoOff) > 0.001) L.push({ t: "row", l: "Promotions", r: "-" + money(Math.abs(s.promoOff)) });
  if (s.manualDisc) L.push({ t: "row", l: "Discount", r: "-" + money(Math.abs(s.disc)) });
  CFG.taxRates.filter(r => r.rate > 0 && Math.abs(s.taxes[r.id] || 0) > 0.001)
    .forEach(r => L.push({ t: "row", l: `${r.n} ${r.rate}%`, r: money((s.taxes[r.id] || 0) * (s.ret ? -1 : 1)) }));
  if (Math.abs(s.roundAdj) > 0.001) L.push({ t: "row", l: "Cash rounding", r: money(-s.roundAdj) });
  L.push({ t: "bigrow", l: s.ret ? "REFUND" : "TOTAL", r: money(s.tot + (s.roundAdj || 0)) });
  L.push({ t: "rule" });
  s.pays.forEach(p => {
    L.push({ t: "row", l: p.mop + (p.brand ? ` ${p.brand} ****${p.last4}` : "")
      + (p.refund ? " refund" : ""), r: money(Math.abs(p.amt)) });
    if (p.change > 0.001) L.push({ t: "row", l: "Change", r: money(p.change) });
  });
  if (s.against) L.push({ t: "rule" }, { t: "center", v: "Refund against sale #" + s.against });
  if (s.reason) L.push({ t: "rule" }, { t: "center", v: "Reason: " + s.reason });
  L.push({ t: "rule" }, { t: "center", v: CFG.receipt?.footer || "Thank you" });
  if (CFG.receipt?.policy) L.push({ t: "center", v: CFG.receipt.policy });
  L.push({ t: "blank" });
  return { lines: L, kick: !!(opts && opts.kick) };
}
async function printReceipt(s, opts) {
  if (STATION && STATION.ready) {
    try { await agent("/print", receiptDoc(s, opts)); return "printed"; }
    catch (e) { toast(`Printer didn't respond: ${esc(e.message)}`, true); return "failed"; }
  }
  browserPrint(s);
  return "browser";
}
/* No agent? Fall back to the browser's own print dialogue. A receipt on A4 is
   worse than a receipt on till roll, and much better than none. */
function browserPrint(s) {
  const doc = receiptDoc(s, {});
  const w = window.open("", "_blank", "width=380,height=640");
  if (!w) return toast("Allow pop-ups to print without the station agent.", true);
  const row = e => typeof e === "string" ? `<div class="l">${esc(e)}</div>`
    : e.t === "rule" ? `<hr>`
    : e.t === "blank" ? `<br>`
    : e.t === "title" ? `<div class="t">${esc(e.v)}</div>`
    : e.t === "center" ? `<div class="c">${esc(e.v)}</div>`
    : e.t === "bigrow" ? `<div class="r b"><span>${esc(e.l)}</span><span>${esc(e.r)}</span></div>`
    : e.t === "row" ? `<div class="r"><span>${esc(e.l)}</span><span>${esc(e.r)}</span></div>`
    : `<div class="l">${esc(e.v ?? "")}</div>`;
  w.document.write(`<!doctype html><meta charset="utf-8"><title>Receipt</title><style>
    body{font:12px/1.6 "Courier New",monospace;width:76mm;margin:0 auto;padding:8mm 4mm;color:#000}
    .t{text-align:center;font-size:16px;font-weight:700;margin-bottom:3px}
    .c{text-align:center}.r{display:flex;justify-content:space-between;gap:8px}
    .b{font-weight:700;font-size:14px}hr{border:none;border-top:1px dashed #999;margin:6px 0}
    @media print{@page{margin:0}}
  </style>${doc.lines.map(row).join("")}<script>window.onload=()=>{print();setTimeout(close,400)}<\\/script>`);
  w.document.close();
}
async function kickDrawer() {
  if (!(STATION && STATION.ready)) return false;
  try { await agent("/drawer", {}); return true; } catch (e) { return false; }
}

/* ------------------------------ card payment ------------------------------ */
/* Server-driven: we create an intent, the reader collects it, we poll. The
   cashier sees the reader's state the whole time, and cancelling here cancels
   it on the reader too rather than leaving it waiting for a card. */
async function cardPayment(mop, due, saleCid) {
  if (!ONLINE) {
    alertCard("No connection", `Card payments need the network. Take ${money(due)} as cash, or wait for the connection to come back — sales are still being recorded either way.`);
    return null;
  }
  if (!PAYCFG?.configured || !PAYCFG?.readerId) {
    return new Promise(res => {
      const el = veil(`<div class="card"><h3>${esc(mop.n)}</h3>
        <p>No card reader is paired to this register, so this can't be taken automatically.
          Run it on your existing terminal and record it here.</p>
        <div class="chg"><span>Amount</span><b>${money(due)}</b></div>
        <div class="row"><button class="no" id="cn">Cancel</button>
          <button class="ok" id="cy">Approved on the other terminal</button></div>
        <div class="row"><button class="no" id="cs" style="font-size:12.5px">Set up a reader</button></div></div>`);
      el.querySelector("#cn").onclick = () => { el.remove(); res(null); };
      el.querySelector("#cy").onclick = () => { el.remove(); res({ manual: true }); };
      el.querySelector("#cs").onclick = () => { el.remove(); res(null); go("config"); TAB = "hardware"; drawConfig(); };
    });
  }

  return new Promise(async res => {
    let intent = null, done = false, poll = null;
    const el = veil(`<div class="card"><h3>${esc(mop.n)}</h3>
      <p id="payMsg">Sending ${money(due)} to the reader…</p>
      <div class="chg"><span>Amount</span><b>${money(due)}</b></div>
      <div class="paystate" id="payState"><span class="spin"></span><span id="payStep">Starting</span></div>
      <div class="row"><button class="no" id="pc">Cancel</button></div>
      ${PAYCFG.mode === "test" ? `<div class="row"><button class="no" id="ptap" style="font-size:12.5px">Simulate a tap</button></div>` : ""}
    </div>`);
    const step = (t, cls) => { const s = document.getElementById("payStep");
      if (s) { s.textContent = t; s.className = cls || ""; } };
    const finish = v => { if (done) return; done = true; clearInterval(poll); el.remove(); res(v); };

    el.querySelector("#pc").onclick = async () => {
      step("Cancelling…");
      try { await api("/api/pay/cancel?store=" + STORE_ID,
        { method: "POST", body: { store: STORE_ID, intent } }); } catch (e) {}
      finish(null);
    };
    if (PAYCFG.mode === "test") el.querySelector("#ptap").onclick = async () => {
      try { await api("/api/pay/simulate-tap?store=" + STORE_ID, { method: "POST", body: { store: STORE_ID } }); }
      catch (e) { step(e.message, "bad"); }
    };

    try {
      const d = await api("/api/pay/start?store=" + STORE_ID, { method: "POST",
        body: { store: STORE_ID, amount: due, saleCid, register: CFG.site.register } });
      intent = d.intent;
      step("Waiting for the card");
      document.getElementById("payMsg").textContent = "Ask the customer to tap, insert or swipe.";
    } catch (e) { step(e.message, "bad"); setTimeout(() => finish(null), 2600); return; }

    poll = setInterval(async () => {
      try {
        const s = await api(`/api/pay/status?store=${STORE_ID}&intent=${intent}`);
        if (s.status === "requires_capture" || s.status === "succeeded") {
          step("Approved", "ok");
          finish({ intent, brand: s.brand, last4: s.last4, amount: s.amount / 100 });
        } else if (s.status === "canceled") { step("Cancelled at the reader", "bad"); setTimeout(() => finish(null), 1400); }
        else if (s.error) { step(s.error, "bad"); }
        else if (s.status === "processing") step("Processing");
      } catch (e) { /* a poll that fails is not a payment that failed */ }
    }, 1400);
  });
}
/* Capture after the sale is recorded, never before. A crash in between leaves an
   uncaptured authorisation that expires, rather than a charge with no receipt. */
async function capturePayment(intent) {
  if (!intent) return;
  try {
    const r = await api("/api/pay/capture?store=" + STORE_ID,
      { method: "POST", body: { store: STORE_ID, intent } });
    return r.status;
  } catch (e) {
    /* Only worth interrupting the cashier if the money is actually at risk. An
       authorisation that never captures expires on its own, but somebody needs
       to know it happened before the customer has walked out. */
    toast(`Card authorised but not captured. The customer has not been charged — `
      + `take it again or void the sale. ${esc(e.message)}`, true);
  }
}

/* ===========================================================================
   Modules.

   A POS for a butcher and a POS for a phone shop need genuinely different
   things — batch tracking versus commission reporting — but they must not be
   different software. What varies is which modules are switched on and how
   they're configured; the code is the same everywhere, tested once.

   Three of them are deliberately generic:
     records  — a definable list. Recipes, customer contacts, a cut log, a
                maintenance sheet. One implementation, a hundred uses.
     expiry   — dated stock, with a board of what's about to be worthless.
     staff    — who sold what, out of the sales journal we already keep.

   The setup interview decides which to suggest. The owner decides which to
   keep, and can switch any of them on later.
   =========================================================================== */

const MODULES = {
  records: {
    n: "Custom lists",
    what: "Any list your trade needs — recipes, customer contacts, a cut log, supplier notes. You define the columns.",
    fits: /caf|coffee|bakery|restaurant|deli|butcher|pizz|juice|brewery|bar|salon|barber|repair|florist|craft/i,
    icon: '<path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2"/>'
  },
  expiry: {
    n: "Expiration tracking",
    what: "Dated stock with a board of what's about to expire, so it gets marked down before it's a write-off.",
    fits: /grocer|market|butcher|fish|deli|bakery|convenience|cheese|produce|pharmac|health food|farm/i,
    icon: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18M12 15v3"/>'
  },
  staff: {
    n: "Staff performance",
    what: "Who rang what, average basket per person, and which upsells actually land.",
    fits: /phone|electronic|cloth|boutique|shoe|jewel|furniture|sporting|salon|beauty|cosmetic|auto/i,
    icon: '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 11l2 2 4-4"/>'
  }
};

const modOn = id => !!(CFG.modules && CFG.modules[id] && CFG.modules[id].on);
const modCfg = id => (CFG.modules && CFG.modules[id] && CFG.modules[id].cfg) || {};
function setModule(id, on, cfg) {
  CFG.modules = CFG.modules || {};
  CFG.modules[id] = { on, cfg: cfg || modCfg(id) };
}

/* ============================== custom lists ============================== */
/* A record type is a name, a set of fields, and rows. That covers a recipe
   card, a customer list and a butchery log without three implementations. */
const FIELD_TYPES = [["text", "Text"], ["longtext", "Long text"], ["number", "Number"],
  ["money", "Money"], ["date", "Date"], ["choice", "Choice"], ["check", "Yes / no"],
  ["product", "Product"], ["staff", "Staff member"]];

function listsCfg() {
  const c = modCfg("records");
  if (!c.lists) c.lists = [];
  return c;
}

  };

    : `

        <td>${f.t === "choice"
          ? `<input value="${esc(f.opts || "")}" placeholder="One, Two, Three"
              oninput="__w.setField('${cur.id}','${f.k}','opts',this.value)">`
          : `<span style="color:var(--txt-3);font-size:12px;padding-left:8px">—</span>`}</td>
        <td>${cur.fields.length > 1 ? `<button class="del" onclick="__w.delField('${cur.id}','${f.k}')">×</button>` : ""}</td>
      </tr>`).join("")}
      </tbody></table>
      <button class="mini" onclick="__w.addField('${cur.id}')">Add a column</button>
      <button class="mini" style="border-color:var(--void);color:var(--void)"
        onclick="__w.delList('${cur.id}')">Delete this list</button>

      <div class="sect">${esc(cur.n)} — ${cur.rows.length} record${cur.rows.length === 1 ? "" : "s"}</div>
      <div class="pbtop">
        <input id="recSearch" placeholder="Search ${esc(cur.n.toLowerCase())}…" value="${esc(REC_Q)}">
        <button class="mini" style="margin:0" onclick="__w.addRow('${cur.id}')">Add a record</button>
      </div>
      <div id="recRows">${recRows(cur)}</div>`}`;

  const s = $("recSearch");
  if (s) s.oninput = e => W.recQ(e.target.value);
}
let REC_OPEN = null, REC_Q = "";

function recRows(l) {
  if (!l) return "";
  const q = REC_Q.trim().toLowerCase();
  const rows = q ? l.rows.filter(r => l.fields.some(f =>
    String(r[f.k] ?? "").toLowerCase().includes(q))) : l.rows;
  if (!rows.length) return `<p style="color:var(--txt-3);font-size:13px;padding:14px 2px">${
    q ? `Nothing matches “${esc(q)}”.` : "No records yet."}</p>`;
  return `<table class="tbl"><thead><tr>${l.fields.map(f =>
    `<th>${esc(f.n)}</th>`).join("")}<th style="width:34px"></th></tr></thead><tbody>
    ${rows.map(r => `<tr>${l.fields.map(f => `<td>${cell(l, r, f)}</td>`).join("")}
      <td><button class="del" onclick="__w.delRow('${l.id}','${r._id}')">×</button></td></tr>`).join("")}
  </tbody></table>`;
}
function cell(l, r, f) {
  const v = r[f.k] ?? "";
  const set = `__w.setCell('${l.id}','${r._id}','${f.k}',this.value)`;
  switch (f.t) {
    case "longtext": return `<textarea rows="2" oninput="${set}"
      style="min-height:38px;resize:vertical">${esc(v)}</textarea>`;
    case "number": return `<input class="n" value="${esc(v)}" oninput="${set}">`;
    case "money": return `<input class="n" value="${esc(v)}" placeholder="0.00" oninput="${set}">`;
    case "date": return `<input type="date" value="${esc(v)}" oninput="${set}">`;
    case "check": return `<input type="checkbox" ${v ? "checked" : ""} style="width:auto"
      onchange="__w.setCell('${l.id}','${r._id}','${f.k}',this.checked)">`;
    case "choice": return `<select onchange="${set}"><option value=""></option>${
      String(f.opts || "").split(",").map(o => o.trim()).filter(Boolean)
        .map(o => `<option ${v === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    case "product": return `<select onchange="${set}"><option value=""></option>${
      CFG.plus.map(p => `<option value="${p.id}" ${v === p.id ? "selected" : ""}>${esc(p.n)}</option>`).join("")}</select>`;
    case "staff": return `<select onchange="${set}"><option value=""></option>${
      CFG.employees.map(e => `<option ${v === e.n ? "selected" : ""}>${esc(e.n)}</option>`).join("")}</select>`;
    default: return `<input value="${esc(v)}" oninput="${set}">`;
  }
}

/* ============================ expiration =============================== */
/* Dated stock. The point isn't the dates, it's the board that tells you what to
   mark down this morning while it's still worth something. */
function expCfg() {
  const c = modCfg("expiry");
  if (!c.batches) c.batches = [];
  if (!c.warnDays) c.warnDays = 7;
  return c;
}
const daysUntil = d => Math.floor((new Date(d) - new Date().setHours(0, 0, 0, 0)) / 864e5);

function tExpiry() {
  const c = expCfg();
  W.addBatch = () => {
    const p = CFG.plus[0];
    c.batches.unshift({ id: "B" + uid(), pluId: p ? p.id : null, qty: 1,
      exp: new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10),
      received: new Date().toISOString().slice(0, 10), by: ME?.n || "", note: "" });
    setModule("expiry", true, c); refresh(); queueSave();
  };
  W.setBatch = (id, f, v) => {
    const b = c.batches.find(x => x.id === id);
    b[f] = f === "qty" ? (parseFloat(v) || 0) : v;
    queueSave(); if (f === "exp") refresh();
  };
  W.delBatch = id => { c.batches = c.batches.filter(b => b.id !== id); refresh(); queueSave(); };
  W.setWarn = v => { c.warnDays = parseInt(v) || 7; setModule("expiry", true, c); refresh(); queueSave(); };

  const sorted = c.batches.slice().sort((a, b) => new Date(a.exp) - new Date(b.exp));
  const gone = sorted.filter(b => daysUntil(b.exp) < 0);
  const soon = sorted.filter(b => { const d = daysUntil(b.exp); return d >= 0 && d <= c.warnDays; });

  $("cfgBody").innerHTML = `

/* ============================ staff performance ========================== */
function tStaff() {
  const S = SHIFT.sales.filter(s => !s.ret);
  const by = {};
  S.forEach(s => {
    const k = s.by || "—";
    by[k] = by[k] || { n: 0, total: 0, items: 0, disc: 0, voids: 0 };
    by[k].n++; by[k].total += s.tot;
    by[k].items += s.lines.reduce((a, c) => a + c.q, 0);
    by[k].disc += Math.abs(s.disc || 0) + Math.abs(s.promoOff || 0);
  });
  SHIFT.exceptions.forEach(x => {
    if (/void/i.test(x.what) && by[x.by]) by[x.by].voids++;
  });
  const rows = Object.entries(by).sort((a, b) => b[1].total - a[1].total);
  const max = Math.max(0.01, ...rows.map(r => r[1].total));

  $("cfgBody").innerHTML = `
    <p class="lede" style="margin:0 0 6px">This shift, by who rang it. Sales are stamped with the
      cashier when they're recorded, so this needs nothing extra from anyone.</p>
    ${rows.length ? `
      <div class="sect">Takings</div>
      ${rows.map(([n, v], i) => `<div class="hbar">
        <span class="hn">${esc(n)}</span>
        <span class="ht"><span class="hf" style="width:${Math.max(2, v.total / max * 100)}%;
          background:var(--vfd);animation-delay:${i * 60}ms"></span></span>
        <span class="hv">${money(v.total)}</span></div>`).join("")}

      <div class="sect">Detail</div>
      <table class="tbl"><thead><tr><th style="width:22%">Cashier</th><th>Sales</th>
        <th>Items</th><th>Average basket</th><th>Items per sale</th>
        <th>Discounts given</th><th>Voids</th></tr></thead><tbody>
      ${rows.map(([n, v]) => `<tr>
        <td style="padding-left:9px">${esc(n)}</td>
        <td style="padding-left:9px" class="num">${v.n}</td>
        <td style="padding-left:9px" class="num">${v.items}</td>
        <td style="padding-left:9px" class="num">${money(v.total / v.n)}</td>
        <td style="padding-left:9px" class="num">${(v.items / v.n).toFixed(1)}</td>
        <td style="padding-left:9px" class="num">${money(v.disc)}</td>
        <td style="padding-left:9px" class="num ${v.voids > 3 ? "" : ""}"
          style="${v.voids > 3 ? "color:var(--warn)" : ""}">${v.voids}</td></tr>`).join("")}
      </tbody></table>
      <div class="note">Items per sale is the upsell number — it moves when someone actually asks.
        Voids are here because a cashier voiding far more than everyone else is worth a look, not
        because voiding is wrong.</div>`
    : `<p style="color:var(--txt-3);font-size:13px;padding:16px 2px">No sales on this shift yet.</p>`}`;
}

/* ============================== customers ============================== */
function custCfg(){
  const c=modCfg("customers");
  if(!c.people)c.people=[];
  if(!c.loyalty)c.loyalty={on:false,kind:"points",per:1,reward:100,rewardValue:5};
  if(!c.ask)c.ask="ask";
  return c;
}
function findCustomer(q){
  const c=custCfg(),k=String(q||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  if(!k)return null;
  return c.people.find(p=>String(p.phone||"").replace(/\D/g,"").includes(k)
    ||String(p.n||"").toLowerCase().includes(String(q).toLowerCase()));
}
/* Runs at tender. Skipped entirely when the module is off, so a shop that
   doesn't want to ask never sees a prompt. */
function askCustomer(){
  const c=custCfg();
  if(!modOn("customers")||c.ask==="never")return Promise.resolve(null);
  return new Promise(res=>{
    const el=veil(`<div class="card"><h3>Customer</h3>
      <p>Phone number or name. Leave it blank to carry on without one.</p>
      <input id="cuq" class="big" style="text-align:left;font-size:18px" placeholder="555 0100">
      <div id="cures" style="margin-top:12px"></div>
      <div class="row"><button class="no" id="cusk">Skip</button>
        <button class="ok" id="cuok">Use this</button></div></div>`);
    const inp=el.querySelector("#cuq"),out=el.querySelector("#cures");
    let hit=null;
    inp.oninput=()=>{
      hit=findCustomer(inp.value);
      out.innerHTML=hit?`<div class="chg"><span>${esc(hit.n||"—")}<br>
        <span style="font-size:11.5px;color:var(--txt-3)">${esc(hit.phone||"")} ·
        ${hit.visits||0} visit${hit.visits===1?"":"s"}</span></span>
        ${c.loyalty.on?`<b>${hit.points||0} pts</b>`:""}</div>`
        :inp.value.trim()?`<p style="color:var(--txt-3);font-size:12.5px">New customer — they'll be
          added when the sale completes.</p>`:"";
    };
    inp.focus();
    el.querySelector("#cusk").onclick=()=>{el.remove();res(null)};
    el.querySelector("#cuok").onclick=()=>{
      const v=inp.value.trim();el.remove();
      if(!v)return res(null);
      res(hit||{id:"C"+uid(),n:/\d/.test(v)?"":v,phone:/\d/.test(v)?v:"",visits:0,points:0,spent:0});
    };
    inp.onkeydown=e=>{if(e.key==="Enter")el.querySelector("#cuok").click()};
  });
}
function recordCustomer(sale){
  if(!modOn("customers")||!sale.customer)return;
  const c=custCfg();
  let p=c.people.find(x=>x.id===sale.customer.id);
  if(!p){p={...sale.customer,first:new Date().toISOString().slice(0,10)};c.people.push(p)}
  p.visits=(p.visits||0)+1;
  p.spent=(p.spent||0)+Math.abs(sale.tot);
  p.last=new Date().toISOString().slice(0,10);
  if(c.loyalty.on){
    const earned=c.loyalty.kind==="punch"?1:Math.floor(Math.abs(sale.tot)*c.loyalty.per);
    p.points=(p.points||0)+earned;
    sale.pointsEarned=earned;
  }
  setModule("customers",true,c);
}

  W.setWaste=(id,f,v)=>{const w=c.log.find(x=>x.id===id);
    w[f]=f==="qty"?(parseFloat(v)||0):v;queueSave();if(f!=="note")refresh()};
  W.delWaste=id=>{c.log=c.log.filter(x=>x.id!==id);setModule("waste",true,c);refresh();queueSave()};
  const costOf=w=>{const p=byId(CFG.plus,w.pluId);return (p?.cost||0)*w.qty};
  const total=c.log.reduce((a,w)=>a+costOf(w),0);
  const byReason={};c.log.forEach(w=>byReason[w.reason]=(byReason[w.reason]||0)+costOf(w));

    </div>
    <button class="mini" onclick="__w.addWaste()">Log something</button>
    <div class="sect">Log</div>
    <table class="tbl"><thead><tr><th style="width:26%">Product</th><th style="width:8%">Qty</th>
      <th style="width:16%">Reason</th><th style="width:12%">Cost</th><th style="width:13%">Date</th>
      <th style="width:13%">By</th><th>Note</th><th></th></tr></thead><tbody>
    ${c.log.map(w=>`<tr>
      <td><select onchange="__w.setWaste('${w.id}','pluId',this.value)">${CFG.plus.map(p=>
        `<option value="${p.id}" ${w.pluId===p.id?"selected":""}>${esc(p.n)}</option>`).join("")}</select></td>
      <td><input class="n" value="${w.qty}" oninput="__w.setWaste('${w.id}','qty',this.value)"></td>
      <td><select onchange="__w.setWaste('${w.id}','reason',this.value)">${REASONS.map(r=>
        `<option ${w.reason===r?"selected":""}>${r}</option>`).join("")}</select></td>
      <td style="padding-left:9px" class="num">${money(costOf(w))}</td>
      <td><input type="date" value="${esc(w.at)}" oninput="__w.setWaste('${w.id}','at',this.value)"></td>
      <td><select onchange="__w.setWaste('${w.id}','by',this.value)"><option value=""></option>${
        CFG.employees.map(e=>`<option ${w.by===e.n?"selected":""}>${esc(e.n)}</option>`).join("")}</select></td>
      <td><input value="${esc(w.note||"")}" oninput="__w.setWaste('${w.id}','note',this.value)"></td>
      <td><button class="del" onclick="__w.delWaste('${w.id}')">×</button></td></tr>`).join("")
      ||`<tr><td colspan="8" style="padding:14px;color:var(--txt-3)">Nothing logged.</td></tr>`}
    </tbody></table>
    <div class="note">Costed from what you paid, not what you'd have sold it for — the loss is the cost,
      the rest is margin you never had.</div>`;
}

/* ============================= commission ============================== */
function commCfg(){const c=modCfg("commission");if(!c.rates)c.rates={};if(!c.base)c.base=0;return c}
function tCommission(){
  const c=commCfg();
  W.setRate=(d,v)=>{c.rates[d]=parseFloat(v)||0;setModule("commission",true,c);refresh();queueSave()};
  W.setBase=v=>{c.base=parseFloat(v)||0;setModule("commission",true,c);refresh();queueSave()};
  const earned={};
  SHIFT.sales.filter(s=>!s.ret).forEach(s=>{
    const k=s.by||"—";earned[k]=earned[k]||{sales:0,comm:0};
    earned[k].sales+=s.tot;
    s.lines.forEach(l=>{
      const d=byId(CFG.depts,l.deptId);
      const rate=(d&&c.rates[d.id]!=null)?c.rates[d.id]:c.base;
      earned[k].comm+=l.price*l.q*(1-(l.disc||0)/100)*rate/100;
    });
  });
  $("cfgBody").innerHTML=`
    <div class="sect">Rates</div>
    <div class="frm"><label>Default rate on everything
      <input class="n" value="${c.base}" oninput="__w.setBase(this.value)"></label></div>
    <table class="tbl" style="margin-top:12px"><thead><tr><th style="width:50%">Department</th>
      <th style="width:20%">Rate %</th><th>Uses default</th></tr></thead><tbody>
    ${CFG.depts.filter(d=>!d.fuel).map(d=>`<tr>
      <td style="padding-left:9px">${esc(d.n)}</td>
      <td><input class="n" value="${c.rates[d.id]!=null?c.rates[d.id]:""}" placeholder="${c.base}"
        oninput="__w.setRate('${d.id}',this.value)"></td>
      <td style="padding-left:9px;color:var(--txt-3);font-size:12.5px">${
        c.rates[d.id]!=null?"no":"yes"}</td></tr>`).join("")}
    </tbody></table>
    <div class="sect">Earned this shift</div>
    ${Object.keys(earned).length?`<table class="tbl"><thead><tr><th style="width:34%">Person</th>
      <th>Sales</th><th>Commission</th><th>Effective rate</th></tr></thead><tbody>
      ${Object.entries(earned).sort((a,b)=>b[1].comm-a[1].comm).map(([n,v])=>`<tr>
        <td style="padding-left:9px">${esc(n)}</td>
        <td style="padding-left:9px" class="num">${money(v.sales)}</td>
        <td style="padding-left:9px" class="num" style="color:var(--vfd)">${money(v.comm)}</td>
        <td style="padding-left:9px" class="num">${v.sales?((v.comm/v.sales)*100).toFixed(1):"0.0"}%</td>
      </tr>`).join("")}</tbody></table>`
    :`<p style="color:var(--txt-3);font-size:13px;padding:14px 2px">No sales this shift yet.</p>`}
    <div class="note">Worked out from the lines actually rung, so a department rate change applies from
      that moment on rather than retroactively.</div>`;
}

/* ===========================================================================
   Choosing a register.

   This used to be a builder — drag the keys, move the panels, set a radius.
   It produced a lot of mediocre registers and a lot of confusion. Eight
   designed ones, each drawn as a whole and each properly different, is a better
   answer: nobody has to have taste in interface design to end up with one that
   works.

   Keys can still be rearranged afterwards, in the menu designer, by anyone who
   wants to. It just isn't the first thing asked of somebody setting up a shop.
   =========================================================================== */

/* A real register at about half size, with this store's own products in it. */
function drawShot(L) {
  const el = document.getElementById("pkShot");
  if (!el) return;
  const menus = CFG.menus.filter(m => !m.fuel);
  const menu = menus[0];
  const keys = (menu ? menu.keys : []).slice(0, L.keyStyle === "list" ? 7 : 6);
  const cols = L.keyStyle === "list" ? 1 : L.keyMin > 210 ? 2 : 3;
  const F = `'${L.font}',Archivo,sans-serif`, M = `'${L.mono}',monospace`;

  const key = k => {
    const p = byId(CFG.plus, k.pluId);
    const d = p ? byId(CFG.depts, p.deptId) : null;
    const col = k.color || d?.color || L.key;
    const nm = esc(k.label || p?.n || "Product"), pr = p ? money(p.price) : "0.00";
    if (L.keyStyle === "list") return `<div class="q list" style="border-color:${L.line};color:${L.mode==="light"?"#14181A":"#E6E9EA"}">
      <i style="background:${col}"></i><b style="font-family:${F}">${nm}</b>
      <s style="font-family:${M}">${pr}</s></div>`;
    if (L.keyStyle === "card") return `<div class="q card" style="background:${L.panel};border-color:${L.line};
      border-radius:${L.radius}px;color:${L.mode==="light"?"#14181A":"#E6E9EA"}">
      <u style="background:${col}"></u>
      <b style="font-family:${F}">${nm}</b>
      <span style="border-color:${L.line}"><s style="font-family:${M}">${pr}</s>
      <em style="color:${L.accent};border-color:${L.accent}55">Add</em></span></div>`;
    return `<div class="q ${L.keyStyle}" style="background:${col};border-radius:${L.radius}px">
      <b style="font-family:${F}">${nm}</b><s style="font-family:${M}">${pr}</s></div>`;
  };

  const nav = `<div class="qnav ${L.nav}" style="background:${L.panel};border-color:${L.line}">
    ${["Sale","Office","Reports","Config"].map((n,i)=>
      `<span style="font-family:${F};color:${i?(L.mode==="light"?"#6C7679":"#7C868A"):L.accent};
        background:${i?"transparent":L.accent+"1A"}">${n}</span>`).join("")}</div>`;

  const secs = `<div class="qsec ${L.depts}">${menus.slice(0,5).map((m,i)=>
    `<span style="font-family:${F};color:${i?(L.mode==="light"?"#6C7679":"#7C868A"):(L.mode==="light"?"#14181A":"#E6E9EA")};
      border-${L.depts==="rail"?"left":"bottom"}:2px solid ${i?"transparent":L.accent}">${esc(m.n)}</span>`).join("")}</div>`;

  const first = CFG.plus[0], second = CFG.plus[1];
  const tot = money((first?.price||0)+(second?.price||0));
  const tape = `<div class="qtape ${L.tapeStyle}" style="background:${L.tapeStyle==="receipt"?L.panel:L.bg};
    border-color:${L.line};color:${L.mode==="light"?"#14181A":"#E6E9EA"}">
    <div class="qth" style="font-family:${F};border-color:${L.line}">Current sale</div>
    ${[first,second].filter(Boolean).map(p=>`<div class="qtl" style="border-color:${L.line}">
      <span style="font-family:${F}">${esc(p.n)}</span>
      <span style="font-family:${M}">${money(p.price)}</span></div>`).join("")}
    <div class="qtt" style="border-color:${L.line}">
      <span style="font-family:${F}">Total</span>
      <b style="font-family:${M};color:${L.accent}">${tot}</b></div>
    <div class="qtp"><span style="border-color:${L.accent};color:${L.accent};font-family:${F}">Cash</span>
      <span style="border-color:${L.line};font-family:${F}">Card</span></div></div>`;

  const board = `<div class="qboard">
    ${L.search?`<div class="qsrch" style="background:${L.panel};border-color:${L.line};
      font-family:${F};color:${L.mode==="light"?"#8A9298":"#6C7679"}">Search the pricebook, or scan a barcode</div>`:""}
    ${L.depts==="rail"
      ? `<div class="qrail">${secs}<div class="qkeys" style="grid-template-columns:repeat(${cols},1fr)">
           ${keys.map(key).join("")}</div></div>`
      : secs+`<div class="qkeys" style="grid-template-columns:repeat(${cols},1fr)">${keys.map(key).join("")}</div>`}
    ${L.fkeys?`<div class="qfk" style="border-color:${L.line}">${
      ["Price check","Void","Discount","No sale","Suspend","Return"].map(f=>
      `<span style="border-color:${L.line};font-family:${F};
        color:${L.mode==="light"?"#8A9298":"#6C7679"}">${f}</span>`).join("")}</div>`:""}
  </div>`;

  el.innerHTML = `<div class="qmock" style="background:${L.bg};border-color:${L.line}">
    <div class="qbar" style="background:${L.mode==="light"?L.key:"#0E1113"};border-color:${L.line}">
      ${CFG.site.logo?`<img src="${esc(CFG.site.logo)}" alt="">`
        :`<i style="background:${L.accent}"></i>`}
      <b style="font-family:${F};color:${L.mode==="light"?"#14181A":"#E6E9EA"}">${esc(CFG.site.name)}</b>
      <em style="font-family:${F};color:${L.mode==="light"?"#8A9298":"#6C7679"}">Reg 1 · Store 001</em>
    </div>

      ${L.nav==="rail"?nav:""}
      ${L.tape==="left"?tape+board:board+tape}
    </div>
  </div>`;
}

/* ---------------------------- pre-flight ----------------------------
   Before the register opens for real, check the things that would embarrass it
   on the first sale: no tax rate, no cash tender, a product with no department,
   two staff sharing a code. Blocking problems stop the launch. Everything else
   is shown and can be waved through. */
function preflight() {
  const out = [];
  const add = (label, ok, detail, blocking) => out.push({ label, ok, detail, blocking });

  add("Products in the pricebook", CFG.plus.length > 0,
    CFG.plus.length ? `${CFG.plus.length} ready to ring` : "Nothing to sell yet — import or add some", false);

  const orphan = CFG.plus.filter(p => !byId(CFG.depts, p.deptId)).length;
  add("Every product has a department", orphan === 0,
    orphan ? `${orphan} would ring with no tax rate` : "Tax and reporting will be right", true);

  const noTax = CFG.depts.filter(d => !byId(CFG.taxRates, d.taxId)).length;
  add("Every department has a tax rate", noTax === 0,
    noTax ? `${noTax} department${noTax === 1 ? "" : "s"} would ring untaxed` : "All mapped", true);

  const anyTax = CFG.taxRates.some(r => r.rate > 0);
  add("Sales tax is set", anyTax,
    anyTax ? (CFG.tax?.confirmed ? "Confirmed against the state" : "Not yet confirmed — check it under Site & tax")
      : "Every rate is zero, so nothing will be taxed", false);

  const cash = CFG.mops.some(m => m.kind === "cash");
  add("A cash tender exists", cash, cash ? "The drawer can be balanced" : "No way to take or count cash", true);

  const pins = CFG.employees.map(e => e.pin);
  const dupes = pins.length !== new Set(pins).size;
  const mgr = CFG.employees.some(e => byId(CFG.groups, e.groupId)?.perms.includes("config"));
  add("Staff can sign in", !dupes && mgr && CFG.employees.length > 0,
    dupes ? "Two people share a code" : !mgr ? "Nobody can reach configuration"
      : `${CFG.employees.length} ${CFG.employees.length === 1 ? "person" : "people"}, each with their own code`,
    dupes || !mgr);

  const dead = CFG.menus.reduce((n, m) => n + m.keys.filter(k => k.pluId && !byId(CFG.plus, k.pluId)).length, 0);
  add("Keys point at real products", dead === 0,
    dead ? `${dead} would render blank` : "Nothing dangling", false);

  const onBoard = CFG.menus.reduce((n, m) => n + m.keys.length, 0);
  add("Something is on the board", onBoard > 0,
    onBoard ? `${onBoard} keys across ${CFG.menus.length} menus` : "The register would open empty", false);

  return out;
}

function launchPOS() {
  const checks = preflight();
  const blockers = checks.filter(c => !c.ok && c.blocking);
  const warns = checks.filter(c => !c.ok && !c.blocking);

  const el = document.createElement("div");
  el.className = "veil pf";
  el.innerHTML = `<div class="card tall pfcard">
    <h3>${blockers.length ? "Two things to fix first" : "Ready to open"}</h3>
    <p>${blockers.length
      ? "The register won't behave correctly until these are sorted. Everything else can wait."
      : warns.length
      ? "Nothing is broken. A couple of things are worth knowing before you take a real sale."
      : "Everything checks out. Your register is ready to open."}</p>
    <div class="pflist">${checks.map((c, i) => `
      <div class="pfrow ${c.ok ? "ok" : c.blocking ? "bad" : "warn"}" style="animation-delay:${i * 55}ms">
        <span class="pfm">${c.ok ? "\u2713" : c.blocking ? "\u00d7" : "!"}</span>
        <span><b>${esc(c.label)}</b><em>${esc(c.detail)}</em></span></div>`).join("")}</div>
    <div class="row">
      <button class="no" id="pfBack">Keep editing</button>
      ${blockers.length ? "" : `<button class="ok" id="pfGo">Open the register</button>`}
    </div>
  </div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) el.remove(); };
  el.querySelector("#pfBack").onclick = () => el.remove();
  const go = el.querySelector("#pfGo");
  if (go) go.onclick = () => { el.remove(); runLaunch(); };
}

/* ---------------------------- the handover ----------------------------

   Seven beats, about six seconds. Long enough to feel like the machine is
   genuinely coming up rather than a screen being swapped — a boot sequence,
   which is what it is.

     0.0  the tools clear out
     0.4  the keys fire off one at a time
     1.3  the register tilts and flies past
     1.9  white-out in the store's own colour
     2.2  the store name lands
     2.8  the checks tick past, one by one
     5.0  the real register assembles behind it
*/
function runLaunch() {
  const studio = document.getElementById("studio");
  const mock = studio.querySelector(".qmock");
  if (!mock) return boot();

  if (typeof saveNow === "function") saveNow();
  if (typeof contributePattern === "function") contributePattern();

  const accent = CFG.theme.accent;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const steps = [
    `${CFG.plus.length} products loaded`,
    `${CFG.depts.length} departments mapped`,
    `${CFG.taxRates.filter(r => r.rate > 0).length || "No"} tax rate${
      CFG.taxRates.filter(r => r.rate > 0).length === 1 ? "" : "s"} applied`,
    `${CFG.employees.length} ${CFG.employees.length === 1 ? "person" : "people"} on the register`,
    `${Object.values(CFG.modules || {}).filter(m => m.on).length} modules enabled`,
    `Offline queue ready`,
    `Signed in as ${(CFG.employees[0] || {}).n || "manager"}`,
    `Open for business`
  ];

  const veil = document.createElement("div");
  veil.className = "lv";
  veil.style.setProperty("--a", accent);
  /* A plate, not a flat wash. The mark, the name, the line under it, then the
     machine reporting what it loaded. It's the first thing they'll show someone. */
  veil.innerHTML = `
    <div class="lv-bg"></div>
    <div class="lv-glow"></div>
    <div class="lv-rays">${Array.from({ length: 16 }, (_, i) =>
      `<i style="transform:rotate(${i * 22.5}deg)"></i>`).join("")}</div>
    <div class="lv-plate">
      <div class="lv-ring"></div>
      <div class="lv-ring two"></div>
      <div class="lv-mark">${CFG.site.logo
        ? `<img src="${esc(CFG.site.logo)}" alt="">`
        : `<span class="lv-initial">${esc((CFG.site.name || "?").trim()[0] || "?")}</span>`}</div>
      <b class="lv-title">${esc(CFG.site.name)}</b>
      ${CFG.site.slogan ? `<em class="lv-slogan">${esc(CFG.site.slogan)}</em>` : ""}
      <div class="lv-rule"></div>
      <div class="lv-steps">${steps.map((t, i) =>
        `<span style="animation-delay:${2700 + i * 240}ms"><i></i>${esc(t)}</span>`).join("")}</div>
      <div class="lv-foot">Register 1 &middot; Store ${esc(CFG.site.store || "001")}</div>
    </div>`;
  document.body.appendChild(veil);

  if (reduce) {
    AUTO_IN = true;
    studio.classList.remove("on"); studio.innerHTML = "";
    boot(); veil.remove(); return;
  }

  AUTO_IN = true;
  studio.classList.add("launching");
  [...mock.querySelectorAll(".q")].forEach((k, i) => {
    k.style.animation = `keyfire .5s cubic-bezier(.25,1.5,.45,1) ${380 + i * 55}ms both`;
  });

  /* The readout is the point of the wait, so nothing may cut it off. Its last
     line starts at 2700 + 6 x 260 and takes 500ms to land, so the earliest the
     curtain can honestly lift is 4760 — with a beat afterwards to read it. */
  const stepStart = 2700, stepGap = 260, stepFor = 500;
  const lastLandsAt = stepStart + (steps.length - 1) * stepGap + stepFor;
  const hold = lastLandsAt + 900;

  const at = (ms, fn) => setTimeout(fn, ms);
  at(1300, () => mock.classList.add("rush"));
  at(1900, () => veil.classList.add("wash"));
  at(2200, () => veil.classList.add("named"));
  at(stepStart - 100, () => veil.classList.add("stepping"));
  /* The register is built behind the curtain, so it's ready the instant it lifts. */
  at(hold, () => {
    studio.classList.remove("on", "launching");
    studio.innerHTML = "";
    boot();
    const app = document.getElementById("app");
    if (app) { app.classList.add("arrive"); at(1600, () => app.classList.remove("arrive")); }
  });
  at(hold + 400, () => veil.classList.add("part"));
  at(hold + 1600, () => veil.remove());
}

/* ===========================================================================
   The Classic register.

   Not a rearrangement of the tile-and-cart layout — a different machine. There
   is no product grid. A cashier types a price and presses a department, or
   scans, and the item posts. The sale runs up a paper tape and a line display
   shows the last item and the total in large characters readable from across
   the counter.

   This is what a Verifone, an NCR or a Sam4s looks like, and it is what most
   convenience, liquor and hardware counters have actually used for thirty
   years. It's faster than browsing when the person behind the till knows the
   shop, and a scanner does most of the work anyway.

   Everything underneath is shared: the same CART, the same calc(), the same
   tender path, the same restrictions. Only the surface differs.
   =========================================================================== */

let CLS_ENTRY = "", CLS_QTY = null, CLS_MSG = "";

const clsAmount = () => (parseInt(CLS_ENTRY || "0", 10) || 0) / 100;
const clsShown = () => clsAmount().toFixed(2);

function drawClassic() {
  const t = calc();
  const depts = CFG.depts.filter(d => !d.fuel).slice(0, 12);
  const last = CART[CART.length - 1];
  const lines = CART.length;

  document.getElementById("vSale").innerHTML = `
    <div class="cls">
      <div class="cls-top">
        <div class="cls-vfd">
          <div class="cls-vline">
            <span class="cls-vn">${lines
              ? esc((last.q > 1 ? last.q + " × " : "") + last.n)
              : (CLS_MSG ? esc(CLS_MSG) : RETURN ? "RETURN MODE" : "READY")}</span>
            <span class="cls-va num">${lines
              ? money(last.price * last.q * (1 - (last.disc || 0) / 100))
              : ""}</span>
          </div>
          <div class="cls-vtot">
            <span>${RETURN ? "REFUND" : "TOTAL"}</span>
            <b class="num">${money(Math.abs(t.tot))}</b>
          </div>
        </div>

        <div class="cls-entry">
          <div class="cls-elabel">${CLS_QTY ? `QTY ${CLS_QTY} ×` : "AMOUNT"}</div>
          <div class="cls-eval num">${clsShown()}</div>
          <div class="cls-ehint">${CLS_ENTRY
            ? "Now press a department key"
            : "Type an amount, scan an item, or use Look up"}</div>
        </div>
      </div>

      <div class="cls-body">
        <div class="cls-tape">
          <div class="cls-th">
            <b>${esc(CFG.site.name)}</b>
            <span>${lines} item${lines === 1 ? "" : "s"} · ${esc(ME ? ME.n : "")}</span>
          </div>
          <div class="cls-roll" id="clsRoll">${
            lines ? CART.map((c, i) => {
              const eff = c.price * c.q * (1 - (c.disc || 0) / 100);
              const d = byId(CFG.depts, c.deptId);
              return `<div class="cls-line ${SEL === i ? "on" : ""}" onclick="__cls.sel(${i})">
                <span class="cls-lq">${c.q > 1 ? c.q : ""}</span>
                <span class="cls-ln">${esc(c.n)}
                  ${c.note || d ? `<em>${esc(c.note || d.n)}</em>` : ""}</span>
                <span class="cls-la num">${RETURN ? "−" : ""}${money(eff)}</span>
              </div>`;
            }).join("")
              : `<div class="cls-empty">No sale in progress</div>`}
          </div>
          <div class="cls-sums">
            <div><span>Subtotal</span><b class="num">${money(t.sub)}</b></div>
            ${Math.abs(t.promoOff) > 0.001
              ? `<div class="disc"><span>Deals</span><b class="num">−${money(Math.abs(t.promoOff))}</b></div>` : ""}
            ${DISC ? `<div class="disc"><span>Discount</span><b class="num">−${money(Math.abs(t.disc))}</b></div>` : ""}
            ${CFG.taxRates.filter(r => r.rate > 0 && Math.abs(t.taxes[r.id] || 0) > 0.001).map(r =>
              `<div><span>${esc(r.n)} ${r.rate}%</span><b class="num">${money(t.taxes[r.id] || 0)}</b></div>`).join("")}
          </div>
        </div>

        <div class="cls-console">
          <div class="cls-depts">
            ${depts.map((d, i) => `<button class="cls-dk" onclick="__cls.dept('${d.id}')"
              style="--dc:${d.color || "#3E464A"}">
              <span class="cls-dn">${esc(d.n)}</span>
              <span class="cls-di">${i + 1}</span></button>`).join("")}
          </div>

          <div class="cls-pad">
            ${["7","8","9","4","5","6","1","2","3","00","0","."].map(k =>
              `<button class="cls-nk" onclick="__cls.key('${k}')">${k}</button>`).join("")}
            <button class="cls-nk wide clr" onclick="__cls.key('C')">Clear</button>
            <button class="cls-nk qty" onclick="__cls.qty()">Qty ×</button>
          </div>

          <div class="cls-fn">
            <button onclick="__cls.look()"><b>Look up</b><em>find a price</em></button>
            <button onclick="__cls.voidLine()"><b>Void</b><em>remove a line</em></button>
            <button onclick="__cls.disc()"><b>Discount</b><em>on the sale</em></button>

  const roll = document.getElementById("clsRoll");

window.__cls = {
  key(k) {
    if (k === "C") { CLS_ENTRY = ""; CLS_QTY = null; CLS_MSG = ""; return drawClassic(); }
    if (k === ".") return;                              // cents are implied
    CLS_ENTRY = (CLS_ENTRY + (k === "00" ? "00" : k)).replace(/^0+(?=\d)/, "").slice(0, 7);
    CLS_MSG = "";
    drawClassic();
  },
  /* Type a number, press Qty, then the price and a department — the way every
     register has worked since keys had springs under them. */
  qty() {
    const n = parseInt(CLS_ENTRY || "0", 10);
    if (n > 0) { CLS_QTY = Math.min(999, Math.round(n / 100) || n); CLS_ENTRY = ""; }
    else CLS_QTY = null;
    drawClassic();
  },
  dept(id) {
    const d = byId(CFG.depts, id);
    const v = clsAmount();
    if (!(v > 0)) { CLS_MSG = "TYPE AN AMOUNT FIRST"; return drawClassic(); }
    const q = CLS_QTY || 1;
    CART.push({ lid: uid(), n: d.n, price: v, q, deptId: d.id, taxId: d.taxId, disc: 0, open: true });
    CLS_ENTRY = ""; CLS_QTY = null; CLS_MSG = "";
    SEL = null;
    refreshSale();
  },
  sel(i) { SEL = SEL === i ? null : i; drawClassic(); },
  voidLine() {
    if (SEL == null || !CART[SEL]) { CLS_MSG = "PICK A LINE FIRST"; return drawClassic(); }
    auth("void", "Void a line", () => reasonPrompt("void", "Why is this being voided", r => {
      SHIFT.exceptions.push({ at: new Date(), by: ME.n, what: "Void " + CART[SEL].n, reason: r?.n });
      CART.splice(SEL, 1); SEL = null; refreshSale();
    }));
  },
  disc() { if (CART.length) discPrompt(); },
  look() {
    const el = veil(`<div class="card tall"><h3>Look up a price</h3>
      <p>Search the pricebook. Picking one rings it at its own price and department.</p>
      <input id="lkq" class="big" style="text-align:left;font-size:17px" placeholder="Name or barcode">
      <div class="edwrap" style="max-height:46vh"><div id="lkr"></div></div>
      <div class="row"><button class="no" id="lkn">Close</button></div></div>`);
    const inp = el.querySelector("#lkq"), out = el.querySelector("#lkr");
    const run = () => {
      const q = inp.value.trim().toLowerCase();
      const hits = !q ? CFG.plus.slice(0, 40)
        : CFG.plus.filter(p => p.n.toLowerCase().includes(q) || (p.upc || "").includes(q)).slice(0, 40);
      out.innerHTML = hits.length ? hits.map(p => {
        const d = byId(CFG.depts, p.deptId);
        return `<button class="lkrow" data-p="${p.id}">
          <span class="lkn">${esc(p.n)}<em>${esc(d ? d.n : "")}</em></span>
          <span class="num">${money(p.price)}</span></button>`;
      }).join("") : `<p style="color:var(--txt-3);font-size:13px;padding:12px">Nothing matches.</p>`;
      out.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
        el.remove(); ring(byId(CFG.plus, b.dataset.p));
      });
    };
    inp.oninput = run; run(); inp.focus();
    el.querySelector("#lkn").onclick = () => el.remove();
  },
  more() { openMenu(); },
  tender(id) { const m = byId(CFG.mops, id); if (m && CART.length) tender(m); }
};

/* The keypad answers the physical number keys too, because on a real counter
   nobody is aiming a mouse at a 3. */
function clsKeyboard(e) {
  if (THEME.shell !== "classic") return;
  if (document.querySelector(".veil")) return;
  if (/^[0-9]$/.test(e.key)) { window.__cls.key(e.key); e.preventDefault(); }
  else if (e.key === "Escape") { window.__cls.key("C"); }
  else if (e.key === "Backspace") {
    CLS_ENTRY = CLS_ENTRY.slice(0, -1); drawClassic(); e.preventDefault();
  }
}

/* ============================ CONFIGURATION CLIENT ============================
   Modelled on Commander's Config Client and Passport's Manager Workstation:
   every domain is its own form over its own table, and nothing here knows
   anything about the register's rendering.
   ========================================================================== */
let TAB="home";
/* Modules the owner switched on get their own tab, named for what they are.
   Everything else stays out of the way. */
/* Eighteen tabs in a scrolling strip meant nobody could find anything and
   everybody felt behind. They're the same eighteen screens, grouped the way a
   shop owner would think about them, with the ones most people never touch put
   somewhere you have to go looking. */
const CGROUPS=[
 {n:"What you sell",d:"Products, prices and how they're grouped",
  tabs:[["pricebook","Pricebook","Every product, its price and its cost"],
        ["depts","Departments","The buckets that carry tax and drive reports"],
        ["mods","Options","Sizes, milks, toppings — the questions asked at the till"],
        ["promos","Deals","Mix-and-match and automatic discounts"]]},
 {n:"Getting products in",d:"Load a pricebook or read it off an invoice",
  tabs:[["import","Import a file","CSV, spreadsheet or NAXML from another system"],
        ["invoice","Invoice intake","Photograph an invoice and pull costs off it"]]},
 {n:"The register",d:"What the cashier sees and can do",
  tabs:[["menus","Menu designer","Arrange the keys, sizes and colours"],
        ["look","Appearance","Layout, colours, spacing"],
        ["mops","Payment methods","Cash, card, EBT, gift cards"],
        ["restricts","Age & time rules","ID checks and hours when things can't be sold",
          ()=>CFG.caps.includes("age")||CFG.restricts.length>0],
        ["reasons","Reason codes","Why a void, a refund or a payout happened"]]},
 {n:"Your people",d:"Who can do what",
  tabs:[["people","Staff & permissions","Names, codes and what each role can reach"]]},
 {n:"The business",d:"Tax, receipts and your data",
  tabs:[["site","Store & tax","Name, address, tax rates, receipt"],
        ["hardware","Hardware & payments","Printer, drawer, card reader"],
        ["retention","Data & records","How long sales history is kept, and what happens before it goes"],
        ["health","Health check","What's misconfigured, in plain language"],
        ["account","Account & data","Export, delete, sign-in"]]},
 {n:"Features",d:"Switch on what your trade needs",
  tabs:[["modules","Add features","Everything available, on or off"]]},
 {n:"Ask",d:"Describe a change and approve it",
  tabs:[["ai","Ask for changes","Bulk edits in plain language"]]}
];
function ctabs(){
  /* A clothing shop has no business being shown age restrictions. Anything with
     a condition attached only appears when it applies — and can always be
     switched on under Add features. */
  const g=CGROUPS.map(x=>({...x,tabs:x.tabs.filter(t=>!t[3]||t[3]())}));
  /* Modules that are on get a home under Features, named for what they are. */
  const mods=Object.keys(MODULES).filter(modOn).map(k=>["mod_"+k,
    k==="records"?(listsCfg().lists[0]?.n||MODULES[k].n):MODULES[k].n,MODULES[k].what]);
  const feat=g.find(x=>x.n==="Features");
  feat.tabs=[...mods,...feat.tabs];
  return g;
}
const allTabs=()=>ctabs().flatMap(g=>g.tabs.map(t=>({...{k:t[0],n:t[1],d:t[2]},group:g.n})));
const W={};window.__w=W;

let CQ="";
function drawConfig(){
  const groups=ctabs();
  const q=CQ.trim().toLowerCase();
  const match=t=>!q||t[1].toLowerCase().includes(q)||(t[2]||"").toLowerCase().includes(q);
  const shown=groups.map(g=>({...g,tabs:g.tabs.filter(match)})).filter(g=>g.tabs.length);
  const here=allTabs().find(t=>t.k===TAB);

  $("vConfig").innerHTML=`
    <div class="cfgwrap">
      <aside class="cfgnav">
        <button class="cfghome ${TAB==="home"?"on":""}" onclick="__w.tab('home')">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M6 10v10h12V10"/></svg>All settings</button>
        <div class="cfgsearch">
          <input id="cfgQ" placeholder="Search settings" value="${esc(CQ)}">
        </div>
        ${shown.map(g=>`<div class="cfggroup">
          <div class="cfggh">${esc(g.n)}</div>
          ${g.tabs.map(t=>`<button class="cfgt ${TAB===t[0]?"on":""}" data-k="${t[0]}"
            data-d="${esc(t[2]||"")}" onclick="__w.tab('${t[0]}')">${esc(t[1])}</button>`).join("")}
        </div>`).join("")||`<div class="cfgnone">Nothing matches “${esc(CQ)}”.</div>`}
      </aside>
      <section class="cfgmain">
        ${TAB==="home"?"":`<div class="cfghead">
          <div><h2>${esc(here?here.n:"Configuration")}</h2>
            <p>${esc(here?here.d:"")}</p></div>
        </div>`}
        <div class="edwrap" id="cfgBody"></div>
      </section>
    </div>`;

  /* Re-rendering the sidebar on every keystroke made it blink and lose focus.
     Typing filters in place; picking a screen only swaps the content. */
  W.tab=k=>{
    TAB=k;
    document.querySelectorAll("#vConfig .cfgt").forEach(b=>
      b.classList.toggle("on",b.dataset.k===k));
    const home=document.querySelector("#vConfig .cfghome");
    if(home)home.classList.toggle("on",k==="home");
    const head=document.querySelector("#vConfig .cfghead");
    const t=allTabs().find(x=>x.k===k);
    if(head&&t)head.innerHTML=`<div><h2>${esc(t.n)}</h2><p>${esc(t.d)}</p></div>`;
    if(head)head.style.display=k==="home"?"none":"";
    drawBody();
  };
  const s=$("cfgQ");
  if(s)s.oninput=e=>{
    CQ=e.target.value;
    const q=CQ.trim().toLowerCase();
    document.querySelectorAll("#vConfig .cfgt").forEach(b=>{
      const hit=!q||b.textContent.toLowerCase().includes(q)||(b.dataset.d||"").toLowerCase().includes(q);
      b.style.display=hit?"":"none";
    });
    document.querySelectorAll("#vConfig .cfggroup").forEach(g=>{
      const any=[...g.querySelectorAll(".cfgt")].some(b=>b.style.display!=="none");
      g.style.display=any?"":"none";
    });
  };

  drawBody();
}
function drawBody(){

  const views={import:importView,invoice:invoiceView,pricebook:tPricebook,depts:tDepts,
    menus:tMenus,mods:tMods,mops:tMops,restricts:tRestricts,promos:tPromos,people:tPeople,
    reasons:tReasons,site:tSite,look:tLook,hardware:tHardware,health:tHealth,
    account:tAccount,ai:tAI,modules:tModules,retention:tRetention,
    mod_records:tRecords,mod_expiry:tExpiry,mod_staff:tStaff,
    mod_customers:tCustomers,mod_tips:tTips,mod_giftcards:tGiftcards,mod_waste:tWaste,
    mod_commission:tCommission,mod_jobs:tJobs,mod_service:tService};

/* The landing page. Everything at once, but arranged and explained, so the
   first visit is orienting rather than a wall of nouns. */
function cfgHome(){
  const f=typeof health==="function"?health():[];
  const bad=f.filter(x=>x.sev==="block").length,warn=f.filter(x=>x.sev==="warn").length;
  $("cfgBody").innerHTML=`
    <div class="cfghero">
      <h2>Settings</h2>
      <p>Everything about how this register behaves. Nothing here is permanent — change it,
        see what happens, change it back.</p>
      ${bad||warn?`<button class="cfgalert ${bad?"bad":"warn"}" onclick="__w.tab('health')">
        <b>${bad?`${bad} thing${bad===1?"":"s"} would break a sale`
          :`${warn} thing${warn===1?"":"s"} worth fixing`}</b>
        <span>Open the health check</span></button>`
        :`<div class="cfgok"><b>Everything checks out</b>
          <span>No misconfiguration found</span></div>`}
    </div>
    ${ctabs().map(g=>`

/* Grouping. A flat list of two hundred products is a spreadsheet, not a
   pricebook. Items cluster by brand far more often than not — every Coke
   variant starts with "Coca-Cola" — so a leading-token key gets most of the way
   there with no model call. Anything the heuristic can't place sits in "Other"
   until someone runs Auto-organise, which asks the model and stores the answer
   on the product. */
const SIZE_TOK=/^(\d+(\.\d+)?)\s*(oz|z|ml|l|lb|lbs|g|ct|pk|pack|count|liter|litre|gal|qt|pt|in|ft|mg)?$/i;
const LEAD_PAIR=/^(dr|mt|mtn|jack|coca|diet|red|arizona|monster|old|big|little|hot|sweet|nice|good|great|king|new)$/i;
const STOPW=new Set(["the","and","with","of","in","a","an","for"]);
function autoGroup(name){
  const raw=String(name||"").replace(/\(.*?\)/g," ").replace(/[^\w\s'&.-]/g," ").trim();
  const toks=raw.split(/[\s\-–—,\/]+/).filter(t=>t&&!SIZE_TOK.test(t)&&!STOPW.has(t.toLowerCase()));
  if(!toks.length)return "Other";
  let k=toks[0].replace(/'s$/i,"");
  if(toks[1]&&(k.length<=3||LEAD_PAIR.test(k)))k=k+" "+toks[1].replace(/'s$/i,"");
  return k.replace(/\.$/,"");
}
function groupsFor(deptId){
  const items=CFG.plus.filter(p=>p.deptId===deptId);
  const map={};
  items.forEach(p=>{
    const g=(p.grp&&p.grp.trim())||autoGroup(p.n);
    (map[g]=map[g]||[]).push(p);
  });
  /* One-off products don't deserve a heading of their own. */
  const out=[],singles=[];
  Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([g,list])=>{
    if(list.length>1)out.push([g,list.sort((x,y)=>x.n.localeCompare(y.n))]);
    else singles.push(list[0]);
  });
  if(singles.length)out.push(["Everything else",singles.sort((x,y)=>x.n.localeCompare(y.n))]);
  return out;
}

/* The menu designer.

   Presets get a store to something usable in a minute. This is what makes it
   theirs: keys can be dragged into any order, made double-width or double-height
   so the things sold forty times an hour are the easiest to hit, given their own
   colour, and relabelled without touching the product's real name. */
let MENU_EDIT=null;
function tMenus(){
  const menus=CFG.menus;
  const cur=menus.find(m=>m.id===MENU_EDIT)||menus[0];
  if(cur)MENU_EDIT=cur.id;

  W.setM=(id,v)=>{menus.find(m=>m.id===id).n=v;reload();queueSave()};
  W.pickMenu=id=>{MENU_EDIT=id;refresh()};
  W.addM=()=>{const m={id:"M"+uid(),n:"New menu",color:PALETTE[menus.length%PALETTE.length],keys:[]};
    menus.push(m);MENU_EDIT=m.id;refresh();reload()};
  W.delM=id=>{CFG.menus=menus.filter(m=>m.id!==id);MENU_EDIT=null;MENU=0;refresh();reload()};
  W.addK=(mid,pid)=>{if(!pid)return;
    menus.find(m=>m.id===mid).keys.push({pluId:pid});refresh();reload()};
  W.delK=(mid,i)=>{menus.find(m=>m.id===mid).keys.splice(i,1);refresh();reload()};
  /* Size is stored on the key, not the product — the same coffee can be a big
     key on the morning menu and a small one on the evening board. */
  W.keySize=(mid,i,w,h)=>{const k=menus.find(m=>m.id===mid).keys[i];
    k.w=w;k.h=h;refresh();reload();queueSave()};
  W.keyColor=(mid,i,col)=>{const k=menus.find(m=>m.id===mid).keys[i];
    k.color=col||null;refresh();reload();queueSave()};
  W.keyLabel=(mid,i,v)=>{const k=menus.find(m=>m.id===mid).keys[i];
    k.label=v.trim()||null;reload();queueSave()};
  W.moveK=(mid,from,to)=>{
    const ks=menus.find(m=>m.id===mid).keys;
    if(to<0||to>=ks.length||from===to)return;
    ks.splice(to,0,ks.splice(from,1)[0]);
    refresh();reload();queueSave();
  };
  W.autoFill=mid=>{
    const m=menus.find(x=>x.id===mid);
    const dept=CFG.depts.find(d=>"M"+d.id===mid);
    const have=new Set(m.keys.map(k=>k.pluId));
    const add=CFG.plus.filter(p=>(!dept||p.deptId===dept.id)&&!have.has(p.id));
    add.forEach(p=>m.keys.push({pluId:p.id}));
    refresh();reload();
    toast(`Added <b>${add.length}</b> key${add.length===1?"":"s"}.`);
  };

  const KEYCOLS=["#3E464A","#3A5A52","#57493B","#3D4D66","#573D4D","#485435","#4A3F5C","#2F4F55",
                 "#7A3B3B","#2E5F7A"];

  $("cfgBody").innerHTML=`
    <div class="listtabs">${menus.map(m=>
      `<button class="${m.id===MENU_EDIT?"on":""}" onclick="__w.pickMenu('${m.id}')">
        ${esc(m.n)}<em>${m.keys.length}</em></button>`).join("")}
      <button class="add" onclick="__w.addM()">+ New menu</button></div>

    ${!cur?`<p style="color:var(--txt-3);font-size:13px;padding:16px 2px">No menus yet.</p>`:`
      <div class="mdhead">
        <input value="${esc(cur.n)}" oninput="__w.setM('${cur.id}',this.value)" class="mdname">
        <button class="mini" style="margin:0" onclick="__w.autoFill('${cur.id}')">Add missing products</button>
        ${cur.fuel?"":`<button class="mini" style="margin:0;border-color:var(--void);color:var(--void)"
          onclick="__w.delM('${cur.id}')">Delete menu</button>`}
      </div>

      ${cur.fuel?`<div class="note">Pump tiles are generated from the fuel module and can't be
        rearranged here.</div>`:`
        <div class="mdboard" id="mdBoard">
          ${cur.keys.map((k,i)=>{
            const p=byId(CFG.plus,k.pluId);
            const d=p?byId(CFG.depts,p.deptId):null;
            const col=k.color||d?.color||"#3E464A";
            return `<div class="mdkey w${k.w||1} h${k.h||1}" draggable="true"
              data-i="${i}" style="background:linear-gradient(180deg,${col} 0%,${col}CC 120%)">
              <span class="mdlabel">${esc(k.label||p?.n||"(missing)")}</span>
              <span class="mdprice num">${p?money(p.price):"—"}</span>
              <span class="mdtools">
                <button title="Wider" onclick="__w.keySize('${cur.id}',${i},${(k.w||1)===2?1:2},${k.h||1})">${(k.w||1)===2?"◧":"◫"}</button>
                <button title="Taller" onclick="__w.keySize('${cur.id}',${i},${k.w||1},${(k.h||1)===2?1:2})">${(k.h||1)===2?"▤":"▥"}</button>
                <button title="Remove" onclick="__w.delK('${cur.id}',${i})">×</button>
              </span>
              <span class="mdswatches">${KEYCOLS.map(cc=>
                `<i style="background:${cc}" onclick="event.stopPropagation();__w.keyColor('${cur.id}',${i},'${cc}')"></i>`).join("")}
                <i class="clear" onclick="event.stopPropagation();__w.keyColor('${cur.id}',${i},'')" title="Use the department colour">↺</i></span>
            </div>`}).join("")
            ||`<div class="mdempty">Nothing on this menu yet. Add products below, or use
                 <b>Add missing products</b>.</div>`}
        </div>
        <div class="mdadd">
          <select onchange="__w.addK('${cur.id}',this.value);this.value=''">
            <option value="">Add a product to this menu…</option>
            ${CFG.plus.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join("")}</select>
        </div>
        <div class="note">Drag a key to move it. The two buttons on each key make it double-width or
          double-height — put the six things you sell all day where a thumb lands without looking.
          Colour is per key, so the same product can be red on one menu and grey on another.
          Renaming a key changes the button, never the product.</div>`}`}`;

  /* Drag to rearrange. Plain HTML5 drag events — no library, works with a mouse
     and with a finger on the terminals that matter. */
  const board=$("mdBoard");
  if(board){
    let from=null;
    board.querySelectorAll(".mdkey").forEach(el=>{
      el.addEventListener("dragstart",e=>{from=+el.dataset.i;el.classList.add("dragging");
        e.dataTransfer.effectAllowed="move"});
      el.addEventListener("dragend",()=>{el.classList.remove("dragging");
        board.querySelectorAll(".mdkey").forEach(x=>x.classList.remove("over"))});
      el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("over")});
      el.addEventListener("dragleave",()=>el.classList.remove("over"));
      el.addEventListener("drop",e=>{e.preventDefault();
        const to=+el.dataset.i;
        if(from!=null&&from!==to)W.moveK(MENU_EDIT,from,to);
      });
      el.addEventListener("dblclick",()=>{
        const i=+el.dataset.i;
        const k=CFG.menus.find(m=>m.id===MENU_EDIT).keys[i];
        const p=byId(CFG.plus,k.pluId);
        ask({t:"Rename this key",p:`The product stays "${p?p.n:"—"}". This only changes what's
          printed on the button.`,yes:"Set it",done:()=>{}});
        const inp=document.querySelector(".veil .card input");
        if(inp){inp.type="text";inp.value=k.label||p?.n||"";inp.classList.remove("num");
          inp.style.textAlign="left";inp.focus();
          document.querySelector(".veil .card .ok").onclick=()=>{
            W.keyLabel(MENU_EDIT,i,inp.value);
            document.querySelector(".veil").remove();refresh()};}
      });
    });
  }
}

function taxInfo(r){
