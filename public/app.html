.ptpay{display:flex;gap:6px;padding:0 13px 13px}
.pbody.bottom .ptpay{padding:0}
.ptpay span{flex:1;text-align:center;padding:9px 4px;border:1px solid;border-radius:5px;font-size:11px}

.pboard{flex:1;display:flex;flex-direction:column;min-width:0;padding:11px}
.psearch{padding:9px 12px;border:1px solid;border-radius:5px;font-size:11px;margin-bottom:9px}
.psec{display:flex;gap:3px;margin-bottom:9px}
.psec span{padding:6px 10px;font-size:11px;white-space:nowrap}
.psec.rail{flex-direction:column;width:96px;flex:none;margin:0 10px 0 0;gap:2px}
.psec.rail span{text-align:left;padding:8px 10px}
.prailrow{display:flex;flex:1;min-height:0}
.pkeys{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;flex:1;align-content:start}
.pkeys.list{grid-template-columns:1fr;gap:0}
.pkeys.pad{grid-template-columns:1fr 1fr;gap:9px}
.pkeys.card{grid-template-columns:1fr 1fr;gap:9px}
.pk{padding:10px 11px;display:flex;flex-direction:column;justify-content:space-between;gap:7px;
  min-height:56px}
.pk .pkn{font-size:11.5px;font-weight:500;line-height:1.3}
.pk .pkp{font-size:12px;font-family:"Azeret Mono",monospace;opacity:.9}
.pk.list{flex-direction:row;align-items:center;gap:10px;min-height:0;padding:9px 6px;
  border-bottom:1px solid}
.pk.list .pkbar{width:3px;height:16px;border-radius:2px;flex:none}
.pk.list .pkn{flex:1}
.pk.pad{align-items:center;justify-content:center;text-align:center;min-height:74px;gap:5px}
.pk.pad .pkn{font-size:12.5px;font-weight:600}
.pk.pad .pkp{font-size:14px}
.pk.card{padding:0;border:1px solid;overflow:hidden;gap:0;min-height:86px}
.pk.card .pkcap{display:block;height:4px}
.pk.card .pkbody{display:block;padding:10px 11px 8px;flex:1}
.pk.card .pko{display:block;font-size:10px;margin-top:4px}
.pk.card .pkfoot{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;
  border-top:1px solid}
.pk.card .pkadd{font-size:9.5px;border:1px solid;border-radius:20px;padding:2px 8px}
.pfk{display:flex;gap:5px;margin-top:9px;padding-top:9px;border-top:1px solid}
.pfk span{flex:1;text-align:center;padding:7px 2px;border:1px solid;border-radius:4px;font-size:10px}

/* ============================ DESIGN STUDIO ============================
   The register, editable, before it opens for the first time. */
#studio{position:fixed;inset:0;z-index:50;display:none;overflow-y:auto;
  background:#EAEBE7;color:var(--ink)}
#studio.on{display:block}
.stwrap{max-width:1560px;margin:0 auto;padding:34px 34px 60px}
.sthead{display:flex;gap:30px;align-items:flex-start;justify-content:space-between;
  margin-bottom:26px}
.sthead h1{font-size:33px;font-weight:600;letter-spacing:-.025em;margin-bottom:9px}
.sthead p{font-size:14.5px;color:var(--ink-soft);line-height:1.65;max-width:64ch}
.launch{display:inline-flex;align-items:center;gap:11px;flex:none;background:var(--ink);
  color:#EDEEEA;border:none;border-radius:11px;padding:17px 28px;font:inherit;font-size:16px;
  font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(18,22,24,.22);
  transition:transform .13s var(--ease),box-shadow .22s}
.launch svg{width:18px;height:18px;transition:transform .22s var(--ease)}
.launch:hover{box-shadow:0 10px 34px rgba(18,22,24,.3)}
.launch:hover svg{transform:translateX(4px)}
.launch:active{transform:translateY(1px)}

.stbody{display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px;align-items:start}
.sttools{position:sticky;top:22px;background:rgba(255,255,255,.66);border:1px solid var(--paper-line);
  border-radius:12px;padding:18px}
.stsec{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);
  margin:19px 0 9px}
.stsec:first-child{margin-top:0}
.stpresets{display:grid;gap:5px}
.stpresets button,.stchips button{border:1px solid var(--paper-line);background:rgba(255,255,255,.7);
  border-radius:8px;padding:9px 13px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left;
  transition:all .15s var(--ease)}
.stpresets button:hover,.stchips button:hover{border-color:var(--ink-soft);background:#fff}
.stpresets button.on,.stchips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stchips{display:flex;flex-wrap:wrap;gap:5px}
.streset{width:100%;margin-top:8px;border:1px dashed var(--ink-soft);background:none;
  color:var(--ink-soft);border-radius:8px;padding:9px;font:inherit;font-size:12.5px;cursor:pointer}
.streset:hover{background:rgba(255,255,255,.6);color:var(--ink)}
.strange{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-soft);
  padding:6px 0}
.strange>span{width:72px;flex:none}
.strange input{flex:1;accent-color:var(--ink)}
.strange b{width:38px;text-align:right;font-family:"Azeret Mono",monospace;font-size:12px;color:var(--ink)}
.stswatch{display:flex;gap:6px;flex-wrap:wrap}
.stswatch i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:transform .13s var(--ease),border-color .15s}
.stswatch i:hover{transform:scale(1.13)}
.stswatch i.on{border-color:var(--ink)}

.stcanvas{}
.stmock{border-radius:13px;overflow:hidden;box-shadow:0 26px 70px rgba(18,22,24,.26);
  border:1px solid rgba(0,0,0,.18);transition:transform .7s cubic-bezier(.6,0,.2,1),opacity .7s}
.stmock.zoom{transform:scale(1.9);opacity:0}
.stbar{display:flex;align-items:center;gap:9px;padding:11px 15px}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.stbar b{font-size:13px;font-weight:600}
.stbar em{font-style:normal;font-size:11px;opacity:.6}
.snav{display:flex;gap:5px;cursor:pointer}
.snav.top{padding:8px 13px;border-bottom:1px solid rgba(128,128,128,.22)}
.snav.top span{padding:6px 15px;border-radius:20px;font-size:11.5px;opacity:.65}
.snav.rail{flex-direction:column;width:74px;flex:none;padding:10px 8px;
  border-right:1px solid rgba(128,128,128,.22)}
.snav.rail span{padding:10px 6px;border-radius:7px;font-size:10.5px;text-align:center;opacity:.6}
.snav span.on{opacity:1;color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent)}
.snav:hover{outline:2px dashed rgba(128,128,128,.4);outline-offset:-2px}
.stinner{display:flex;min-height:400px}
.stinner.bottom{flex-direction:column}
.stinner.bottom .snav.rail{flex-direction:row;width:auto;border-right:none;
  border-bottom:1px solid rgba(128,128,128,.22)}

.stape{width:240px;flex:none;padding:0;display:flex;flex-direction:column;cursor:pointer;
  border-right:1px solid rgba(128,128,128,.22)}
.stinner.right .stape{border-right:none;border-left:1px solid rgba(128,128,128,.22)}
.stinner.bottom .stape{width:auto;border-left:none;border-top:1px solid rgba(128,128,128,.22);
  flex-direction:row;align-items:center;gap:18px;padding:12px 16px}
.stape:hover{outline:2px dashed rgba(128,128,128,.4);outline-offset:-2px}
.sth{padding:12px 15px;font-size:11.5px;font-weight:600;opacity:.6;
  border-bottom:1px solid rgba(128,128,128,.22)}
.stinner.bottom .sth{display:none}
.stl{display:flex;justify-content:space-between;gap:12px;padding:9px 15px;font-size:12px}
.stinner.bottom .stl{display:none}
.stt{display:flex;justify-content:space-between;align-items:baseline;padding:13px 15px;
  margin-top:auto;border-top:1px solid rgba(128,128,128,.22)}
.stinner.bottom .stt{margin:0 0 0 auto;border:none;padding:0}
.stt span{font-size:11.5px;opacity:.6}
.stt b{font-size:25px;font-weight:500;font-family:"Azeret Mono",monospace;letter-spacing:-.02em}
.stp{display:flex;gap:7px;padding:0 15px 15px}
.stinner.bottom .stp{padding:0}
.stp span{flex:1;text-align:center;padding:10px 4px;border:1px solid rgba(128,128,128,.3);
  border-radius:6px;font-size:12px;opacity:.75}

.sboard{flex:1;display:flex;flex-direction:column;min-width:0;padding:13px}
.ssearch{padding:11px 14px;border:1px solid rgba(128,128,128,.28);border-radius:6px;font-size:12px;
  opacity:.55;margin-bottom:11px;cursor:pointer}
.ssearch:hover{outline:2px dashed rgba(128,128,128,.4);outline-offset:-2px}
.ssec{display:flex;gap:4px;margin-bottom:11px;cursor:pointer;flex-wrap:wrap}
.ssec span{padding:7px 12px;font-size:12px;opacity:.55;cursor:pointer;border-radius:5px}
.ssec span.on{opacity:1;border-bottom:2px solid var(--a)}
.ssec.rail{flex-direction:column;width:112px;flex:none;margin:0 12px 0 0;gap:3px;flex-wrap:nowrap}
.ssec.rail span.on{border-bottom:none;border-left:2px solid var(--a)}
.ssec:hover{outline:2px dashed rgba(128,128,128,.4);outline-offset:-2px}
.srail{display:flex;flex:1;min-height:0}
.skeys{display:grid;gap:8px;flex:1;align-content:start}
.skeys.list{gap:0}
.sk{position:relative;padding:11px 12px;display:flex;flex-direction:column;justify-content:space-between;
  gap:7px;min-height:64px;cursor:grab;color:#fff;
  transition:transform .13s var(--ease),box-shadow .16s,outline-color .15s;outline:2px solid transparent}
.sk:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.3)}
.sk.sel{outline-color:#fff;z-index:2}
.sk.drag{opacity:.35}
.sk.over{outline-color:var(--vfd);outline-style:dashed}
.sk .sn{font-size:12.5px;font-weight:500;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.sk .sp{font-size:12.5px;font-family:"Azeret Mono",monospace;opacity:.9}
.sk.list{flex-direction:row;align-items:center;gap:11px;min-height:0;padding:10px 8px;color:inherit;
  border-bottom:1px solid rgba(128,128,128,.22);background:transparent!important}
.sk.list .sbar{width:3px;height:17px;border-radius:2px;flex:none}
.sk.list .sn{flex:1;text-shadow:none}
.sk.pad{align-items:center;justify-content:center;text-align:center;min-height:84px}
.sk.pad .sn{font-size:14px;font-weight:600}
.sk.pad .sp{font-size:16px}
.sk.card{padding:0;gap:0;color:inherit;background:rgba(128,128,128,.1)!important;
  border:1px solid rgba(128,128,128,.25);overflow:hidden}
.sk.card .scap{display:block;height:5px}
.sk.card .sbody{display:block;padding:12px 13px 9px;flex:1}
.sk.card .sn{text-shadow:none}
.sk.card .sfoot{display:flex;padding:10px 13px;border-top:1px solid rgba(128,128,128,.22)}
.sfk{display:flex;gap:6px;margin-top:auto;padding-top:11px;
  border-top:1px solid rgba(128,128,128,.22);cursor:pointer}
.sfk span{flex:1;text-align:center;padding:8px 3px;border:1px solid rgba(128,128,128,.28);
  border-radius:5px;font-size:11px;opacity:.6}
.sfk:hover{outline:2px dashed rgba(128,128,128,.4);outline-offset:-2px}
.sthint{margin-top:14px;font-size:13px;color:var(--ink-soft);line-height:1.6}

#studio.launching{animation:studioOut .76s cubic-bezier(.6,0,.2,1) forwards}
@keyframes studioOut{
  0%{opacity:1}
  55%{opacity:1}
  100%{opacity:0}
}
#studio.launching .sthead,#studio.launching .sttools,#studio.launching .sthint{
  animation:fadeUp .35s var(--ease) forwards}
@keyframes fadeUp{to{opacity:0;transform:translateY(-14px)}}
#app.arrive{animation:arrive .8s cubic-bezier(.2,.7,.3,1)}
@keyframes arrive{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}

@media(max-width:1080px){
  .stbody{grid-template-columns:1fr}
  .sttools{position:static}
  .sthead{flex-direction:column;gap:18px}
}

/* ---- studio: making it obvious what can be changed ---- */
.stcbar{display:flex;align-items:center;gap:14px;margin-bottom:12px;min-height:34px}
.stguide{border:1px solid var(--paper-line);background:rgba(255,255,255,.7);border-radius:20px;
  padding:8px 16px;font:inherit;font-size:12.5px;color:var(--ink-soft);cursor:pointer;
  transition:all .15s var(--ease);flex:none}
.stguide:hover{border-color:var(--ink-soft);color:var(--ink)}
.stguide.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stflash{font-size:13px;color:var(--ink);opacity:0;transform:translateX(-8px);
  transition:opacity .2s,transform .2s var(--ease);font-weight:500}
.stflash.show{opacity:1;transform:none}



/* ---- editable regions: outlined, never covered ---- */
.zone{position:relative;cursor:pointer;transition:outline-color .15s,background .15s}
.stmock.guide .zone{outline:1px dashed rgba(128,128,128,.42);outline-offset:-2px}
.zone:hover{outline:2px solid var(--vfd)!important;outline-offset:-2px;
  background:color-mix(in srgb,var(--vfd) 7%,transparent)}
.sthint{margin-top:14px;font-size:13.5px;color:var(--ink-soft);line-height:1.65;min-height:42px;
  padding:11px 15px;background:rgba(255,255,255,.6);border:1px solid var(--paper-line);
  border-radius:9px;transition:background .16s}
.sthint b{color:var(--ink)}

/* ---- the mock laid out on a grid so panels can't fall out of place ---- */
.stinner{display:grid;min-height:420px;align-items:stretch}
.stinner.rail.left{grid-template-columns:74px 240px minmax(0,1fr)}
.stinner.rail.right{grid-template-columns:74px minmax(0,1fr) 240px}
.stinner.top.left{grid-template-columns:240px minmax(0,1fr)}
.stinner.top.right{grid-template-columns:minmax(0,1fr) 240px}
.stinner.rail.bottom{grid-template-columns:74px minmax(0,1fr);
  grid-template-areas:"nav board" "nav tape"}
.stinner.rail.bottom .snav{grid-area:nav}
.stinner.rail.bottom .sboard{grid-area:board}
.stinner.rail.bottom .stape{grid-area:tape}
.stinner.top.bottom{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto}
.stinner .snav.rail{width:auto}
.stinner .stape{width:auto}
.stinner.bottom .stape{flex-direction:row;align-items:center;gap:18px;padding:12px 16px;
  border-left:none;border-top:1px solid rgba(128,128,128,.22)}
.sboard{min-width:0;overflow:hidden}
.srail{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;flex:1;min-height:0}
.ssec.rail{width:auto;margin:0}
.skeys{min-width:0}

/* ======================= BUILDING YOUR POS =======================
   It was a heading and one grey line on an empty page. It's now the whole
   screen, because something genuinely is being built and the wait should feel
   like progress rather than a hang. */
#building{align-items:center;justify-content:center}
.bs{width:100%;max-width:620px;text-align:center;position:relative;padding:0 24px}
.bsorb{position:absolute;left:50%;top:-120px;transform:translateX(-50%);width:340px;height:340px;
  pointer-events:none;filter:blur(46px);opacity:.55}
.bsorb i{position:absolute;inset:0;border-radius:50%;display:block}
.bsorb i:nth-child(1){background:radial-gradient(circle,rgba(92,224,168,.75),transparent 65%);
  animation:orb1 5.5s ease-in-out infinite}
.bsorb i:nth-child(2){background:radial-gradient(circle,rgba(107,168,216,.6),transparent 65%);
  animation:orb2 7s ease-in-out infinite}
.bsorb i:nth-child(3){background:radial-gradient(circle,rgba(224,178,85,.5),transparent 65%);
  animation:orb3 9s ease-in-out infinite}
@keyframes orb1{0%,100%{transform:translate(-14%,-6%) scale(1)}50%{transform:translate(16%,10%) scale(1.2)}}
@keyframes orb2{0%,100%{transform:translate(12%,8%) scale(1.1)}50%{transform:translate(-14%,-8%) scale(.9)}}
@keyframes orb3{0%,100%{transform:translate(6%,-12%) scale(.95)}50%{transform:translate(-8%,14%) scale(1.25)}}

.bskicker{position:relative;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:14px;animation:qin .5s var(--ease) both}
.bstitle{position:relative;font-size:clamp(38px,6vw,62px);font-weight:600;letter-spacing:-.035em;
  line-height:1.02;margin-bottom:26px;animation:qin .5s var(--ease) .06s both}
.bsnow{position:relative;display:inline-flex;align-items:center;gap:10px;font-size:17px;
  color:var(--ink);margin-bottom:22px;min-height:26px}
.bsdots{display:inline-flex;gap:4px}
.bsdots i{width:5px;height:5px;border-radius:50%;background:var(--ink-soft);
  animation:bd 1.3s ease-in-out infinite}
.bsdots i:nth-child(2){animation-delay:.16s}
.bsdots i:nth-child(3){animation-delay:.32s}
@keyframes bd{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

.bsbar{position:relative;height:4px;background:rgba(18,22,24,.1);border-radius:4px;overflow:hidden;
  margin-bottom:30px}
.bsbar span{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,#5CE0A8,#6BA8D8);transition:width .6s cubic-bezier(.2,.8,.3,1)}
.bslist{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;
  max-width:420px;margin:0 auto}
.bsl{display:flex;gap:12px;align-items:center;padding:9px 14px;border-radius:8px;font-size:14.5px;
  color:var(--ink-soft);animation:qin .4s var(--ease) both;transition:all .3s var(--ease)}
.bsl .bsm{width:16px;flex:none;font-weight:600;text-align:center}
.bsl.done{color:var(--ink)}
.bsl.done .bsm{color:#2E9E76}
.bsl.now{background:rgba(255,255,255,.65);color:var(--ink);
  box-shadow:0 2px 12px rgba(18,22,24,.06)}
.bsl.skip{color:#B08328}
.bsnote{position:relative;margin-top:22px;font-size:13px;color:var(--ink-soft)}

/* ============================ THE LAUNCH ============================ */
#studio.launching .pklist,#studio.launching .pkhead,#studio.launching .pkwhy,
#studio.launching .sttools,#studio.launching .sthead{
  animation:toolsOut .45s cubic-bezier(.5,0,.75,0) forwards}
@keyframes toolsOut{to{opacity:0;transform:translateY(-28px);filter:blur(6px)}}

@keyframes keyfire{
  0%{transform:none;filter:none}
  35%{transform:scale(1.16) translateY(-4px);filter:brightness(1.7)}
  100%{transform:scale(.55) translateY(-30px);opacity:0;filter:brightness(2.6)}
}
.stcanvas{perspective:1400px}
.pkstage{perspective:1500px}
.qmock{transition:transform 1s cubic-bezier(.6,0,.25,1),filter 1s,opacity .5s;
  transform-style:preserve-3d}
.qmock.rush{transform:perspective(1500px) rotateX(15deg) scale(3.2) translateY(-8%);
  filter:brightness(1.7) blur(3px);opacity:0}

.lv{position:fixed;inset:0;z-index:200;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.lv.wash .lv.wash 
/* ---- studio: entrance animation only on the first open ---- */
.stwrap>*{animation:none}
.stwrap.enter .sthead{}
.stwrap.enter .sttools{}
.stwrap.enter .stcanvas{}

/* ---- pre-flight ---- */
.pfcard{max-width:520px}
.pflist{display:flex;flex-direction:column;gap:5px;margin-top:16px;max-height:52vh;overflow-y:auto}
.pfrow{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border-radius:var(--r);
  border:1px solid var(--line);background:rgba(255,255,255,.02);animation:qin .3s var(--ease) both}
.pfrow.ok{border-color:rgba(92,224,168,.28)}
.pfrow.warn{border-color:rgba(224,178,85,.4);background:rgba(224,178,85,.05)}
.pfrow.bad{border-color:rgba(210,102,76,.5);background:rgba(210,102,76,.06)}
.pfm{width:19px;height:19px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;margin-top:1px}
.pfrow.ok .pfm{background:rgba(92,224,168,.18);color:var(--vfd)}
.pfrow.warn .pfm{background:rgba(224,178,85,.2);color:var(--warn)}
.pfrow.bad .pfm{background:rgba(210,102,76,.22);color:var(--void)}
.pfrow b{display:block;font-size:13.5px;font-weight:500}
.pfrow em{display:block;font-style:normal;font-size:12.5px;color:var(--txt-2);margin-top:3px;line-height:1.5}

/* ---- the boot sequence readout ---- */
.lv.stepping @keyframes stepIn{to{opacity:1;transform:none}}

/* ---- selection is an outline and a pin, never a button under the cursor ---- */
.sk{user-select:none;-webkit-user-select:none}
.sk.sel{outline:3px solid var(--vfd)!important;outline-offset:-1px;z-index:2}
.skpin{position:absolute;top:-6px;right:-6px;width:15px;height:15px;border-radius:50%;
  background:var(--vfd);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.sk.drag{opacity:.3}
.sk.over{outline:3px dashed var(--vfd)!important;outline-offset:2px}

/* ---- the selected key's controls, beside the board ---- */
.selnone{font-size:12.5px;color:var(--ink-soft);line-height:1.6;padding:10px 12px;
  border:1px dashed var(--paper-line);border-radius:8px}
.selbox{border:1px solid var(--paper-line);background:rgba(255,255,255,.7);border-radius:9px;
  padding:13px}
.selname{font-size:14px;font-weight:600;line-height:1.3}
.selsub{font-size:12px;color:var(--ink-soft);margin-top:3px}
.selsw{display:flex;gap:4px;flex-wrap:wrap;margin-top:11px}
.selsw i{width:24px;height:24px;border-radius:6px;cursor:pointer;border:2px solid transparent;
  transition:transform .12s var(--ease),border-color .14s}
.selsw i:hover{transform:scale(1.12)}
.selsw i.on{border-color:var(--ink)}
.selsw i.x{background:rgba(18,22,24,.08);color:var(--ink-soft);display:grid;place-items:center;
  font-size:12px;font-style:normal}
.selrename,.seldrop{width:100%;margin-top:8px;border:1px solid var(--paper-line);
  background:rgba(255,255,255,.8);border-radius:8px;padding:9px;font:inherit;font-size:12.5px;
  cursor:pointer;transition:all .15s}
.selrename:hover{border-color:var(--ink-soft)}
.seldrop{border-color:rgba(200,80,60,.35);color:#B04A34}
.seldrop:hover{background:rgba(200,80,60,.08);border-color:#B04A34}

/* Re-rendering part of the studio must never replay an entrance animation —
   that reads as the screen jumping on every click. Only the first open animates. */
#studio .sthead,#studio .sttools,#studio .stcanvas,#studio .stmock,
#studio .selbox,#studio .sk{animation:none}
.stwrap.enter .sthead{animation:qin .45s var(--ease) both}
.stwrap.enter .sttools{animation:qin .45s var(--ease) .06s both}
.stwrap.enter .stcanvas{animation:qin .45s var(--ease) .12s both}

/* ---- pre-flight: readable, whatever the store's theme is ---- */
.pfcard{background:#1E2427;border-color:#3A4245}
.pfcard h3{color:#F2F5F5}
.pfcard>p{color:#9BA5A9}
.pfrow{background:rgba(255,255,255,.04);border-color:#39423F}
.pfrow b{color:#F2F5F5;font-weight:600}
.pfrow em{color:#A8B2B5}
.pfrow.ok{background:rgba(92,224,168,.07);border-color:rgba(92,224,168,.3)}
.pfrow.warn{background:rgba(224,178,85,.09);border-color:rgba(224,178,85,.42)}
.pfrow.warn b{color:#F0D9A6}
.pfrow.bad{background:rgba(210,102,76,.11);border-color:rgba(210,102,76,.5)}
.pfrow.bad b{color:#F2BCAC}

/* ---- a bigger palette ---- */
.swatchrow{gap:8px;max-width:420px}
.swatchrow .ac{width:34px;height:34px}
.stswatch i{width:24px;height:24px}

/* ---- the logo drop ---- */
.logodrop{display:flex;align-items:center;gap:16px;margin-top:26px;padding:20px;
  border:1.5px dashed var(--paper-line);border-radius:12px;background:rgba(255,255,255,.55);
  cursor:pointer;transition:border-color .16s,background .16s,transform .13s var(--ease)}
.logodrop:hover{border-color:var(--ink-soft);background:#fff}
.logodrop.over{border-color:var(--ink);background:#fff;transform:translateY(-2px)}
.logodrop svg{width:30px;height:30px;stroke:var(--ink-soft);fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.logodrop img{width:62px;height:62px;object-fit:contain;flex:none;border-radius:8px;
  background:#fff;padding:5px;box-shadow:0 2px 10px rgba(18,22,24,.1)}
.logotext b{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
.logotext span{display:block;font-size:13px;color:var(--ink-soft);line-height:1.6}
.logoclear{margin-top:10px;border:none;background:none;color:var(--ink-soft);font:inherit;
  font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.logoclear:hover{color:var(--void)}
.sidelogo{width:22px;height:22px;object-fit:contain;border-radius:5px;background:#fff;
  padding:2px;flex:none}
#hdrMark img{width:20px;height:20px;object-fit:contain;border-radius:4px;background:#fff;padding:2px}
#hdrMark{display:flex;align-items:center}

/* ============================ THE LAUNCH PLATE ============================ */
.lv-bg{position:absolute;inset:0;background:#0C1113;opacity:0;transition:opacity .5s}
.lv.wash .lv-bg{opacity:1}
.lv-glow{position:absolute;left:50%;top:50%;width:min(120vw,1100px);height:min(120vw,1100px);
  transform:translate(-50%,-50%) scale(.2);border-radius:50%;opacity:0;
  background:radial-gradient(circle,var(--a) 0%,transparent 62%)}
.lv.wash .lv-glow{animation:glowUp 1.4s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes glowUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  45%{opacity:.55}100%{opacity:.28;transform:translate(-50%,-50%) scale(1)}}
.lv-rays{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
.lv.wash .lv-rays{animation:rays 1.6s cubic-bezier(.2,.8,.3,1) forwards}
.lv-rays i{position:absolute;left:-1px;bottom:0;width:2px;height:54vmax;display:block;
  transform-origin:bottom center;
  background:linear-gradient(to top,transparent,color-mix(in srgb,var(--a) 70%,transparent))}
@keyframes rays{0%{opacity:0;transform:scale(.15) rotate(0)}35%{opacity:.35}
  100%{opacity:0;transform:scale(1.6) rotate(26deg)}}

.lv-plate{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;
  padding:44px 52px 34px;border-radius:22px;min-width:min(440px,86vw);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);
  box-shadow:0 34px 90px rgba(0,0,0,.55);
  opacity:0;transform:translateY(26px) scale(.94);filter:blur(8px)}
.lv.named .lv-plate{animation:plateIn .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes plateIn{to{opacity:1;transform:none;filter:blur(0)}}
.lv-ring{position:absolute;top:44px;width:112px;height:112px;border:1.5px solid var(--a);
  border-radius:50%;opacity:0}
.lv-ring.two{width:168px;height:168px;top:16px}
.lv.named .lv-ring{animation:ring 2s cubic-bezier(.2,.8,.3,1) .25s infinite}
.lv.named .lv-ring.two{animation-delay:.5s}
@keyframes ring{0%{opacity:0;transform:scale(.75)}25%{opacity:.4}100%{opacity:0;transform:scale(1.5)}}
.lv-mark{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.94);box-shadow:0 12px 34px rgba(0,0,0,.4);overflow:hidden;
  margin-bottom:22px;position:relative;z-index:2}
.lv-mark img{width:100%;height:100%;object-fit:contain;padding:11px}
.lv-initial{font-size:44px;font-weight:700;color:#141A1C;letter-spacing:-.03em}
.lv-title{font-size:clamp(25px,3.6vw,38px);font-weight:600;letter-spacing:-.03em;color:#fff;
  text-align:center;line-height:1.15}
.lv-slogan{font-style:normal;font-size:14.5px;color:rgba(255,255,255,.62);margin-top:9px;
  text-align:center;max-width:32ch;line-height:1.5}
.lv-rule{width:44px;height:2px;background:var(--a);border-radius:2px;margin:22px 0 20px;opacity:.8}
.lv-steps{display:flex;flex-direction:column;gap:9px;align-items:flex-start;min-height:198px}
.lv-steps span{display:flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.09em;
  text-transform:uppercase;color:rgba(255,255,255,.5);opacity:0;transform:translateX(-8px)}
.lv-steps span i{width:5px;height:5px;border-radius:50%;background:var(--a);flex:none;opacity:.9}
.lv.stepping .lv-steps span{animation:stepIn .5s cubic-bezier(.16,1,.3,1) both}
@keyframes stepIn{to{opacity:1;transform:none}}
.lv-steps span:last-child{color:#fff;font-weight:600}
.lv-foot{margin-top:26px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.32)}

/* ---- logo background removal ---- */
.logotools{margin-top:14px}
.logopreviews{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lp{border:1.5px solid var(--paper-line);border-radius:10px;padding:12px;cursor:pointer;
  background:rgba(255,255,255,.55);text-align:center;transition:all .16s var(--ease)}
.lp:hover{border-color:var(--ink-soft)}
.lp.on{border-color:var(--ink);background:#fff;box-shadow:0 3px 14px rgba(18,22,24,.09)}
.lpimg{display:grid;place-items:center;height:86px;border-radius:7px;overflow:hidden;margin-bottom:9px}
.lpimg img{max-width:100%;max-height:78px;object-fit:contain}
.lpimg.plain{background:#fff}
/* a checkerboard, so transparency reads as transparency */
.lpimg.checker{background-color:#fff;
  background-image:linear-gradient(45deg,#DDE0DA 25%,transparent 25%,transparent 75%,#DDE0DA 75%),
    linear-gradient(45deg,#DDE0DA 25%,transparent 25%,transparent 75%,#DDE0DA 75%);
  background-size:14px 14px;background-position:0 0,7px 7px}
.lp em{display:block;font-style:normal;font-size:12.5px;color:var(--ink-soft)}
.lp.on em{color:var(--ink);font-weight:500}
.logotools .strange>span{width:76px}
.logotools .strange input{accent-color:var(--ink)}

/* ======================= CONFIGURATION, REGROUPED =======================
   The same screens, in a sidebar grouped the way an owner thinks about them,
   with a landing page that explains what each one is for. */
#vConfig{padding:0;overflow:hidden}
.cfgwrap{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%;min-height:0}
.cfgnav{border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 30px;
  background:rgba(0,0,0,.14)}
.cfghome{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border-radius:var(--r);
  font-size:13.5px;color:var(--txt-2);transition:background .14s,color .14s}
.cfghome svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.cfghome:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.cfghome.on{background:rgba(92,224,168,.12);color:var(--vfd)}
.cfgsearch{margin:12px 0 6px}
.cfgsearch input{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);
  color:var(--txt);padding:9px 12px;border-radius:var(--r);font-size:13px}
.cfgsearch input:focus{outline:none;border-color:var(--vfd)}
.cfggroup{margin-top:16px}
.cfggh{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3);
  padding:0 12px 6px}
.cfgt{display:block;width:100%;padding:8px 12px;border-radius:var(--r);font-size:13.5px;
  color:var(--txt-2);transition:background .14s,color .14s}
.cfgt:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.cfgt.on{background:rgba(92,224,168,.12);color:var(--vfd);font-weight:500}
.cfgnone{padding:16px 12px;font-size:13px;color:var(--txt-3)}

.cfgmain{display:flex;flex-direction:column;min-height:0;min-width:0;padding:20px 26px 0}
.cfghead{padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.cfghead h2{font-size:21px;font-weight:600;letter-spacing:-.02em}
.cfghead p{font-size:13.5px;color:var(--txt-2);margin-top:4px}
.cfgmain .edwrap{flex:1;overflow-y:auto;padding:16px 4px 30px 0;margin:0}

/* ---- the landing page ---- */
.cfghero{margin-bottom:30px}
.cfghero h2{font-size:29px;font-weight:600;letter-spacing:-.025em;margin-bottom:8px}
.cfghero p{font-size:14.5px;color:var(--txt-2);line-height:1.65;max-width:62ch}
.cfgalert,.cfgok{display:flex;flex-direction:column;gap:3px;margin-top:18px;padding:14px 17px;
  border-radius:var(--r2);border:1px solid var(--line);text-align:left;width:fit-content;min-width:280px}
.cfgalert{cursor:pointer;transition:transform .14s var(--ease),border-color .16s}
.cfgalert:hover{transform:translateY(-1px)}
.cfgalert.bad{border-color:rgba(210,102,76,.5);background:rgba(210,102,76,.08)}
.cfgalert.warn{border-color:rgba(224,178,85,.42);background:rgba(224,178,85,.07)}
.cfgok{border-color:rgba(92,224,168,.3);background:rgba(92,224,168,.06)}
.cfgalert b,.cfgok b{font-size:14px;font-weight:600}
.cfgalert span,.cfgok span{font-size:12.5px;color:var(--txt-2)}

.cfgsect{margin-bottom:26px}
.cfgsh{display:flex;align-items:baseline;gap:11px;margin-bottom:11px;flex-wrap:wrap}
.cfgsh b{font-size:15px;font-weight:600}
.cfgsh em{font-style:normal;font-size:12.5px;color:var(--txt-3)}
.cfgcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:9px}
.cfgcard{text-align:left;border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;
  background:rgba(255,255,255,.02);transition:border-color .16s,transform .14s var(--ease),background .16s}
.cfgcard:hover{border-color:var(--vfd);transform:translateY(-2px);background:rgba(255,255,255,.04)}
.cfgcard b{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.cfgcard span{display:block;font-size:12.5px;color:var(--txt-2);line-height:1.55}

@media(max-width:900px){
  .cfgwrap{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .cfgnav{border-right:none;border-bottom:1px solid var(--line);max-height:38vh}
  .cfgmain{padding:16px 18px 0}
}

/* ---- retention ---- */
.retpick{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
.rp{text-align:left;border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;
  background:rgba(255,255,255,.02);transition:border-color .16s,background .16s,transform .14s}
.rp:hover{border-color:var(--line-2);transform:translateY(-1px)}
.rp.on{border-color:var(--vfd);background:rgba(92,224,168,.07)}
.rp b{display:block;font-size:15px;font-weight:600;margin-bottom:5px}
.rp span{display:block;font-size:12.5px;color:var(--txt-2);line-height:1.55}
.retnext{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.retnext>div{border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;
  background:rgba(255,255,255,.02)}
.retnext b{display:block;font-size:24px;font-weight:500}
.retnext span{display:block;font-size:12px;color:var(--txt-3);margin-top:3px}
.keepwhat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.kw{border-radius:var(--r2);padding:14px 16px;border:1px solid}
.kw.go{border-color:rgba(210,102,76,.4);background:rgba(210,102,76,.07)}
.kw.no{border-color:rgba(92,224,168,.3);background:rgba(92,224,168,.06)}
.kw b{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.kw.go b{color:#D2664C}
.kw.no b{color:#5CE0A8}
.kw span{display:block;font-size:12.5px;line-height:1.55;color:var(--txt-2)}
.dl{color:var(--vfd);text-decoration:underline;text-underline-offset:3px;font-size:12.5px}
#setup .keepwhat .kw{border-width:1px}
#setup .kw.go{background:rgba(200,80,60,.07);border-color:rgba(200,80,60,.3)}
#setup .kw.no{background:rgba(40,150,110,.07);border-color:rgba(40,150,110,.3)}
#setup .kw.go b{color:#B04A34}
#setup .kw.no b{color:#2E8B62}
#setup .kw span{color:var(--ink-soft)}

/* the chosen register's type reaches the numbers too */
:root{--ff:Archivo;--fm:"Azeret Mono"}
.num,#app .num,.grid .kp,.grand .amt,.tape .amt{font-family:var(--fm),"Azeret Mono",monospace}
#app,#app button,#app input,#app select,#app textarea{font-family:var(--ff),system-ui,sans-serif}

/* the build stamp is a block in the flow, not something floating over findings */
.buildbox{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r2);
  background:rgba(255,255,255,.02);font-size:13px;line-height:1.7;color:var(--txt-2);
  margin-bottom:14px;position:static;clear:both}
.buildbox b{color:var(--txt)}
.findings,.finding{position:relative;clear:both}

/* ---- picking a register ---- */
#studio{background:#EAEBE7}
.pkwrap{max-width:1500px;margin:0 auto;padding:34px 34px 60px}
.pkhead{display:flex;gap:34px;align-items:flex-start;justify-content:space-between;margin-bottom:26px}
.pkkick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
  margin-bottom:10px}
.pkhead h1{font-size:36px;font-weight:600;letter-spacing:-.03em;margin-bottom:10px}
.pkhead p{font-size:14.5px;color:var(--ink-soft);line-height:1.65;max-width:60ch}
.pkbody{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
.pklist{display:flex;flex-direction:column;gap:8px;position:sticky;top:22px;
  max-height:calc(100vh - 60px);overflow-y:auto;padding-right:4px}
.pkcard{display:flex;gap:12px;align-items:center;text-align:left;padding:9px;border-radius:11px;
  border:1.5px solid var(--paper-line);background:rgba(255,255,255,.6);
  transition:border-color .16s,background .16s,transform .13s var(--ease)}
.pkcard:hover{border-color:var(--ink-soft);background:#fff;transform:translateX(2px)}
.pkcard.on{border-color:var(--ink);background:#fff;box-shadow:0 4px 16px rgba(18,22,24,.1)}
.pkswatch{position:relative;width:74px;height:54px;border-radius:6px;border:1px solid;flex:none;
  overflow:hidden}
.pkswatch .nv{position:absolute;display:block}
.pkswatch .nv.side{left:0;top:0;bottom:0;width:11px}
.pkswatch .nv.top{left:0;right:0;top:0;height:9px}
.pkswatch .tp{position:absolute;display:block;border:0 solid}
.pkswatch .tp.left{left:11px;top:0;bottom:0;width:20px}
.pkswatch .tp.right{right:0;top:0;bottom:0;width:20px}
.pkswatch .tp.bottom{left:0;right:0;bottom:0;height:13px}
.pkswatch .kys{position:absolute;display:grid;gap:2px;grid-template-columns:1fr 1fr;
  left:14px;right:23px;top:4px;bottom:4px}
.pkswatch .kys.top{top:12px}
.pkswatch .kys.left{left:34px;right:3px}
.pkswatch .kys.bottom{bottom:16px;right:3px;left:14px}
.pkswatch .kys.list{grid-template-columns:1fr;gap:1.5px}
.pkswatch .kys i{display:block}
.pkswatch .ac{position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%}
.pkmeta b{display:block;font-size:14.5px;font-weight:600;margin-bottom:3px}
.pkmeta em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-soft);line-height:1.45}

.pkstage{display:flex;flex-direction:column;gap:16px}
.qmock{border:1px solid;border-radius:13px;overflow:hidden;box-shadow:0 24px 64px rgba(18,22,24,.26);
  animation:qin .3s var(--ease) both;font-size:12px}
.qbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid}
.qbar i{width:8px;height:8px;border-radius:50%;flex:none;display:block}
.qbar img{width:20px;height:20px;object-fit:contain;border-radius:5px;background:#fff;padding:2px;flex:none}
.qbar b{font-size:14px;font-weight:600}
.qbar em{font-style:normal;font-size:11.5px}
.qnav{display:flex;gap:5px}
.qnav.top{padding:8px 14px;border-bottom:1px solid}
.qnav.top span{padding:6px 15px;border-radius:20px;font-size:12px}
.qnav.rail{flex-direction:column;width:78px;flex:none;padding:11px 8px;border-right:1px solid}
.qnav.rail span{padding:10px 6px;border-radius:7px;font-size:11px;text-align:center}
.qbody{display:grid;min-height:390px}
.qbody.rail.left{grid-template-columns:78px 232px minmax(0,1fr)}
.qbody.rail.right{grid-template-columns:78px minmax(0,1fr) 232px}
.qbody.top.left{grid-template-columns:232px minmax(0,1fr)}
.qbody.top.right{grid-template-columns:minmax(0,1fr) 232px}
.qbody.rail.bottom{grid-template-columns:78px minmax(0,1fr);grid-template-areas:"n b" "n t"}
.qbody.rail.bottom .qnav{grid-area:n}.qbody.rail.bottom .qboard{grid-area:b}
.qbody.rail.bottom .qtape{grid-area:t}
.qbody.top.bottom{grid-template-rows:1fr auto}
.qtape{display:flex;flex-direction:column;border-left:1px solid}
.qbody.left .qtape{border-left:none;border-right:1px solid}
.qbody.bottom .qtape{flex-direction:row;align-items:center;gap:18px;padding:12px 16px;
  border-left:none;border-top:1px solid}
.qth{padding:12px 15px;font-size:12px;font-weight:600;opacity:.6;border-bottom:1px solid}
.qbody.bottom .qth,.qbody.bottom .qtl{display:none}
.qtl{display:flex;justify-content:space-between;gap:12px;padding:10px 15px;font-size:12px}

<script>
/* =============================================================================
   AI POS v4
   Architecture borrows deliberately:
     Verifone Commander  — PLU / department / menu / MOP separation, restrictions,
                           mix-and-match, X and Z reads, safe drop, pay in/out
     Gilbarco Passport   — security groups, reason codes on exceptions,
                           blind balancing, scheduled cashier reminders
     Toast / Square      — modifier groups (required vs optional, priced options)
   The register is a thin client over one config object. Nothing is hardcoded
   that a store might reasonably need to change.
   ========================================================================== */

const $=id=>document.getElementById(id);
const money=n=>(Math.round(n*100)/100).toFixed(2);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* For values going inside an inline handler's quoted argument. HTML escaping is
   not enough there — an apostrophe in "we'd like to start" ends the string and
   silently kills the button. */
const jsq=s=>String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'")
  .replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/\r?\n/g," ");
const uid=()=>Math.random().toString(36).slice(2,8);
const byId=(a,id)=>(a||[]).find(x=>x.id===id);
const hhmm=d=>d.toTimeString().slice(0,5);

const A={type:"",typeOther:"",name:"",desc:"",caps:[],loc:"",margin:"35",ending:"x9",dir:"nearest",
  priceMode:"margin",trade:{},mods:[],
  staff:[],layout:"",accent:"",mode:"dark",footer:"",policy:"",startCash:"200",
  logo:"",logoRaw:"",logoCut:false,logoTol:60,logoNote:"",slogan:"",
  keep:"keep",keepDays:"90",keepEmail:""};
let TRADE_Q=[],REC_MODS=[],TRADE_ASKED=false,FLEET=null,FLEET_ASKED=false;

/* What other stores of this trade already worked out. Structure only — the
   server will not hand over anything else. */
async function askFleet(){
  if(FLEET_ASKED||!A.type)return; FLEET_ASKED=true;
  try{
    const r=await api("/api/learn/suggest?type="+encodeURIComponent(A.type)
      +(typeof STORE_ID!=="undefined"&&STORE_ID?"&store="+STORE_ID:""));
    FLEET=r&&r.ready?r:null;
    if(FLEET){
      /* Pre-fill from consensus, but only where the owner hasn't answered. */
      if(!A.caps.length&&FLEET.caps?.length)A.caps=FLEET.caps.slice();
      if(!A.layout&&FLEET.layout?.v)A.layout=FLEET.layout.v;
      if(!A.mods.length&&FLEET.modules?.length)A.mods=FLEET.modules.map(m=>m.k);
      if(FLEET.priceMode?.v&&FLEET.priceMode.share>.6)A.priceMode=FLEET.priceMode.v;
      draw();
    }
  }catch(e){FLEET=null}
}
let TAXINFO=null;
const CAPS=[["age","Age-restricted products"],["weight","Items sold by weight"],
  ["foodservice","Prepared food with options"],["fuel","Fuel pumps"],["lottery","Lottery"],
  ["ebt","EBT / SNAP"],["deposit","Bottle deposit"]];
/* The business type steers the departments, the tax categories, which modules
   load and what the assistant suggests — so eight options meant eight different
   kinds of shop all being told they sell energy drinks. */
const TYPE_GROUPS=[
 ["Convenience & fuel",["Convenience store","Gas station","Truck stop","Bodega / corner shop","Kiosk"]],
 ["Grocery & food retail",["Grocery store","Supermarket","International market","Health food store",
   "Butcher","Fishmonger","Produce market","Farm stand","Cheese shop"]],
 ["Food & drink service",["Café","Coffee shop","Bakery","Deli / sandwich shop","Restaurant",
   "Fast food","Pizzeria","Food truck","Juice / smoothie bar","Ice cream shop","Bar / pub","Brewery / taproom"]],
 ["Alcohol, tobacco & vape",["Liquor store","Wine shop","Beer store","Tobacco shop","Vape shop",
   "Smoke shop","Dispensary"]],
 ["Clothing & accessories",["Clothing store","Boutique","Shoe store","Streetwear shop",
   "Children's clothing","Jewelry store","Watch shop","Handbags & accessories","Thrift / consignment"]],
 ["Health & beauty",["Pharmacy","Beauty supply","Cosmetics shop","Vitamin & supplement store",
   "Salon","Barbershop","Nail salon","Spa"]],
 ["Home, garden & trade",["Hardware store","Paint store","Garden centre","Nursery","Furniture store",
   "Home goods","Lighting store","Flooring / tile"]],
 ["Speciality retail",["Bookstore","Toy store","Game store","Comic shop","Record shop",
   "Musical instruments","Craft & hobby","Fabric & yarn","Stationery / office supplies",
   "Party supplies","Gift shop","Florist","Antiques"]],
 ["Sport, outdoor & auto",["Sporting goods","Bike shop","Outdoor & camping","Fishing & tackle",
   "Gun shop","Auto parts","Tire shop","Car wash","Motorcycle / powersports"]],
 ["Electronics & phones",["Electronics store","Phone & accessories","Computer shop","Repair shop",
   "Camera store"]],
 ["Pets & animals",["Pet store","Pet grooming","Feed & farm supply","Aquarium shop"]],
 ["Something else",["Other retail","Other food service","Other service business"]]
];
const TYPES=TYPE_GROUPS.flatMap(g=>g[1]);

/* How the counter actually works differs more between trades than the product
   list does. A grocery scans and needs the search bar leading; a café taps and
   needs six big keys. Same code, different shape. */
/* An interface style changes how the register is DRAWN, not just how big things
   are. Keys render as tiles, rows, cards or pads. Navigation is a rail or a top
   bar. The receipt is a till roll, a plain list, or a summary. A pizza shop and
   a grocery should not be the same screen with different words on it. */
/* Eight registers, each designed as a whole rather than assembled from sliders.
   Different type, different palette, different arrangement, different weight.
   Every one has been drawn deliberately and works — which is worth more than
   the freedom to build something that doesn't. */
const LAYOUTS=[
 {k:"counter",n:"Counter",tag:"Convenience, hardware, anywhere with a scanner",

}

/* Background removal.

   Most logos arrive as a mark on a solid white square, which looks like a
   sticker on a dark launch plate. This floods inward from the edges, clearing
   anything close to the corner colour, and stops at the artwork. Flooding from
   the edges rather than matching every white pixel is what keeps the white
   inside an O, or the highlight on a bottle, intact. */
function removeBg(src, tol, cb){
  const img=new Image();
  img.onload=()=>{
    const w=img.width,h=img.height;
    const c=document.createElement("canvas");
    c.width=w;c.height=h;
    const cx=c.getContext("2d",{willReadFrequently:true});
    cx.drawImage(img,0,0);
    const d=cx.getImageData(0,0,w,h),px=d.data;

    /* A PNG that already has a transparent background reads (0,0,0,0) at the
       corners. Treating that as "the background is black" is what made this
       tool eat dark logos. If the corners are already clear there is nothing
       to remove, so leave the artwork alone. */
    const corners=[0,(w-1)*4,(h-1)*w*4,((h-1)*w+(w-1))*4];
    const opaque=corners.filter(i=>px[i+3]>200);
    if(!opaque.length)return cb(src,{already:true});

    const bg=[0,1,2].map(k=>Math.round(opaque.reduce((s,i)=>s+px[i+k],0)/opaque.length));
    const near=i=>{
      if(px[i+3]<24)return true;                  // already clear, keep flooding
      const dr=px[i]-bg[0],dg=px[i+1]-bg[1],db=px[i+2]-bg[2];
      return Math.sqrt(dr*dr+dg*dg+db*db)<=tol;
    };

    const seen=new Uint8Array(w*h),stack=[];
    for(let x=0;x<w;x++)stack.push(x,(h-1)*w+x);
    for(let y=0;y<h;y++)stack.push(y*w,y*w+w-1);
    let cleared=0;
    while(stack.length){
      const p=stack.pop();
      if(seen[p])continue;
      seen[p]=1;
      const i=p*4;
      if(!near(i))continue;
      if(px[i+3])cleared++;
      px[i+3]=0;
      const x=p%w,y=(p/w)|0;
      if(x>0)stack.push(p-1);
      if(x<w-1)stack.push(p+1);
      if(y>0)stack.push(p-w);
      if(y<h-1)stack.push(p+w);
    }

    /* If nearly everything went, the guess was wrong — hand back the original
       rather than a hole where a logo used to be. */
    if(cleared>w*h*0.94)return cb(src,{tooMuch:true});

    const out=new Uint8ClampedArray(px);
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
      const p=y*w+x,i=p*4;
      if(px[i+3]===0)continue;
      let clear=0;
      if(px[(p-1)*4+3]===0)clear++;
      if(px[(p+1)*4+3]===0)clear++;
      if(px[(p-w)*4+3]===0)clear++;
      if(px[(p+w)*4+3]===0)clear++;
      if(clear)out[i+3]=Math.round(px[i+3]*(1-clear*0.18));
    }
    cx.putImageData(new ImageData(out,w,h),0,0);
    cb(c.toDataURL("image/png"),{cleared:Math.round(cleared/(w*h)*100)});
  };
  img.onerror=()=>cb(src,{failed:true});
  img.src=src;
}

/* Scaled down before it's stored — a 4MB phone photo has no business being in
   a config object that gets written on every keystroke. */
window.__cut=on=>{
  if(!on){A.logoCut=false;A.logo=A.logoRaw||A.logo;A.logoNote="";return draw()}
  A.logoCut=true;
  removeBg(A.logoRaw||A.logo,A.logoTol,(d,info)=>{
    A.logo=d;
    A.logoNote=info.already?"This logo already has a transparent background — nothing to remove."
      :info.tooMuch?"That would have removed almost the whole image, so it was left alone. This works on a flat background behind the mark."
      :info.failed?"Couldn't read that image."
      :`Cleared ${info.cleared}% of the image.`;
    if(info.already||info.tooMuch)A.logoCut=false;
    draw();
  });
};
window.__tol=v=>{
  A.logoTol=parseInt(v)||60;
  removeBg(A.logoRaw||A.logo,A.logoTol,(d,info)=>{A.logo=d;
    A.logoNote=info.cleared!=null?`Cleared ${info.cleared}% of the image.`:(A.logoNote||"");
    const el=document.querySelector(".lp.on .lpimg img");if(el)el.src=d;
    const out=document.querySelector(".logotools .strange b");if(out)out.textContent=A.logoTol;});
};
function takeLogo(file){
  if(!/^image\//.test(file.type))return;
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    URL.revokeObjectURL(url);
    const max=320,s=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    const cx=c.getContext("2d");
    cx.imageSmoothingQuality="high";
    cx.drawImage(img,0,0,c.width,c.height);
    A.logoRaw=c.toDataURL("image/png");
    A.logo=A.logoRaw;
    A.logoCut=false;
    draw();
  };
  img.onerror=()=>URL.revokeObjectURL(url);
  img.src=url;
}

 {q:"What goes on the receipt?",s:"Printed at the bottom of every one. Most shops put their return policy here, because it's the only place a customer will ever read it.",

 /* The last question isn't written by me — it's written for this trade. A

 {q:"A few things about your trade",s:"These came from what you told me. They decide which parts of the register get built.",

      +(REC_MODS.length?`<div class="tradeq">

/* Says what the fleet did, in numbers, without pretending it's a rule. */
function fleetNote(kind){
  if(!FLEET||!FLEET.ready)return "";
  const n=FLEET.contributors;
  let body="";
  if(kind==="caps"&&FLEET.caps?.length){
    const labels=FLEET.caps.map(c=>(CAPS.find(x=>x[0]===c)||[,c])[1]);
    body=`Most ${esc(A.type.toLowerCase())}s turn on ${esc(labels.join(", "))}. Already ticked below —
      untick anything that isn't you.`;
  } else if(kind==="layout"&&FLEET.layout?.v){
    const L=LAYOUTS.find(x=>x.k===FLEET.layout.v);
    body=`${Math.round(FLEET.layout.share*100)}% of them run <b>${esc(L?L.n:FLEET.layout.v)}</b>.`;
  } else if(kind==="depts"&&FLEET.depts?.length){
    body=`They usually run ${esc(FLEET.depts.slice(0,6).map(d=>d.n).join(", "))}.`;
  }
  if(!body)return "";
  return `<div class="fleetnote">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4" stroke="currentColor" stroke-width="1.7"
      fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><b>From ${n} other ${esc(A.type.toLowerCase())}${n===1?"":"s"} already running</b>
      <span>${body}</span></div></div>`;
}

function chipList3(qi,opts,cur){
  window.__tq=(i,v,btn)=>{
    A.trade[i]=v;
    if(btn){const wrap=btn.parentElement;
      if(wrap)[...wrap.children].forEach(b=>b.classList.toggle("on",b===btn))}
    softUpdate();
  };
  return`<div class="chips" style="margin-top:10px">`+opts.map(o=>
    `<button class="chip ${cur===o?"on":""}" onclick="__tq(${qi},'${jsq(o)}',this)">
      <span class="tick">\u2713</span>${esc(o)}</button>`).join("")+`</div>`;
}
window.__modtog=(id,el)=>{
  const i=A.mods.indexOf(id);i<0?A.mods.push(id):A.mods.splice(i,1);
  const row=el&&el.closest(".modpick"); if(row)row.classList.toggle("on");
  softUpdate();
};

/* Each group gets its own handler. One shared global meant a second group on the
   same screen silently stole the first one's clicks. */
let CHIP_N=0;
const CHIP_CB={};
window.__chip=(id,v,btn)=>CHIP_CB[id]&&CHIP_CB[id](v,btn);
function chipList2(pairs,cur,cb){
  const id="c"+(++CHIP_N);
  CHIP_CB[id]=cb;
  return`<div class="chips" style="margin-top:12px">`+pairs.map(([k,l])=>
    `<button class="chip ${cur===k?"on":""}" onclick="__chip('${id}','${k}')"><span class="tick">\u2713</span>${l}</button>`).join("")+`</div>`;
}

function charmPreview(){
  const m=Math.min(94,Math.max(0,parseFloat(A.margin)||0))/100;
  const raw=m>=1?2:2/(1-m);
  return charm(raw,A.ending,A.dir);
}
function chipList(a,c,cb){
  const id="c"+(++CHIP_N);CHIP_CB[id]=cb;
  return`<div class="chips">`+a.map(v=>
    `<button class="chip ${c===v?"on":""}" onclick="__chip('${id}','${jsq(v)}')"><span class="tick">✓</span>${esc(v)}</button>`).join("")+`</div>`}
/* Multi-select updates the one chip that was clicked rather than re-rendering
   the step. Redrawing replayed every chip's entrance animation, so picking six
   things made the whole screen jump six times. */
function chipMulti(p,on,cb){
  const id="c"+(++CHIP_N);
  CHIP_CB[id]=(v,btn)=>{cb(v);if(btn)btn.classList.toggle("on");softUpdate()};
  return`<div class="chips">`+p.map(([k,l])=>
    `<button class="chip ${on.includes(k)?"on":""}" onclick="__chip('${id}','${k}',this)"><span class="tick">✓</span>${esc(l)}</button>`).join("")+`</div>`}

/* Everything a chip toggle needs to refresh, without touching the markup the
   user is looking at. */
function softUpdate(){
  const st=STEPS[STEP];
  const g=$("goBtn"); if(g)g.disabled=!st.ok();
  try{drawSide()}catch(e){}
}
function draw(){
  /* Repair anything an earlier version wrote into the wrong field. */
  if(!["x9","99","95","49-99","none"].includes(A.ending))A.ending="x9";
  if(!["margin","value"].includes(A.priceMode))A.priceMode="margin";
  const st=STEPS[STEP];
  $("setupBody").innerHTML=`
    <div class="steprail">${STEPS.map((s,i)=>
      `<span class="sd ${i<STEP?"done":i===STEP?"now":""}" title="${esc(s.q)}">${
        i<STEP?"\u2713":i+1}</span>`).join("")}</div>
    <div class="qhead">
      <div class="qnum">Question ${STEP+1} of ${STEPS.length}</div>
      <h1>${st.q}</h1>
      <p class="sub">${st.s}</p>
    </div>
    <div class="qbody">${st.render()}</div>
    <div class="nav">
      <button class="go" id="goBtn" ${st.ok()?"":"disabled"}>
        ${STEP===STEPS.length-1?"Build my terminal":"Continue"}
        <svg viewBox="0 0 16 16"><path d="M2 8h11M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      ${STEP>0?`<button class="back" id="backBtn">Back</button>`:""}
    </div>`;
  st.bind&&st.bind();
  $("goBtn").onclick=()=>{
    if(STEP===STEPS.length-1)return build();
    STEP++;
    /* The trade questions are written for this business, so they can't exist
       until the earlier answers do. */
    /* Asked as soon as we know the trade, so the answers are ready by the time
       the step is reached rather than the owner waiting on a spinner. */
    if(A.type&&!FLEET_ASKED)askFleet();
    if(A.desc.trim().length>=12&&!TRADE_ASKED){TRADE_ASKED=true;askTrade()}
    draw();
  };
  $("backBtn")&&($("backBtn").onclick=()=>{STEP--;draw()});
  /* Decoration last, and defensively — a broken preview must never take the
     buttons down with it. */
  try{drawSide()}catch(e){}
}

/* The right-hand panel assembles their terminal as they answer. It's the
   difference between filling in a form and watching something get built. */
function drawSide(){
  const el=$("setupSide"); if(!el)return;
  /* On the layout step the panel stops summarising and starts showing. Reading
     "compact keys, search leads" is not the same as seeing it. */
  const wide=STEPS[STEP]&&/register look|the colours/i.test(STEPS[STEP].q);
  const grid=document.querySelector(".setup-grid");
  if(grid)grid.classList.toggle("wide",!!wide);
  if(wide)return drawLayoutPreview(el);
  const filled=[
    A.type&&{k:"Business",v:A.typeOther||A.type},
    A.name&&{k:"Store",v:A.name},
    A.loc&&{k:"Where",v:A.loc},
    A.caps.length&&{k:"Modules",v:A.caps.length+" on"},
    A.priceMode==="value"?{k:"Pricing",v:"By value"}
      :(A.margin&&{k:"Margin",v:A.margin+"%"})
  ].filter(Boolean);

  el.innerHTML=`
    <div class="sidecard">
      <div class="sidetop">
        ${A.logo?`<img class="sidelogo" src="${A.logo}" alt="">`:`<span class="dot"></span>`}
        <b>${esc(A.name||"Your store")}</b>
        <em>Register 1</em>
      </div>
      <div class="sidebody">
        ${filled.length?filled.map((f,i)=>`<div class="sideline" style="animation-delay:${i*60}ms">
          <span>${esc(f.k)}</span><b>${esc(f.v)}</b></div>`).join("")
          :`<div class="sidewait">Answer on the left and this fills in.</div>`}
        ${A.caps.length?`<div class="sidechips">${A.caps.map(c=>{
          const l=(CAPS.find(x=>x[0]===c)||[,c])[1];
          return `<span>${esc(l)}</span>`}).join("")}</div>`:""}
        ${A.mods&&A.mods.length?`<div class="sidechips mods">${A.mods.map(m=>
          `<span>${esc((typeof MODULES!=="undefined"&&MODULES[m]?.n)||m)}</span>`).join("")}</div>`:""}
      </div>
      <div class="sidefoot">
        <span>Total</span>
        <b class="num">${A.priceMode==="value"?"\u2014":money(charmPreview())}</b>
      </div>
    </div>
    <div class="sidenote">Nothing here is fixed. Every part of it is editable once the
      terminal opens, and the wizard never has to be run twice.</div>`;
}

/* A working miniature of the register in the chosen arrangement. Same pieces as
   the real thing — receipt, department strip, key grid, function row — just
   small, so the difference between the five layouts is visible rather than
   described. */
function drawLayoutPreview(el){
  const L=LAYOUTS.find(x=>x.k===(A.layout||suggestLayout()))||LAYOUTS[0];
  const accent=A.accent||suggestAccent();
  const mode=A.mode||"dark";

    ? {bg:"#000",panel:"#0C0E0F",line:"#4E585C",txt:"#fff",dim:"#AEB6B9",key:"#1C2123",keyTxt:"#fff"}
    : {bg:"#1B2023",panel:"#242A2D",line:"#333B3E",txt:"#E6E9EA",dim:"#7C868A",key:"#394145",keyTxt:"#fff"};

  const D=sampleTrade();

  const key=(p,i)=>{
    const col=D.colors[i%D.colors.length];

      <span class="pkbar" style="background:${col}"></span>

    if(L.keyStyle==="pad")return`<div class="pk pad" style="background:${col};border-radius:${r+8}px;color:#fff">

      border-color:${S.line};border-radius:${r}px;color:${S.txt}">

      <span class="pkbody"><span class="pkn">${esc(p.n)}</span>
        ${p.o?`<span class="pko" style="color:${accent}">${esc(p.o)}</span>`:""}</span>
      <span class="pkfoot" style="border-color:${S.line}"><span class="pkp">${p.p}</span>
        <span class="pkadd" style="color:${accent};border-color:${accent}66">Add</span></span></div>`;
    return`<div class="pk tile" style="background:${col};border-radius:${r}px;color:#fff">
      <span class="pkn">${esc(p.n)}</span><span class="pkp">${p.p}</span></div>`;

  const tape=`<div class="ptape ${L.tapeStyle}" style="background:${
      L.tapeStyle==="receipt"?S.panel:S.bg};border-color:${S.line}">

      <span style="color:${S.dim}">Total</span>

    <div class="ptpay"><span style="background:${accent}22;border-color:${accent}66;color:${accent}">Cash</span>
      <span style="background:${S.key};border-color:${S.line};color:${S.dim}">Card</span></div>
  </div>`;

  const sections=`<div class="psec ${L.depts}" style="border-color:${S.line}">
    ${D.depts.map((d,i)=>`<span style="color:${i===0?S.txt:S.dim};

  </div>`;

  const board=`<div class="pboard">
    ${L.search?`<div class="psearch" style="background:${S.panel};border-color:${S.line};color:${S.dim}">
      Search the pricebook, or scan a barcode</div>`:""}
    ${L.depts==="rail"
      ? `<div class="prailrow">${sections}<div class="pkeys ${L.keyStyle}">${D.items.map(key).join("")}</div></div>`
      : sections+`<div class="pkeys ${L.keyStyle}">${D.items.map(key).join("")}</div>`}
    ${L.fkeys?`<div class="pfk" style="border-color:${S.line};color:${S.dim}">
      ${["Price check","Void","Discount","No sale","Suspend","Return"].map(f=>
        `<span style="border-color:${S.line}">${f}</span>`).join("")}</div>`:""}
  </div>`;

  el.innerHTML=`
    <div class="bigmock" style="background:${S.bg};border-color:${S.line}">

        </div>`:""}
      <div class="pbody ${L.tape} ${L.nav}">
        ${L.nav==="rail"?`<div class="pnav rail" style="background:${
          mode==="light"?"#E2E4DF":"#141A1C"};border-color:${S.line}">
          ${["Sale","Office","Reports","Config"].map((n,i)=>
            `<span style="color:${i===0?accent:S.dim};background:${i===0?accent+"1A":"transparent"}">${n}</span>`).join("")}

/* ========================= AI generation ========================= */
function parseLoose(raw){
  let s=raw.replace(/```json|```/g,"").trim();
  try{return JSON.parse(s)}catch(e){}
  const cut=Math.max(s.lastIndexOf("}"),s.lastIndexOf("]"));
  if(cut>-1)s=s.slice(0,cut+1);
  const st=[];let inStr=false,bs=false;
  for(const ch of s){
    if(inStr){if(bs)bs=false;else if(ch==="\\")bs=true;else if(ch==='"')inStr=false;continue}
    if(ch==='"')inStr=true;else if(ch==="{"||ch==="[")st.push(ch);else if(ch==="}"||ch==="]")st.pop();
  }
  if(inStr)s+='"';
  s=s.replace(/,\s*$/,"");
  while(st.length)s+=st.pop()==="{"?"}":"]";
  return JSON.parse(s);
}
/* Ask the model what a fitter would ask this particular trade, and which of the
   modules we actually have would earn their place. It picks from a fixed list —
   it cannot invent a feature, only recognise a need for one that exists. */
async function askTrade(){
  try{
    const r=await callAI(`You are setting up a point-of-sale system and want to ask the owner the two
or three questions that actually matter for THEIR trade — not a generic script.

${ctx()}
Sells: ${A.desc}

Available modules (you may only choose from these, by key):
${Object.entries(MODULES).map(([k,m])=>`  ${k} — ${m.n}: ${m.what}`).join("\n")}

Return ONLY valid JSON, no prose or fences:
{"questions":[{"q":string,"opts":[string],"why":string}],"modules":[string]}

- 4 or 5 questions, specific to this trade, that change how the register should be set up.
  A café gets asked whether drinks come in sizes, whether milk alternatives cost extra, whether
  they keep recipes and yields, whether there's a pastry case that gets marked down late, and
  whether staff share tips. A convenience store gets asked about age-restricted lines, whether
  they run lottery, whether the cooler gets date-checked, and whether they take EBT. A butcher
  gets asked who breaks down the primals, whether cuts are logged, whether they sell by weight,
  and how long trays stay out. Ask what a fitter who knew this trade would ask. Never ask
  something already answered above.
- "opts": 2 to 4 short answers. Keep them concrete.
- "why": one short line on what the answer changes in the register. Plain language, no jargon.
  Name the actual consequence — "turns on a size prompt when these are rung", not "improves setup".
- "modules": the keys worth switching on for this business, with the reason tied to what they
  actually sell. Empty array if none fit. Do not invent keys.`,
      {max_tokens:1400,kind:"trade-questions"});
    TRADE_Q=(r.questions||[]).slice(0,3).filter(q=>q&&q.q);
    REC_MODS=(r.modules||[]).filter(k=>MODULES[k]);
    A.mods=[...REC_MODS];
  }catch(e){
    /* No questions is better than made-up questions. */
    TRADE_Q=[];REC_MODS=Object.keys(MODULES).filter(k=>MODULES[k].fits.test(A.type+" "+A.desc));
    A.mods=[...REC_MODS];
  }
  if(STEP===STEPS.length-1)draw();
}

function ctx(){return`Business type: ${A.type}${A.typeOther?` (${A.typeOther})`:""}
Store name: ${A.name}
Owner's description: ${A.desc}
Modules enabled: ${A.caps.length?A.caps.join(", "):"none"}${
  TRADE_Q.length?"\n"+TRADE_Q.map((q,i)=>`${q.q} ${A.trade[i]||"—"}`).join("\n"):""}`}
function itemRules(){
  const r=["Real, specific product names and realistic US retail prices. No placeholders.",
    `"upc": a unique plausible 12-digit UPC string per item.`];
  r.push(A.caps.includes("age")?`"age": 21 for tobacco/vape/alcohol, 18 where correct, else null.`:`"age": always null.`);
  r.push(A.caps.includes("weight")?`"wt": true only for items truly sold per pound, "p" being the price per pound.`:`"wt": always null.`);
  r.push(A.caps.includes("ebt")?`"ebt": true on SNAP-eligible grocery staples.`:`"ebt": always null.`);
  r.push(A.caps.includes("deposit")?`"dep": bottle deposit in dollars like 0.05 on canned or bottled drinks.`:`"dep": always null.`);
  return r.map(x=>"- "+x).join("\n");
}

async function fillWithExamples(gen,depts){
  const lines=depts.map(d=>({t:"Pricing "+d.n,s:1}));
  lines.push({t:"Building deals",s:1});
  const paint=()=>$("buildBody").innerHTML=`<h2>Building example products</h2>`
    +lines.map(l=>`<div class="tick-line ${l.s===2?"done":""}"><b>${l.s===2?"✓":l.s===3?"!":"·"}</b><span>${esc(l.t)}</span></div>`).join("")
    +`<div class="hint">These are illustrations at made-up prices, not your pricebook. They're marked
      as examples and can be cleared in one action from Config → Pricebook.</div>`;
  paint();

  const res=await Promise.all(depts.map(async(d,i)=>{
    try{
      const r=await callAI(`Write example products for one department of a point-of-sale pricebook.
These are illustrative, so the owner can see the register working before loading their real pricebook.

Return ONLY valid JSON, no prose or fences:
{"items":[{"n":string,"p":number,"upc":string,"age":number|null,"wt":boolean|null,"ebt":boolean|null,"dep":number|null}]}

${ctx()}
Department: ${d.n}

Rules:
- Exactly 5 items that genuinely belong in this department at this business.
${itemRules()}`);
      lines[i].s=2;paint();
      return Array.isArray(r.items)?r.items.filter(x=>x&&x.n):[];
    }catch(e){
      lines[i].s=3;lines[i].t=d.n+" — skipped";paint();
      return [];
    }
  }));

  gen.depts=depts.map((d,i)=>({n:d.n,food:!!d.food,items:res[i]})).filter(d=>d.items.length);
  if(!gen.depts.length){
    CFG=compile(gen);
    if(typeof saveNow==="function")saveNow();
    return openStudio();
  }

  const upcs=gen.depts.flatMap(d=>d.items.map(i=>i.upc)).filter(Boolean);
  try{
    const p=await callAI(`Example products at ${A.name} (${A.type}), as "name | upc | price":
${gen.depts.flatMap(d=>d.items.map(i=>`${i.n} | ${i.upc} | ${i.p}`)).join("\n")}

Return ONLY valid JSON, no prose or fences:
{"promos":[{"n":string,"upcs":string[],"qty":number,"price":number}]}

Write 1 or 2 realistic mix-and-match deals a store like this would run. Only reference upcs above.
Return an empty array if none fit.`);
    gen.promos=(p.promos||[]).filter(x=>x&&Array.isArray(x.upcs)&&x.upcs.some(u=>upcs.includes(u)));
    lines[lines.length-1].s=2;
  }catch(e){lines[lines.length-1].s=3;lines[lines.length-1].t="Deals skipped"}
  paint();

  CFG=compile(gen);
  /* Marked so they can be found and removed as a set later. */
  CFG.plus.forEach(p=>p.starter=true);
  if(typeof saveNow==="function")saveNow();
  setTimeout(openStudio,340);
}

/* ========================= compile ========================= */
function compile(gen){
  /* One rate per category the state actually distinguishes, not a hardcoded
     standard-and-food pair. In Illinois that means candy and soft drinks sit at
     the general rate even though they look like groceries. */
  const taxRates=[];const keyToId={};
  if(TAXINFO&&Array.isArray(TAXINFO.categories)&&TAXINFO.categories.length){
    TAXINFO.categories.forEach((c,i)=>{
      const id="TX"+(i+1);keyToId[c.key]=id;
      taxRates.push({id,n:c.n||c.key,rate:+(+c.rate||0).toFixed(3),what:c.what||null,
        why:c.why||null,carveOut:!!c.carveOut,examples:c.examples||[],notIn:c.notIn||[],
        parts:(i===0?TAXINFO.breakdown:null)||null,src:(i===0?TAXINFO.note:null)||null});
    });
  } else {
    taxRates.push({id:"TX1",n:"General merchandise",rate:0,src:"Set this under Site & tax."});
    keyToId.general="TX1";
  }
  if(!taxRates.some(r=>r.rate===0)){taxRates.push({id:"TX0",n:"Non-taxable",rate:0});keyToId.exempt="TX0"}
  else keyToId.exempt=keyToId.exempt||taxRates.find(r=>r.rate===0).id;
  const generalId=keyToId.general||taxRates[0].id;
  const deptTax=(TAXINFO&&TAXINFO.deptTax)||{};
  const taxFor=name=>keyToId[deptTax[name]]||generalId;
  const restricts=[];
  const c={site:{name:A.name||"Your Store",tagline:gen.tagline||"",addr:gen.addr||"",
      store:"001",register:"1",loc:A.loc,logo:A.logo||"",slogan:A.slogan||""},
    caps:[...A.caps],rounding:{nickel:false},bizType:A.type,
    layout:A.layout||suggestLayout(),
    theme:{mode:A.mode||"dark",accent:A.accent||suggestAccent()},
    receipt:{footer:A.footer||"",policy:A.policy||""},
    openingCash:parseFloat(A.startCash)||200,
    tax:TAXINFO?{place:TAXINFO.place,state:TAXINFO.state,sources:TAXINFO.sources||[],
      verifyUrl:TAXINFO.verifyUrl||"",conflict:TAXINFO.conflict||null,sumNote:TAXINFO.sumNote||null,
      recent:TAXINFO.recent||null,confirmed:false,searched:true}:{confirmed:false},
    pricing:{margin:parseFloat(A.margin)||35,ending:A.ending,dir:A.dir,
      mode:A.priceMode||"margin"},
    modules:Object.fromEntries((A.mods||[]).map(k=>[k,{on:true,cfg:{}}])),
    trade:TRADE_Q.map((q,i)=>({q:q.q,a:A.trade[i]||null})),
    taxRates,depts:[],plus:[],menus:[],mops:[],restricts,promos:[],
    groups:[],employees:[],reasons:[],modGroups:[],reminders:[]};

  gen.depts.forEach((d,i)=>{
    const dept={id:"D"+(i+1),n:d.n,taxId:taxFor(d.n),food:!!d.food,color:PALETTE[i%PALETTE.length]};
    c.depts.push(dept);
    (d.items||[]).forEach(it=>{
      let rid=null;
      if(it.age&&A.caps.includes("age")){
        let r=restricts.find(x=>x.minAge===it.age&&!x.start);
        if(!r){r={id:"R"+(restricts.length+1),n:it.age+"+ age check",minAge:it.age,idScan:true,start:"",end:""};restricts.push(r)}
        rid=r.id;
      }
      c.plus.push({id:"P"+uid(),upc:it.upc||"",n:it.n,price:+it.p||0,deptId:dept.id,
        weighed:!!(it.wt&&A.caps.includes("weight")),ebt:!!(it.ebt&&A.caps.includes("ebt")),
        deposit:(A.caps.includes("deposit")&&it.dep)?+it.dep:null,restrictId:rid,modIds:[],cost:null});
    });
  });

  // Modifier groups — Toast/Square shape: a group is required or optional,
  // single or multi select, and each option can carry its own price delta.
  if(A.caps.includes("foodservice")){
    c.modGroups=[
      {id:"MG1",n:"Size",required:true,multi:false,opts:[{n:"Small",p:0},{n:"Medium",p:.5},{n:"Large",p:1}]},
      {id:"MG2",n:"Add-ons",required:false,multi:true,opts:[{n:"Extra cheese",p:.75},{n:"Bacon",p:1.25},
        {n:"Jalapeños",p:.35},{n:"Extra sauce",p:0}]},
      {id:"MG3",n:"Prepared",required:false,multi:true,opts:[{n:"To go",p:0},{n:"Heated",p:0},{n:"Cut in half",p:0}]}];
    const hot=/coffee|food|deli|grill|kitchen|bakery|caf|pizza|sandwich|hot|breakfast|snack bar/i;
    c.depts.filter(d=>hot.test(d.n)).forEach(d=>
      c.plus.filter(p=>p.deptId===d.id).forEach(p=>p.modIds=["MG1","MG2","MG3"]));
  }

  c.menus=c.depts.map(d=>({id:"M"+d.id,n:d.n,color:d.color,
    keys:c.plus.filter(p=>p.deptId===d.id).map(p=>({pluId:p.id}))}));

  if(A.caps.includes("fuel")){
    const fd={id:"DF",n:"Fuel",taxId:keyToId.exempt,food:false,fuel:true,color:"#2C3A3E"};
    c.depts.unshift(fd);
    c.menus.unshift({id:"MDF",n:"Fuel",color:fd.color,fuel:true,keys:[1,2,3,4,5,6,7,8].map(i=>({pump:i,label:"Pump "+i}))});
  }

  c.mops=[{id:"MOP1",n:"Cash",kind:"cash",drawer:true,change:true,rounds:true},
    {id:"MOP2",n:"Credit",kind:"card",drawer:false,change:false},
    {id:"MOP3",n:"Debit",kind:"card",drawer:false,change:false}];
  if(A.caps.includes("ebt"))c.mops.push({id:"MOP4",n:"EBT",kind:"ebt",drawer:false,change:false,ebtOnly:true});

  if(A.caps.includes("age")&&/liquor|beer|wine|alcohol/i.test(A.desc+" "+A.type))
    restricts.push({id:"RT",n:"No alcohol 2–7am",minAge:21,idScan:true,start:"02:00",end:"07:00"});

  (gen.promos||[]).forEach((p,i)=>{
    const ids=(p.upcs||[]).map(u=>c.plus.find(x=>x.upc===u)?.id).filter(Boolean);
    if(ids.length)c.promos.push({id:"PR"+(i+1),n:p.n,kind:"mixmatch",pluIds:ids,qty:+p.qty||2,price:+p.price||0,on:true});
  });

  // Security groups — Passport's model: permissions attach to a group, not a person.
  c.groups=[
    {id:"G1",n:"Cashier",perms:["nosale"]},
    {id:"G2",n:"Shift lead",perms:["nosale","void","discount","refund","reports"]},
    {id:"G3",n:"Manager",perms:PERMS.map(p=>p[0])}];
  const roleGroup={Manager:"G3","Shift lead":"G2",Cashier:"G1"};
  c.employees=(A.staff&&A.staff.length?A.staff:[{n:"Manager",role:"Manager",pin:"1234"}])
    .map((s,i)=>({id:"E"+(i+1),n:s.n.trim()||("Person "+(i+1)),pin:s.pin||String(1111*(i+1)).slice(0,4),
      groupId:roleGroup[s.role]||"G1"}));

  // Reason codes on exceptions — the anti-shrink control.
  c.reasons=[
    {id:"RC1",n:"Customer changed mind",type:"void"},{id:"RC2",n:"Rang in error",type:"void"},
    {id:"RC3",n:"Item damaged",type:"void"},{id:"RC4",n:"Wrong price",type:"void"},
    {id:"RC5",n:"Defective product",type:"refund"},{id:"RC6",n:"Not as expected",type:"refund"},
    {id:"RC7",n:"Vendor payment",type:"payout"},{id:"RC8",n:"Supplies",type:"payout"},
    {id:"RC9",n:"Make change",type:"nosale"},{id:"RC10",n:"Drawer check",type:"nosale"}];

  c.reminders=[
    {id:"T1",n:"Brew fresh coffee",at:"06:00",done:false},{id:"T2",n:"Check cooler temperatures",at:"09:00",done:false},
    {id:"T3",n:"Clean restrooms",at:"12:00",done:false},{id:"T4",n:"Count cigarette inventory",at:"16:00",done:false},
    {id:"T5",n:"Take out trash",at:"21:00",done:false}];
  return c;
}

/* ========================= session & permissions ========================= */
function can(perm){const g=byId(CFG.groups,ME?.groupId);return !!g&&g.perms.includes(perm)}
/* If the signed-in cashier lacks the permission, a manager keys in over them.
   The override is logged against the shift, not silently swallowed. */
function auth(perm,label,cb){
  if(can(perm))return cb(ME);
  pinPrompt(`Manager approval needed`,`${label} is outside ${esc(ME.n)}'s permissions. A manager can approve it.`,
    emp=>{const g=byId(CFG.groups,emp.groupId);
      if(!g.perms.includes(perm))return toast(`${emp.n} can't approve that either.`,true);
      SHIFT.exceptions.push({at:new Date(),by:emp.n,on:ME.n,what:label});
      cb(emp);});
}
function pinPrompt(title,body,ok){
  let pin="";
  const el=veil(`<div class="card" style="max-width:320px"><h3>${title}</h3><p>${body}</p>
    <div class="pindots" id="apd">${[0,1,2,3].map(()=>`<i></i>`).join("")}</div>
    <div class="lockpad">${[1,2,3,4,5,6,7,8,9,"",0,"←"].map(k=>
      k===""?`<span></span>`:`<button data-k="${k}">${k}</button>`).join("")}</div>
    <div class="row"><button class="no" id="an">Cancel</button></div></div>`);
  const dots=()=>el.querySelectorAll("#apd i").forEach((d,i)=>d.classList.toggle("f",i<pin.length));
  el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==="←")pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;
    dots();
    if(pin.length===4){
      const emp=CFG.employees.find(e=>e.pin===pin);
      if(emp){el.remove();ok(emp)}
      else{el.querySelector("#apd").classList.add("bad");
        setTimeout(()=>{pin="";dots();el.querySelector("#apd").classList.remove("bad")},420)}
    }});
  el.querySelector("#an").onclick=()=>el.remove();
}
function reasonPrompt(type,title,cb){

  if(!list.length)return cb(null);

    <div class="opts" style="flex-direction:column">${list.map(r=>
      `<button data-r="${r.id}" style="width:100%">${esc(r.n)}</button>`).join("")}</div>
    <div class="row"><button class="no" id="rn">Cancel</button></div></div>`);
  el.querySelector("#rn").onclick=()=>el.remove();
