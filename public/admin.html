<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet — AI POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#111417;--panel:#191D21;--panel2:#1F242A;--line:#2A3037;--line2:#3A424B;
  --txt:#E6E9EA;--txt2:#9BA5AE;--txt3:#6C767F;--ok:#5CE0A8;--warn:#E0B255;--bad:#D2664C;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Archivo,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14px}
.num{font-family:"Azeret Mono",monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;text-align:left}
a{color:var(--ok)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#3A424B;border-radius:9px}

.top{display:flex;align-items:center;gap:14px;padding:15px 26px;border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;z-index:5}
.top b{font-size:16px;font-weight:600}
.top .who{margin-left:auto;font-size:12.5px;color:var(--txt2)}
.top a{font-size:12.5px;padding:8px 14px;border:1px solid var(--line2);border-radius:99px;
  text-decoration:none;color:var(--txt2)}
.wrap{max-width:1320px;margin:0 auto;padding:26px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.tile span{display:block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--txt3)}
.tile b{display:block;font-size:31px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.tile em{font-style:normal;font-size:12px;color:var(--txt2)}

h2{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt3);
  margin:34px 0 12px;font-weight:500}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--txt3);font-size:11.5px;padding:11px 14px;
  border-bottom:1px solid var(--line);letter-spacing:.05em}
td{padding:11px 14px;border-bottom:1px solid #232930;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;
  border:1px solid var(--line2);color:var(--txt2)}
.pill.ok{border-color:rgba(92,224,168,.5);color:var(--ok)}
.pill.warn{border-color:rgba(224,178,85,.5);color:var(--warn)}
.pill.bad{border-color:rgba(210,102,76,.5);color:var(--bad)}
.mods{display:flex;gap:4px;flex-wrap:wrap}
.mods span{font-size:10.5px;padding:2px 7px;border-radius:4px;background:#252B32;color:var(--txt2)}
.act{font-size:12px;padding:7px 13px;border:1px solid var(--line2);border-radius:99px;color:var(--txt2)}
.act:hover{border-color:var(--ok);color:var(--ok)}
.act.on{border-color:var(--ok);color:var(--ok);background:rgba(92,224,168,.1)}
.empty{padding:26px;text-align:center;color:var(--txt3);font-size:13px}
.spark{display:flex;align-items:flex-end;gap:2px;height:44px;margin-top:10px}
.spark i{flex:1;background:var(--ok);opacity:.55;border-radius:1px;min-height:2px;display:block}
.note{font-size:12.5px;color:var(--txt3);line-height:1.6;margin-top:11px}
.veil{position:fixed;inset:0;background:rgba(8,10,12,.78);display:flex;align-items:center;
  justify-content:center;padding:22px;z-index:30;overflow-y:auto}
.modal{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:22px;
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto}
.modal h3{font-size:18px;font-weight:600;margin-bottom:6px}
.modal p{font-size:13px;color:var(--txt2);line-height:1.6}
.modal input,.modal select{width:100%;background:var(--bg);border:1px solid var(--line2);
  color:var(--txt);padding:11px 13px;border-radius:6px;font:inherit;margin-top:12px}
.row{display:flex;gap:9px;margin-top:16px}
.row button{flex:1;padding:12px;border-radius:6px;font-size:14px;font-weight:500;text-align:center}
.go{background:var(--ok);color:#0E241C}
.no{background:#262C33;border:1px solid var(--line2)}
.err{margin-top:11px;font-size:13px;color:#F2BCAC}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.toolbar input{background:var(--panel);border:1px solid var(--line2);color:var(--txt);
  padding:9px 13px;border-radius:99px;font:inherit;font-size:13px;min-width:220px}
.toolbar input:focus{outline:none;border-color:var(--ok)}
.act.danger{border-color:rgba(210,102,76,.5);color:var(--bad)}
.act.danger:hover{background:rgba(210,102,76,.12)}
.act[disabled]{opacity:.35;cursor:not-allowed}
.selcount{font-size:12.5px;color:var(--txt2);margin-left:auto}
.sub{font-size:11.5px;color:var(--txt3);margin-top:2px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ok);cursor:pointer}
.warnbox{margin-top:14px;padding:12px 15px;border-radius:6px;font-size:13px;line-height:1.6;
  border:1px solid rgba(224,178,85,.45);background:rgba(224,178,85,.09);color:#F0D9A6}
.aitop{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;
  background:var(--line);border-bottom:1px solid var(--line)}
.aitop div{background:var(--panel);padding:14px 16px}
.aitop span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--txt3)}
.aitop b{display:block;font-size:22px;font-weight:600;margin-top:4px}
</style>
</head>
<body>

<div class="top">
  <b>Fleet</b>
  <span class="pill">operator</span>
  <span class="who" id="who"></span>
  <a href="/app.html">Back to the register</a>
</div>

<div class="wrap" id="body">
  <p style="color:var(--txt3)">Loading…</p>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = n => (Math.round(n * 100) / 100).toFixed(2);

async function api(path, opts = {}) {
  const r = await fetch(path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}

const ago = s => {
  if (!s) return "never";
  const d = new Date(s.replace(" ", "T") + (s.endsWith("Z") ? "" : "Z"));
  const mins = Math.round((Date.now() - d) / 60000);
  if (mins < 60) return mins + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  return Math.round(mins / 1440) + "d ago";
};

let F = null;

async function load() {
  try { F = await api("/api/admin/fleet"); }
  catch (e) {
    $("body").innerHTML = `<div class="card"><div class="empty">
      ${e.message.includes("Not found")
        ? "This account isn't an operator. Nothing to see here."
        : esc(e.message)}</div></div>`;
    return;
  }
  draw();
}

function draw() {
  const t = F.totals;
  const byAccount = {};
  F.stores.forEach(s => (byAccount[s.account_id] = byAccount[s.account_id] || []).push(s));
  const shape = {};
  F.shape.forEach(s => shape[s.id] = s);

  const days = F.trend.sales;
  const peak = Math.max(1, ...days.map(d => d.n));

  const liveGrants = F.grants.filter(g => !g.closed_at && new Date(g.expires_at + "Z") > new Date());

  $("body").innerHTML = `
    <div class="tiles">
      <div class="tile"><span>Accounts</span><b>${t.accounts}</b></div>
      <div class="tile"><span>Stores</span><b>${t.stores}</b>
        <em>${F.stores.filter(s => s.configured).length} set up</em></div>
      <div class="tile"><span>Sales all time</span><b>${t.sales.toLocaleString()}</b></div>
      <div class="tile"><span>Last 24 hours</span><b>${t.sales_24h}</b></div>
      <div class="tile"><span>Last 7 days</span><b>${t.sales_7d}</b></div>
    </div>

    <h2>Sales a day</h2>
    <div class="card" style="padding:16px 18px">
      <div class="spark">${days.map(d =>
        `<i style="height:${Math.round(d.n / peak * 100)}%" title="${esc(d.d)} — ${d.n}"></i>`).join("")
        || `<span style="color:var(--txt3);font-size:13px">Nothing yet</span>`}</div>
      <div class="note">${days.length} day${days.length === 1 ? "" : "s"} of activity.
        Busiest was ${peak} in a day.</div>
    </div>

    ${liveGrants.length ? `
      <h2>Support access open right now</h2>
      <div class="card"><table><tbody>
        ${liveGrants.map(g => `<tr>
          <td><b>${esc(g.email)}</b></td>
          <td style="color:var(--txt2)">${esc(g.reason)}</td>
          <td style="color:var(--txt3)">expires ${ago(g.expires_at).replace(" ago", " from now")}</td>
          <td style="text-align:right"><button class="act" onclick="closeS(${g.account_id})">Close it</button></td>
        </tr>`).join("")}
      </tbody></table></div>` : ""}

    <h2>Accounts — ${F.accounts.length}</h2>
    <div class="toolbar">
      <input id="acctQ" placeholder="Filter by email" oninput="filterAccounts(this.value)">
      <button class="act" onclick="selectAll(true)">Select all</button>
      <button class="act" onclick="selectAll(false)">Clear</button>
      <span class="selcount" id="selCount"></span>
      <button class="act danger" id="delBtn" onclick="askDelete()" disabled>Delete selected</button>
    </div>
    <div class="card"><table>
      <thead><tr><th style="width:34px"></th><th>Account</th><th>Stores</th><th>Trade</th>
        <th>Modules</th><th>Sales · 7d</th><th>Last sale</th><th></th></tr></thead>
      <tbody id="acctRows">
        ${F.accounts.map(acc => {
          const st = byAccount[acc.id] || [];
          const first = st.map(s => shape[s.id]).find(Boolean);
          const s7 = st.reduce((n, s) => n + s.sales_7d, 0);
          const last = st.map(s => s.last_sale).filter(Boolean).sort().pop();
          const totalSales = st.reduce((n, s) => n + s.sales, 0);
          return `<tr data-email="${esc(acc.email.toLowerCase())}">
            <td>${acc.is_operator ? `<span class="pill ok" title="operators can't be deleted">op</span>`
              : `<input type="checkbox" class="asel" value="${acc.id}" onchange="selChanged()">`}</td>
            <td><b>${esc(acc.email)}</b>
              <div class="sub">joined ${esc(String(acc.created_at).slice(0, 10))} ·
                ${totalSales} sale${totalSales === 1 ? "" : "s"} all time</div></td>
            <td>${st.length}</td>
            <td style="color:var(--txt2)">${esc(first?.trade || "—")}</td>
            <td><div class="mods">${(first?.modules || []).slice(0, 4)
              .map(m => `<span>${esc(m)}</span>`).join("") || `<span class="sub">—</span>`}</div></td>
            <td class="num">${s7}</td>
            <td style="color:var(--txt2)">${ago(last)}</td>
            <td style="text-align:right;white-space:nowrap">
              <button class="act" onclick="openS(${acc.id},'${esc(acc.email)}')">Support…</button>
              <button class="act" onclick="toggleOp(${acc.id}, ${acc.is_operator ? "false" : "true"})">
                ${acc.is_operator ? "Revoke op" : "Make op"}</button></td>
          </tr>`;
        }).join("")}
      </tbody></table></div>

    <h2>Stores</h2>
    <div class="card"><table>
      <thead><tr><th>Store</th><th>Register</th><th>Products</th><th>Staff</th>
        <th>Sales</th><th>Last sale</th><th>State</th></tr></thead>
      <tbody>
        ${F.stores.map(s => {
          const sh = shape[s.id] || {};
          return `<tr>
            <td><b>${esc(s.name)}</b>
              <div style="font-size:11.5px;color:var(--txt3);margin-top:2px">#${s.id}</div></td>
            <td style="color:var(--txt2)">${esc(sh.layout || "—")}</td>
            <td class="num">${sh.products ?? 0}</td>
            <td class="num">${sh.staff ?? 0}</td>
            <td class="num">${s.sales}</td>
            <td style="color:var(--txt2)">${ago(s.last_sale)}</td>
            <td>${s.configured
              ? (s.sales_7d > 0 ? `<span class="pill ok">live</span>`
                 : `<span class="pill warn">quiet</span>`)
              : `<span class="pill">setting up</span>`}</td>
          </tr>`;
        }).join("") || `<tr><td colspan="7" class="empty">No stores yet.</td></tr>`}
      </tbody></table></div>

    ${section("Never finished setup", F.attention.neverConfigured,
      r => `<td><b>${esc(r.name)}</b></td><td style="color:var(--txt2)">${esc(r.email)}</td>
            <td style="color:var(--txt3)">created ${ago(r.created_at)}</td>`)}

    ${section("Went quiet", F.attention.wentQuiet,
      r => `<td><b>${esc(r.name)}</b></td><td style="color:var(--txt2)">${esc(r.email)}</td>
            <td style="color:var(--txt3)">last sale ${ago(r.last_sale)}</td>`)}

    ${section("Shifts left open", F.attention.openShifts,
      r => `<td><b>${esc(r.name)}</b></td><td style="color:var(--txt2)">${esc(r.email)}</td>
            <td style="color:var(--txt3)">open since ${ago(r.opened_at)}</td>`)}

    <h2>Database</h2>
    <div class="card" id="schemaBox"><div class="empty">Loading…</div></div>

    <h2>Registers</h2>
    <div class="card" id="healthBox"><div class="empty">Loading…</div></div>

    <h2>Model usage — last 30 days</h2>
    <div class="card" id="aiBox"><div class="empty">Loading…</div></div>

    <h2>Storage</h2>
    <div class="card" id="storeBox"><div class="empty">Loading…</div></div>

    <h2>Email</h2>
    <div class="card" style="padding:16px 18px" id="mailBox">
      <span style="color:var(--txt3)">Checking…</span>
    </div>

    <div class="note" style="margin-top:34px;max-width:74ch">
      Everything above is shape and health — how many, how often, which modules. No product names,
      no customers, no receipt contents. Reading a tenant's actual data needs support access, which
      expires on its own and is written into their activity log where they can see it.
    </div>`;
  drawMail();
  drawSchema();
  drawHealth();
  drawAI();
  drawStorage();
  selChanged();
}

/* Proving mail works before somebody locked out needs it to. */
async function drawMail() {
  const box = document.getElementById("mailBox");
  if (!box) return;
  let m;
  try { m = await api("/api/admin/mail"); } catch (e) { return; }
  box.innerHTML = m.configured
    ? `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <span class="pill ok">ready</span>
        <span style="color:var(--txt2)">Sending through <b>${esc(m.provider)}</b>.</span>
        <button class="act" style="margin-left:auto" onclick="testMail()">Send me a test</button>
      </div><div id="mailResult"></div>`
    : `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <span class="pill warn">not sending</span>
        <span style="color:var(--txt2)">${esc(m.reason || "")}</span>
      </div>
      <div class="note">Reset links are written to the server log instead, so nobody is ever
        locked out. Set <b>MAIL_PROVIDER</b>, <b>MAIL_KEY</b> and <b>MAIL_FROM</b> to send them
        properly.</div>`;
}

async function testMail() {
  const out = document.getElementById("mailResult");
  out.innerHTML = `<div class="note">Sending…</div>`;
  try {
    const r = await api("/api/admin/mail-test", { method: "POST", body: {} });
    out.innerHTML = r.ok
      ? `<div class="note" style="color:var(--ok)">Sent to ${esc(r.to)} via
         ${esc(r.provider)}. If it doesn't arrive, check the spam folder and that the
         sending domain is verified with your provider.</div>`
      : `<div class="note" style="color:var(--bad)">${esc(r.reason)}</div>`;
  } catch (e) {
    out.innerHTML = `<div class="note" style="color:var(--bad)">${esc(e.message)}</div>`;
  }
}

const section = (title, rows, cells) => !rows.length ? "" : `
  <h2>${title} — ${rows.length}</h2>
  <div class="card"><table><tbody>
    ${rows.map(r => `<tr>${cells(r)}</tr>`).join("")}
  </tbody></table></div>`;

/* ------------------------------ selection ------------------------------- */
const selected = () => [...document.querySelectorAll(".asel:checked")].map(c => +c.value);

function selChanged() {
  const n = selected().length;
  const b = document.getElementById("delBtn");
  const c = document.getElementById("selCount");
  if (b) b.disabled = !n;
  if (c) c.textContent = n ? `${n} selected` : "";
}

function selectAll(on) {
  document.querySelectorAll("#acctRows tr").forEach(tr => {
    if (tr.style.display === "none") return;          // never select what's filtered out
    const c = tr.querySelector(".asel");
    if (c) c.checked = on;
  });
  selChanged();
}

function filterAccounts(q) {
  const t = q.trim().toLowerCase();
  document.querySelectorAll("#acctRows tr").forEach(tr => {
    tr.style.display = !t || (tr.dataset.email || "").includes(t) ? "" : "none";
  });
}

/* Deleting shows what would actually go first, then asks for the word to be
   typed. There is no undo behind this. */
async function askDelete() {
  const ids = selected();
  if (!ids.length) return;
  let list = [];
  try { const r = await api("/api/admin/accounts/preview", { method: "POST", body: { ids } });
    list = r.accounts; } catch (e) { return alert(e.message); }

  const totalStores = list.reduce((n, a) => n + (a.stores || 0), 0);
  const totalSales = list.reduce((n, a) => n + (a.sales || 0), 0);
  const withData = list.filter(a => a.sales > 0);

  const el = veil(`<div class="modal">
    <h3>Delete ${list.length} account${list.length === 1 ? "" : "s"}?</h3>
    <p>This removes the accounts, their stores, pricebooks, shifts, sales and audit trails.
      It cannot be undone.</p>
    <div class="card" style="margin-top:14px"><table><tbody>
      ${list.map(a => `<tr>
        <td><b>${esc(a.email || "#" + a.id)}</b></td>
        <td style="color:var(--txt2)">${a.stores} store${a.stores === 1 ? "" : "s"}</td>
        <td style="color:${a.sales ? "var(--warn)" : "var(--txt3)"}">${a.sales} sale${
          a.sales === 1 ? "" : "s"}</td>
        <td class="num" style="text-align:right">${a.taken ? money(a.taken) : ""}</td>
      </tr>`).join("")}
    </tbody></table></div>
    ${withData.length ? `<div class="warnbox">${withData.length} of these ${
      withData.length === 1 ? "has" : "have"} real sales against ${totalStores} store${
      totalStores === 1 ? "" : "s"} — ${totalSales} transaction${totalSales === 1 ? "" : "s"} in
      total. If any of these are live businesses rather than tests, stop here.</div>` : ""}
    <input id="delWord" placeholder='Type delete to confirm' autocomplete="off">
    <div class="err" id="delErr" style="display:none"></div>
    <div class="row"><button class="no" id="dx">Keep them</button>
      <button class="go" id="dy" style="background:var(--bad);color:#fff">Delete permanently</button>
    </div></div>`);

  el.querySelector("#dx").onclick = () => el.remove();
  el.querySelector("#dy").onclick = async () => {
    const err = el.querySelector("#delErr");
    try {
      const r = await api("/api/admin/accounts/delete", { method: "POST",
        body: { ids, confirm: el.querySelector("#delWord").value } });
      el.remove();
      if (r.skipped && r.skipped.length)
        alert("Kept " + r.skipped.length + ": " + r.skipped.map(s => s.why).join("; "));
      load();
    } catch (e) { err.textContent = e.message; err.style.display = "block"; }
  };
  setTimeout(() => el.querySelector("#delWord").focus(), 40);
}

async function toggleOp(id, on) {
  if (!confirm(on ? "Give this account operator access?" : "Remove operator access?")) return;
  try { await api("/api/admin/operator", { method: "POST", body: { account: id, on } }); load(); }
  catch (e) { alert(e.message); }
}

/* -------------------------------- the schema -----------------------------
   Worth a panel because a missing table is silent until somebody opens the
   screen that needs it, and then it's a 500 with no explanation. */
async function drawSchema() {
  const box = document.getElementById("schemaBox");
  if (!box) return;
  let d;
  try { d = await api("/api/admin/schema"); }
  catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  const busiest = Object.entries(d.counts || {})
    .filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 8);

  box.innerHTML = `
    <div class="aitop">
      <div><span>Schema version</span><b>${d.version}</b></div>
      <div><span>Tables verified</span><b style="${d.ok ? "color:var(--ok)" : "color:var(--bad)"}">
        ${d.expected - d.missingTables.length}/${d.expected}</b></div>
      <div><span>Pending migrations</span><b style="${d.pending.length ? "color:var(--warn)" : ""}">
        ${d.pending.length || "none"}</b></div>
      <div><span>Rows in sales</span><b>${(d.counts.sales || 0).toLocaleString()}</b></div>
    </div>
    ${d.ok ? "" : `<div class="warnbox" style="margin:14px">
      ${d.missingTables.map(t => `Missing table <b>${esc(t.table)}</b> — created by
        ${esc(t.owner)}.`).join("<br>")}
      ${d.missingColumns.map(c => `Table <b>${esc(c.table)}</b> is missing
        ${c.columns.map(x => esc(x)).join(", ")} — see ${esc(c.owner)}.`).join("<br>")}
      <br>Screens that read these will fail rather than showing an error.</div>`}
    ${busiest.length ? `<table><thead><tr><th>Table</th><th>Rows</th></tr></thead><tbody>
      ${busiest.map(([t, n]) => `<tr><td style="color:var(--txt2)">${esc(t)}</td>
        <td class="num">${n.toLocaleString()}</td></tr>`).join("")}
    </tbody></table>` : ""}
    <div class="note" style="padding:0 14px 14px">Checked at every boot. A missing table or column
      is reported here and in the server log rather than waiting to throw when somebody opens the
      screen that needs it.</div>`;
}

/* ------------------------------ register health --------------------------
   The thing you actually want at 8am: which tills are alive, what they're
   running, and whether any of them are holding sales they couldn't send. */
async function drawHealth() {
  const box = document.getElementById("healthBox");
  if (!box) return;
  let d;
  try { d = await api("/api/admin/health"); }
  catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  if (!d.terminals.length) {
    box.innerHTML = `<div class="empty">No registers have opened yet.</div>`;
    return;
  }

  const problems = d.terminals.filter(t => t.state === "gone" || t.queued > 0);
  box.innerHTML = `
    <div class="aitop">
      <div><span>Registers</span><b>${d.terminals.length}</b></div>
      <div><span>Live now</span><b style="color:var(--ok)">${d.live}</b></div>
      <div><span>Not seen in an hour</span><b style="${d.gone ? "color:var(--bad)" : ""}">${d.gone}</b></div>
      <div><span>Holding sales</span><b style="${d.queued ? "color:var(--warn)" : ""}">${d.queued}</b></div>
    </div>
    ${d.builds.length > 1 ? `<div class="warnbox" style="margin:14px">Running ${d.builds.length}
      different builds: ${d.builds.map(b => esc(b)).join(", ")}. A register on an old build may
      behave differently from the rest.</div>` : ""}
    <table><thead><tr><th>Store</th><th>Register</th><th>State</th><th>Build</th>
      <th>Agent</th><th>Queued</th></tr></thead><tbody>
      ${d.terminals.map(t => `<tr>
        <td style="color:var(--txt2)">${esc(t.store)}</td>
        <td><b>${esc(t.name)}</b> <span class="sub">lane ${t.number}</span></td>
        <td><span class="pill ${t.state === "live" ? "ok" : t.state === "idle" ? ""
          : "bad"}">${t.state === "live" ? "live" : t.state === "idle" ? "idle"
          : t.state === "never" ? "never seen" : "gone"}</span>
          ${t.minsAgo != null && t.state !== "live"
            ? `<span class="sub">${ago(t.lastSeen)}</span>` : ""}</td>
        <td class="num" style="color:var(--txt2)">${esc(t.build || "—")}</td>
        <td>${t.agent ? "yes" : `<span style="color:var(--txt3)">no</span>`}</td>
        <td class="num" style="${t.queued ? "color:var(--warn)" : "color:var(--txt3)"}">
          ${t.queued || "—"}</td>
      </tr>`).join("")}
    </tbody></table>
    ${problems.length ? `<div class="note" style="padding:0 14px 14px">
      ${problems.length} worth a look: ${problems.map(p =>
        `${esc(p.store)} ${esc(p.name)}${p.queued ? ` (${p.queued} unsent)` : ""}`).join(", ")}.</div>`
      : `<div class="note" style="padding:0 14px 14px">Everything checked in recently and nothing is
         holding unsent sales.</div>`}`;
}

/* ------------------------------ model usage ------------------------------ */
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : n;

async function drawAI() {
  const box = document.getElementById("aiBox");
  if (!box) return;
  let d;
  try { d = await api("/api/admin/ai?days=30"); }
  catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  if (!d.totals.calls) {
    box.innerHTML = `<div class="empty">No model calls in the last 30 days.</div>`;
    return;
  }
  box.innerHTML = `
    <div class="aitop">
      <div><span>Calls</span><b>${d.totals.calls.toLocaleString()}</b></div>
      <div><span>Tokens in</span><b>${fmt(d.totals.tin)}</b></div>
      <div><span>Tokens out</span><b>${fmt(d.totals.tout)}</b></div>
      <div><span>Failed</span><b style="${d.totals.failed ? "color:var(--bad)" : ""}">${
        d.totals.failed || 0}</b></div>
    </div>
    <table><thead><tr><th>Account</th><th>Calls</th><th>In</th><th>Out</th><th>Failed</th></tr></thead>
      <tbody>${d.byAccount.map(r => `<tr>
        <td><b>${esc(r.email || "deleted account")}</b></td>
        <td class="num">${r.calls}</td>
        <td class="num">${fmt(r.tin)}</td>
        <td class="num">${fmt(r.tout)}</td>
        <td class="num" style="${r.failed ? "color:var(--bad)" : "color:var(--txt3)"}">${r.failed || 0}</td>
      </tr>`).join("")}</tbody></table>
    <div class="note" style="padding:0 14px 14px">By kind: ${d.byKind.slice(0, 6)
      .map(k => `${esc(k.kind)} ${k.calls}`).join(" · ")}</div>`;
}

/* ------------------------------- storage -------------------------------- */
const mb = n => n == null ? "—" : n > 1e6 ? (n / 1048576).toFixed(1) + " MB"
  : (n / 1024).toFixed(0) + " KB";

async function drawStorage() {
  const box = document.getElementById("storeBox");
  if (!box) return;
  let d;
  try { d = await api("/api/admin/storage"); }
  catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  box.innerHTML = `
    <div class="aitop">
      <div><span>Database</span><b>${mb(d.db)}</b></div>
      <div><span>Sales rows</span><b>${d.rows.sales.toLocaleString()}</b></div>
      <div><span>Configs</span><b>${d.rows.configs}</b></div>
      <div><span>Audit rows</span><b>${d.rows.audit.toLocaleString()}</b></div>
    </div>
    ${d.backups.length ? `<table><thead><tr><th>Recent backups</th><th>Size</th><th>When</th></tr></thead>
      <tbody>${d.backups.map(b => `<tr>
        <td style="color:var(--txt2)">${esc(b.name)}</td>
        <td class="num">${mb(b.size)}</td>
        <td style="color:var(--txt3)">${ago(b.at)}</td></tr>`).join("")}</tbody></table>`
      : `<div class="note" style="padding:0 14px 14px">No backups found on disk.</div>`}`;
}

function veil(html) {
  const el = document.createElement("div");
  el.className = "veil";
  el.innerHTML = html;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) el.remove(); };
  return el;
}

/* Opening an account is a deliberate act with a reason attached, because the
   reason is what the tenant reads in their own activity log. */
function openS(id, email) {
  const el = veil(`<div class="modal">
    <h3>Open ${esc(email)}</h3>
    <p>This lets you read their stores, recent sales and activity. It expires on its own, and it
      appears in their activity log with the reason you give — so write something you'd be
      comfortable with them reading.</p>
    <input id="sr" placeholder="Why — e.g. they reported wrong totals on a Z report">
    <select id="sm">
      <option value="30">for 30 minutes</option>
      <option value="60" selected>for 1 hour</option>
      <option value="240">for 4 hours</option>
    </select>
    <div class="err" id="se" style="display:none"></div>
    <div class="row"><button class="no" id="sx">Cancel</button>
      <button class="go" id="sg">Open it</button></div></div>`);
  el.querySelector("#sx").onclick = () => el.remove();
  el.querySelector("#sg").onclick = async () => {
    const reason = el.querySelector("#sr").value.trim();
    const err = el.querySelector("#se");
    try {
      await api("/api/admin/support/open", { method: "POST",
        body: { account: id, reason, minutes: el.querySelector("#sm").value } });
      el.remove();
      viewAccount(id, email);
    } catch (e) { err.textContent = e.message; err.style.display = "block"; }
  };
  setTimeout(() => el.querySelector("#sr").focus(), 40);
}

async function closeS(id) {
  await api("/api/admin/support/close", { method: "POST", body: { account: id } });
  load();
}

async function viewAccount(id, email) {
  let d;
  try { d = await api("/api/admin/account/" + id); }
  catch (e) { return alert(e.message); }

  veil(`<div class="modal" style="max-width:820px">
    <h3>${esc(email)}</h3>
    <p>Support access is open. It closes on its own, or you can close it from the fleet page.</p>
    ${d.stores.map(s => `
      <h2 style="margin:22px 0 9px">${esc(s.name)} — ${s.sales.n} sales,
        ${money(s.sales.t || 0)} taken</h2>
      <div class="card"><table>
        <thead><tr><th>#</th><th>When</th><th>Who</th><th style="text-align:right">Total</th></tr></thead>
        <tbody>${s.recent.map(x => `<tr>
          <td class="num" style="color:var(--txt3)">${x.seq}</td>
          <td style="color:var(--txt2)">${esc(String(x.at).slice(0, 16))}</td>
          <td style="color:var(--txt2)">${esc(x.cashier || "—")}</td>
          <td class="num" style="text-align:right${x.is_return ? ";color:var(--bad)" : ""}">
            ${x.is_return ? "−" : ""}${money(Math.abs(x.total))}</td>
        </tr>`).join("") || `<tr><td colspan="4" class="empty">No sales.</td></tr>`}</tbody>
      </table></div>`).join("")}

    <h2 style="margin:22px 0 9px">Their activity</h2>
    <div class="card"><table><tbody>
      ${d.activity.map(a => `<tr>
        <td style="color:var(--txt3);width:32%">${esc(String(a.at).slice(0, 16))}</td>
        <td>${esc(a.action)}</td>
        <td style="color:var(--txt2)">${esc(a.detail || "")}</td>
      </tr>`).join("")}
    </tbody></table></div>

    <div class="row"><button class="no" onclick="this.closest('.veil').remove()">Close</button>
      <button class="go" onclick="closeS(${id});this.closest('.veil').remove()">
        End support access</button></div>
  </div>`);
}

api("/api/me").then(me => {
  $("who").textContent = me.account.email;
  /* An operator with no store has nothing to go back to. */
  const back = document.querySelector(".top a");
  if (back && !me.stores.length) back.remove();
}).catch(() => {});
load();
</script>
</body>
